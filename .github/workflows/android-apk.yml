name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type to assemble"
        type: choice
        options: [debug, release]
        default: debug
      java_version:
        description: "JDK version used for the Gradle build"
        default: "17"
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", ".gitignore"]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out what kind of project was imported, so the same workflow can build
  # a plain Gradle app, Flutter, React Native or Capacitor without being retuned.
  detect:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.detect.outputs.kind }}
      dir: ${{ steps.detect.outputs.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          set -euo pipefail
          kind=none
          dir=.
          if [ -f pubspec.yaml ] && grep -q '^[[:space:]]*flutter:' pubspec.yaml; then
            kind=flutter
          elif ls capacitor.config.* >/dev/null 2>&1 && [ -d android ]; then
            kind=capacitor
            dir=android
          elif [ -f package.json ] && [ -d android ]; then
            kind=react-native
            dir=android
          elif ls android/*.gradle* >/dev/null 2>&1; then
            kind=gradle
            dir=android
          elif ls ./*.gradle* >/dev/null 2>&1; then
            kind=gradle
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $kind (gradle dir: $dir)"

      # An ordinary push before the app is imported should stay green; only an
      # explicit "build me an APK" run has the right to fail here.
      - name: No Android project present
        if: steps.detect.outputs.kind == 'none'
        run: |
          msg="No Android project found. Expected a Gradle build (build.gradle[.kts] at the repo root or in android/), a Flutter pubspec.yaml, or a React Native / Capacitor project with an android/ directory."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::notice::$msg Skipping the APK build."

  build:
    needs: detect
    if: needs.detect.outputs.kind != 'none'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version || '17' }}
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Set up Node
        if: needs.detect.outputs.kind == 'react-native' || needs.detect.outputs.kind == 'capacitor'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dependencies
        if: needs.detect.outputs.kind == 'react-native' || needs.detect.outputs.kind == 'capacitor'
        run: npm ci || npm install

      - name: Sync Capacitor web assets
        if: needs.detect.outputs.kind == 'capacitor'
        run: npx cap sync android

      - name: Set up Flutter
        if: needs.detect.outputs.kind == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Optional release signing. Without these secrets a release build still
      # runs, it just produces an unsigned APK.
      - name: Decode release keystore
        id: keystore
        if: env.BUILD_TYPE == 'release' && env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build Flutter APK
        if: needs.detect.outputs.kind == 'flutter'
        run: flutter build apk --"$BUILD_TYPE"

      - name: Build Gradle APK
        if: needs.detect.outputs.kind != 'flutter'
        working-directory: ${{ needs.detect.outputs.dir }}
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$BUILD_TYPE" in
            debug)   task=assembleDebug ;;
            release) task=assembleRelease ;;
            *) echo "::error::Unknown build type '$BUILD_TYPE'"; exit 1 ;;
          esac
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew "$task" --stacktrace
          else
            gradle "$task" --stacktrace
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          found=0
          while IFS= read -r apk; do
            cp "$apk" artifacts/
            echo "Found $apk"
            found=1
          done < <(find . -path ./artifacts -prune -o -name '*.apk' -print)
          if [ "$found" -eq 0 ]; then
            echo "::error::The build reported success but produced no .apk file."
            exit 1
          fi
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: epic-jarvis-${{ env.BUILD_TYPE }}-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
