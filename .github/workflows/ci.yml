# The 21 unit tests in this repo had nothing to run them until now, and the
# checks below are exactly the ones that were being typed by hand — including
# the two that would have caught real bugs: `cargo test` covers the ported
# colour engine, the SSE frame parser and the process-tree killer, and the
# markdown suite covers a parser that ran on every streamed token.
name: CI

on:
  push:
    branches: ["**"]
    # A push that changes ONLY these files runs nothing: no test reads them
    # (checked 2026-09-26 - the suites read docs/*.md, backend/README.md and
    # CHANGELOG.md, so those are NOT listed). Every changed file must be on
    # this list for a run to be skipped; one other file and everything runs.
    paths-ignore:
      - "CLAUDE.md"
      - "README.md"
  # Pull requests into main only (every other branch is already checked by
  # its push). No path filter here, so a required check on a pull request
  # always reports instead of waiting for a run that never starts.
  pull_request:
    branches: [main]

# A newer push to the same branch (or pull request) stops the older run: its
# result would be out of date before it finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

# Every action is pinned to a full commit, like the other workflows (a tag can
# be moved to different code after it was checked). The tag each commit stood
# for on 2026-09-26, read from that action's own tag list, is beside it. All
# of them run on Node 24 (Node 20 is being retired on GitHub's runners).

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # The product is a Windows app. Checking it anywhere else would type-check
    # the wrong half of every `#[cfg(windows)]`.
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: jarvis-desktop/src-tauri
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # Pinned to a commit, this action cannot read the toolchain from its
      # ref, so it is named here (as in desktop-release.yml).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: jarvis-desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    # 90, was 45. The suites run one after another in this one job and have
    # grown to about 45 minutes: main's run for PR #29 took 43, and PR #30's
    # merge was CANCELLED at the 45-minute limit with every test still passing
    # (2026-09-29). Raising the limit skips nothing; if it keeps growing, split
    # the loop below across a matrix instead.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jarvis-desktop
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      # No bundler and no test framework: the pages are plain ES modules, so a
      # parse check is what there is. It would have caught nothing in this
      # repo's history — the frontend bugs were behavioural — but it is the
      # floor, and the markdown suite below is the part that matters.
      - run: for f in src/*.js; do node --check "$f"; done
        shell: bash
      - run: node scripts/markdown-test.mjs
      - run: python3 scripts/check-tokens.py
      # EVERY suite in tests/, not a hand-picked few. Most of them open the
      # real pages in a headless Chromium (tests/uikit.mjs), which is why only
      # three used to run here. Playwright is not a dependency of the app
      # (tests/README.md says why), so it is installed for this job only.
      # uikit.mjs is the harness, not a suite; shots.mjs only writes
      # screenshots. Every suite runs even after one fails, so one red run
      # lists every failure at once.
      - name: Install Playwright's Chromium (for the page tests only)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Every desktop test suite
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for f in tests/*.mjs; do
            name=$(basename "$f")
            case "$name" in uikit.mjs|shots.mjs) continue ;; esac
            echo "::group::$name"
            if node "$f"; then echo "ok  $name"; else failed+=("$name"); fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} desktop suite(s) failed: ${failed[*]}"
            exit 1
          fi
          echo "Every desktop suite passed."

  backend:
    # The backend suites, including every contract test (the ones that read
    # the phone's Kotlin and the desktop's Rust and JS and check them against
    # the real Python). About twenty suites test a patch against the owner's
    # own jarvis_hud.py / jarvis_gate.py / jarvis_extract.py, which are not in
    # this repository - backend/run_suites.py SKIPS those by name, with the
    # files each is waiting for, and fails on anything else. The voice suites
    # (test_speech, test_voice_contract, test_wakeword) need the three voice
    # packages from backend/requirements.txt, and test_chat_log needs
    # `cryptography` (chat history is encrypted); nothing else from it is needed,
    # and the memory ones (fastembed, sqlite-vec) are left out on purpose -
    # the suites use a hash embedder and must pass without them.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The WHOLE history, not the last commit: test_patch_history.py
          # rebuilds backend/patch-history from `git log` and fails if the
          # committed copy differs. In a shallow clone it has nothing to
          # read, and with CI set it fails rather than skip.
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      # Exact versions, the ones backend/requirements.lock pins for Python 3.12
      # (numpy 2.5.3 and onnxruntime 1.30.0 are that file's picks for 3.12; the
      # lock is hash-checked, this line is not - so at least the version is fixed,
      # and a new release cannot change what CI tests overnight). Update these
      # together with the lock. Supply-chain audit, 2026-09-30.
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 sherpa-onnx==1.13.8 onnxruntime==1.30.0 cryptography==50.0.1
      - name: Backend suites (the ones that need no file from the owner's PC)
        # The FAILING SUITE NAMES are the useful part of a red run, and they
        # were only in a thirteen-minute log - which needs a signed-in browser
        # to read, so a failure here could not be diagnosed from a terminal
        # (2026-10-04). They now also go to this run's Summary, and each one
        # becomes an ::error:: annotation, which the checks API serves to
        # anyone. The step still fails exactly as it did.
        #
        # `set +e` around the run is deliberate: GitHub runs this script under
        # `bash -e`, so the failing pipeline aborted the step before a single
        # annotation was written - which is what the first version of this step
        # did.
        run: |
          set +e
          python backend/run_suites.py 2>&1 | tee "$RUNNER_TEMP/backend-suites.txt"
          status=${PIPESTATUS[0]}
          set -e
          fails=$(grep -E '^FAIL ' "$RUNNER_TEMP/backend-suites.txt" || true)
          if [ -n "$fails" ]; then
            # One annotation per failing suite, carrying that suite's OWN FAIL
            # lines: the failing checks are the useful part, and an annotation
            # can be read through the public checks API - no log, no browser.
            # Each suite is re-run on its own through run_suites.py, so it gets
            # the same staged backend the sweep gave it.
            while IFS= read -r line; do
              name=$(echo "$line" | awk '{print $2}')
              [ -n "$name" ] || continue
              detail=$(python "backend/run_suites.py" "$name" 2>&1 \
                       | grep -A6 -E '^      FAIL ' | head -40 | tr '\n' '|' | cut -c1-1200)
              echo "::error title=Failing backend suite: $name::$detail"
            done <<< "$fails"
          fi
          {
            echo "### Backend suites (Ubuntu)"
            echo ""
            echo '```'
            grep -E '^(FAIL |skip |[0-9]+ passed)' "$RUNNER_TEMP/backend-suites.txt" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Desktop and phone call the same backend; a route one calls and the
      # other does not has to be a recorded decision (tools/check_parity.py).
      - name: Desktop / phone parity
        run: python tools/check_parity.py
      # The animal faces' shader is generated for both apps from one source
      # (tools/gen_critters.py), and must stay under the size Android's shader
      # compiler accepts: over it, Android refuses the shader and the phone
      # app crashes the moment the face is drawn - while the desktop, and a
      # newer Skia on a PC, accept it without a word. The first red panda
      # shipped four times over and was caught only by the emulator test.
      - name: Animal faces - generated copies fresh, shader within Android's size limit
        run: |
          sudo apt-get install -y -q glslang-tools > /dev/null
          python tools/gen_critters.py --check
          python tools/shader_size.py --check
      # The mouths' lip-sync analysis is written twice - lipsync.js on the
      # desktop, LipSync.kt on the phone - and the phone's LipSyncTest checks
      # its copy against a fixture the JavaScript writes. A stale fixture
      # would let the two drift apart with every test still green.
      - name: Lip-sync - the phone's golden fixture matches lipsync.js
        run: python tools/gen_lipsync.py --check
      # The sun, the moon and the weather behind the animals are worked out
      # twice - sky.js on the desktop, Sky.kt on the phone - and the phone's
      # SkyTest checks its copy against a fixture the JavaScript writes; the
      # desktop's own test checks the astronomy against published times.
      # sky-cases.json is what GET /api/sky really answers, for both apps.
      - name: Sky - the phone's golden fixture matches sky.js, and the astronomy
        run: |
          python tools/gen_sky.py --check
          python tools/gen_sky_cases.py --check
          node jarvis-desktop/tests/sky.mjs
      # "Animal options" (2026-09-28): what GET /api/animal answers and the
      # one rule for "make the animal sharper", made by jarvis_animal.py, for
      # both apps - so their fallback words and their stepping cannot drift.
      - name: Animal options - both apps' contract matches jarvis_animal.py
        run: |
          python tools/gen_animal_cases.py --check
          node jarvis-desktop/tests/animal-settings.mjs
      # The animals' new behaviours as the desktop feeds them (the moments'
      # relay, the lock rules) and the faces at every speed of Jarvis's
      # voice (the phrase-end finder, the robot's eye pulse). Both also run,
      # whole, in the frontend job's every-suite loop; here - with no browser
      # installed - animal-behaviours runs its browser-free half and skips
      # the face page, as sky.mjs does, and voice-speed needs no browser.
      - name: Animal behaviours and voice speed - the browser-free checks
        run: |
          node jarvis-desktop/tests/animal-behaviours.mjs
          node jarvis-desktop/tests/voice-speed.mjs
          node jarvis-desktop/tests/animal-motion.mjs
          node jarvis-desktop/tests/animal-lids.mjs
      # Seasonal touches (leaves, snow, blossom, fireflies, a few holidays)
      # are worked out twice - season.js on the desktop, Season.kt on the
      # phone - and the phone's SeasonTest checks its copy against a fixture
      # the JavaScript writes.
      - name: Seasonal touches - the phone's golden fixture matches season.js
        run: |
          python tools/gen_season.py --check
          node jarvis-desktop/tests/season.mjs
      # A command registered in lib.rs but missing from build.rs's own ACL
      # export list has no permission at all, and every window's call to it
      # is refused at runtime - a compile-time-invisible break that bit two
      # commands for real (bug audit 2026-09-27, desktop-rust finding #2).
      - name: Desktop command ACL parity
        run: python tools/check_command_acl.py

  backend-windows:
    # The Windows half of the backend job above. CI ran the backend suites on
    # Ubuntu only, which is why about fifteen of them turned out to assume
    # Linux (docs/HANDOFF-2026-10-04-test-suite-fixes.md, section 7 item 3).
    # Ubuntu cannot answer "does this suite pass on the operating system the
    # owner actually runs". This job can - for the subset of suites that need
    # nothing from the owner's PC.
    #
    # WHY THIS SUBSET, AND HOW IT WAS CHOSEN. All 244 backend suites were run
    # in repo mode on the owner's Windows 11 PC, one at a time, with
    # JARVIS_BACKEND unset (so backend/_where.py uses this repository's own
    # backend/ folder and require_shipped() does nothing) and
    # PYTHONIOENCODING=utf-8 (the console there is cp1252). 208 exited 0. Each
    # of those was then run again with OLLAMA_URL pointed at a closed port and
    # with only the packages installed below - the two things a GitHub runner
    # has and the owner's PC does not. That is the list below. Nothing is in it
    # because it looked likely to work: every line is a suite that exited 0
    # with no model and no extra package.
    # dshwork/audit-2026-10-04/audit-03-windows-ci.md has the exit code and the
    # "N passed, M failed" line for all 244, and the reason each of the other
    # 36 is left out.
    #
    # WHAT IS DELIBERATELY NOT HERE. Four kinds of suite the Ubuntu job runs:
    #
    #   * the ones that need a file only the owner's PC has - jarvis_hud.py,
    #     jarvis_gate.py, jarvis_extract.py, jarvis_models.py, jarvis_skills.py.
    #     In repo mode those are a traceback rather than a skip, because the
    #     skip list lives in run_suites.py, not in the suites.
    #   * the ones that need one of the ten rebuilt modules in backend/rebuilt/
    #     on sys.path. run_suites.py is what flattens those onto sys.path (into
    #     a staged copy of the backend), so in repo mode they fail on the
    #     import. test_agent.py is the one that shows the difference plainly: 5
    #     failures in repo mode, and `python backend/run_suites.py test_agent.py`
    #     passes on this same machine.
    #   * test_patch_history.py, which passed here only because this copy of the
    #     repository has no .git at all; in CI it needs the whole history
    #     (`fetch-depth: 0`, which the Ubuntu job above sets and this one does
    #     not), and the owner's PC is a downloaded ZIP.
    #   * test_chat_stream_contract.py, from 2026-10-05. It compares the three
    #     copies of chat-stream-cases.json with what the producer makes TODAY,
    #     and on this runner all three say "stale or missing" - a real
    #     difference in the produced bytes that nobody has found yet. It is
    #     NOT stale in git: the three blobs are byte-identical on this branch
    #     and on main, and the suite passes on the Ubuntu job above and on the
    #     owner's PC, so only this runner disagrees. Ruled out one at a time
    #     here, by running the suite with each: the runner's 8.3 short-named
    #     %TEMP% (C:\Users\RUNNER~1\...), CRLF in the checkout (Path.read_text
    #     undoes it), PYTHONHASHSEED 0-9, the CI state folder and framework
    #     TOML, a closed OLLAMA_URL, and the machine's own hardware or Ollama
    #     (the Ubuntu runner has neither either). The check is not lost - the
    #     Ubuntu job runs it on every push. Take this line out again as soon as
    #     someone has a Windows runner and a minute to look at the real bytes.
    #
    # AND THE ONE EXCLUSION THAT HAS BEEN LIFTED. test_apply_outcomes.py was
    # taken out of the list below on 2026-10-05, when its byte-level checks -
    # after a run the backend files must be LF and patched, and -Revert must
    # put the original bytes back - could not pass on Windows: `git apply`
    # writes the file through git's line-ending conversion, so with
    # core.autocrlf=true an LF target and an LF patch still come out CRLF.
    # Measured on this PC with three lines of Python and a three-line patch:
    # autocrlf=true -> the result has CRLF, `-c core.autocrlf=false` -> it does
    # not, and `git config --get core.autocrlf` here says true. The Ubuntu job
    # has the setting unset, which is why it always passed there.
    #
    # THE FIX LANDED IN 677844d6. scripts/apply-patches.ps1 now pins
    # `-c core.autocrlf=false -c core.eol=lf` on the one `git apply` call that
    # writes files, measured in a scratch repo as CR=3 before that commit and
    # CR=0 after, with --check and --reverse both verified. It also fixes a
    # real bug on the owner's PC, where core.autocrlf=true was making patched
    # files come out CRLF. So the suite is back in the list below, and THE NEXT
    # WINDOWS RUN IS WHAT VERIFIES IT: nobody has seen it green on a Windows
    # runner yet.
    #
    # Nothing on the owner's PC can stand in for that run. PowerShell 7 was not
    # installed there when the exclusion was written; it is now, and the suite
    # still cannot reach those checks - it builds its own repository out of
    # symlinks, which Windows refuses without elevation (WinError 1314). Run
    # here it ends 8 passed, 11 failed, with all 11 at that symlink step, so
    # the real `git apply` runs are among the 11 and only the -FixLineEndings
    # group of 8 actually ran (it passed). The four other FAILs the suite had
    # WERE fixed and are verified on the runner - see the run below.
    #
    # This is NOT "run_suites.py again, on Windows" on purpose: that would
    # stage the modules, so it would no longer be the configuration measured
    # and recorded here, and the whole sweep already takes about 25 minutes on
    # Ubuntu. What this job is for is the suites that assumed Linux.
    #
    # IT RAN ON GITHUB FOR THE FIRST TIME ON 2026-10-05 (PR #47, run
    # 37349552106, job 111896626984) and ended:
    #
    #   ##[error]6 backend suite(s) failed on Windows: test_apply_outcomes.py,
    #   test_chat_stream.py, test_chat_stream_contract.py, test_note_capture.py,
    #   test_obsidian_notes.py, test_spending.py
    #
    # The run after the fixes (37360119210, job 111932654472, 207 suites) ended
    # with one:
    #
    #   ##[error]1 backend suite(s) failed on Windows: test_apply_outcomes.py
    #   ##[error]test_apply_outcomes.py exited 1        (56 passed, 3 failed)
    #
    # and those three are the git line endings above. The four FAILs that suite
    # also had went green on the runner in that run, so the 8.3 short-name fix
    # in it is verified on Windows, not just here. What the first run found, in
    # one line each - none of it reproducible on the owner's PC:
    #
    #   test_note_capture.py, test_obsidian_notes.py
    #        FileExistsError: [WinError 183] ... graph<ns>\logseq - a throwaway
    #        folder was named from time.time_ns(), which on Windows only moves
    #        on the system timer tick, so two calls in one tick asked for the
    #        same folder.
    #   test_spending.py
    #        STALE spending-cases.json - the fixture was normalised against the
    #        short spelling of %TEMP% while the paths inside it had been
    #        through os.path.realpath(), which gives the long one.
    #   test_chat_stream.py
    #        FAIL the owner is told why, on the doorbell - the app was made to
    #        die "after the first write", which on a slower machine happens
    #        during the model round, so the turn ended on the path that rings
    #        no doorbell.
    #   test_apply_outcomes.py
    #        7 FAILs: 4 because -BackendPath was handed to the script in its
    #        8.3 short spelling, which PowerShell echoes two ways
    #        ((Get-Location).Path gives the long form,
    #        (Resolve-Path -LiteralPath ...).Path the short one), so the test's
    #        own mid-way-failure hook never fired; the other 3 the line endings
    #        above.
    #
    # A LATER RUN FOUND THE TIMER-TICK CAUSE ONCE MORE (run 37369387182, job
    # 111962928099, 2026-10-05) - this time in test_backup.py, which is in the
    # list below and stays there:
    #
    #   test_backup.py        123 passed, 4 failed: the four checks
    #        t_backup_now_is_this_pc_only_no_card_needs_a_folder,
    #        t_restore_never_writes_outside_its_own_folders,
    #        t_retention_never_deletes_the_file_just_written and
    #        t_a_same_second_backup_sorts_newer_and_survives each died in
    #        fresh_conf() before its own first check ran - hence 4 FAILs and no
    #        "FAIL ..." lines. FileExistsError: [WinError 183] on
    #        conf-1791232696015878900 (and one on backups-1791232692749314200).
    #        Same cause as the two suites above: it named its throwaway folders
    #        from time.time_ns(), which only moves on the system timer tick.
    #        Measured on the owner's PC: 155 FileExistsError(s) in 400 calls of
    #        the old two-mkdir body, 0 in 400 with tempfile.mkdtemp. RULED OUT,
    #        by reading what the four checks assert and the job's own log:
    #        jarvis_documents.check_folder() refusing the temp folder (the suite
    #        already asks it first in _scratch_root and falls back beside the
    #        user's home - it ran from C:\Users\runneradmin\.jarvis-backup-tests-*),
    #        a path length or separator problem (the failing path is 88 bytes),
    #        and the runner's %USERPROFILE% shape (the same fallback root is
    #        used for a whole run, and the other 123 checks passed there). The
    #        same-second name collision the checks exist for is untouched: it is
    #        a backup FILE name (jarvis-backup-<stamp>-2), not a folder name.
    runs-on: windows-latest
    # 90 minutes, chosen rather than derived. Measured on the owner's 24-core
    # PC while another audit was running: 31 minutes of suite time in repo mode
    # with the live model, 43 minutes in the CI-like pass with eight shards
    # contending. The Ubuntu job that runs about 230 suites has a 25-minute
    # limit; a Windows runner is slower and has no graphics card. The frontend
    # job above was CANCELLED at 45 minutes with every test still passing, so
    # this ceiling is deliberately generous rather than tight.
    timeout-minutes: 90
    defaults:
      run:
        # The suites are run from backend/, which is where a person runs them
        # and where the local measurement was taken.
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      # The four pins the Ubuntu backend job installs, for the same reason: a
      # new release must not change what CI tests overnight. Update these
      # together with requirements.lock. Nothing else from it - the memory
      # packages (fastembed, sqlite-vec) are left out there and here, on
      # purpose, and every suite below passes without them.
      #
      # Then the two the Ubuntu job cannot install, because they are Windows
      # only and Ubuntu does not need them: backend/requirements.txt asks for
      # both under `sys_platform == "win32"`, and both versions are read from
      # backend/requirements.lock, the same place the four above come from.
      #   tzdata       - Windows has no time-zone database of its own, so
      #                  zoneinfo resolves no named zone without it.
      #   uiautomation - what tells a password box from any other box on the
      #                  screen (jarvis_screen_win.py).
      # Measured 2026-10-04: without them, test_progress.py fails with
      # "No module named 'tzdata'" and test_screen_win.py fails with "The
      # 'uiautomation' package is missing"; with them both pass. On Ubuntu both
      # suites pass without either, so the gap was invisible to CI.
      - run: python -m pip install --disable-pip-version-check numpy==2.5.3 sherpa-onnx==1.13.8 onnxruntime==1.30.0 cryptography==50.0.1 tzdata==2026.4 uiautomation==2.0.29
      - name: Backend suites that need no file from the owner's PC, on Windows
        # One step, not two: an environment variable set in one step does not
        # reach the next one.
        run: |
          # The suites run real code that writes - the audit log, approval
          # queues, switch files - so their state goes to a throwaway folder
          # first, the same way run_suites.py's private_state() does it on the
          # Ubuntu side: both config variables, and a copy of the framework
          # TOML with log_directory rewritten (it otherwise points at
          # ~/.openjarvis/logs/ whoever is running). Without this the command
          # here would not be the command that was run and recorded locally.
          $state = Join-Path $env:RUNNER_TEMP 'jarvis-suite-state'
          New-Item -ItemType Directory -Force -Path $state, (Join-Path $state 'logs') | Out-Null
          $env:OPENJARVIS_CONFIG_DIR = $state
          $env:JARVIS_CONFIG_DIR = $state
          $toml = Get-Content -LiteralPath 'rebuilt/jarvis-framework.toml' -Raw
          $toml = $toml -replace '(?m)^log_directory\s*=.*$', "log_directory = '$($state -replace '\\','/')/logs/'"
          [IO.File]::WriteAllText((Join-Path $state 'jarvis-framework.toml'), $toml,
                                  (New-Object System.Text.UTF8Encoding $false))
          $env:JARVIS_FRAMEWORK_TOML = Join-Path $state 'jarvis-framework.toml'
          # cp1252 is the code page on the owner's console, and many suites
          # print a character it cannot encode; the suite would exit 1 with a
          # UnicodeEncodeError while the check it was running had passed.
          $env:PYTHONIOENCODING = 'utf-8'
