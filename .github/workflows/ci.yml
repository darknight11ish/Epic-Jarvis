  credential-manager:
    # The pairing token lives in Windows Credential Manager (CLAUDE.md rule 3,
    # backend/jarvis_token_store.py). Linux has no Credential Manager, so the
    # backend job above only tests the logic against a stand-in; this runs the
    # real ctypes calls - write, read back, move an old file in, delete - on
    # real Windows, under a throwaway name, never a real token. The same for
    # the four account secrets (ease-of-use audit row 15) that reuse the same
    # store through jarvis_token_store.resolve_secret.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Token store, live against Credential Manager
        run: python backend/test_token_store.py
      - name: Account secrets, live against Credential Manager
        run: python backend/test_account_secrets.py

  powershell-5:
    # The owner runs these scripts in Windows PowerShell 5.1, not 7. 5.1 does
    # not know `??`, `?:`, `&&` or `||`, and reads a script file that has no
    # BOM as ANSI (Windows-1252), not UTF-8 - so a non-ASCII character in
    # code can become a quote mark and end a string early. Caught here, by
    # 5.1 itself, before the owner has to paste an error back. Then
    # apply-patches.ps1 is actually RUN, in 5.1, against a stand-in backend,
    # to prove it copies what it ships and never overwrites a settings file.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse every .ps1 with Windows PowerShell 5.1
        run: |
          "PowerShell $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "expected Windows PowerShell 5.x" }
          $bad = 0
          $files = @(Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\node_modules\\' })
          foreach ($f in $files) {
            # Get-Content with no -Encoding reads the way 5.1 reads a
            # script: ANSI, unless the file starts with a BOM.
            $text = Get-Content -LiteralPath $f.FullName -Raw
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $bad++
              "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            foreach ($t in $tokens) {
              if ($t.Kind -ne 'Comment' -and $t.Text -match '[^\x00-\x7F]') {
                $bad++
                "::error file=$($f.FullName),line=$($t.Extent.StartLineNumber)::non-ASCII outside a comment ($($t.Kind)); 5.1 reads this file as ANSI"
              }
            }
            "parsed  $($f.FullName)"
          }
          "$($files.Count) script(s), $bad problem(s)"
          if ($bad -gt 0) { exit 1 }
      - name: Run get-export.ps1's manifest-name self-test in 5.1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\get-export.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "get-export self-test exited $LASTEXITCODE" }
      - name: Run apply-patches.ps1 in 5.1 against a stand-in backend
        run: |
          $ErrorActionPreference = 'Stop'
          # A copy of the repository's scripts and backend with the patch
          # list emptied: the stand-in has no real jarvis_hud.py for a patch
          # to apply to. What is under test is everything after patching:
          # the modules, the backups, the settings file.
          $repo = Join-Path $env:RUNNER_TEMP 'repo'
          $be = Join-Path $env:RUNNER_TEMP 'backend'
          $cfg = Join-Path $env:RUNNER_TEMP 'cfg'
          New-Item -ItemType Directory -Force -Path $repo, $be, $cfg | Out-Null
          Copy-Item -Recurse scripts, backend -Destination $repo
          # The script also reads jarvis-desktop\src-tauri\Cargo.lock from the
          # repository root (the "Check for tool updates" file, step 3b), and
          # now says so when it is missing, so the copy carries it too.
          New-Item -ItemType Directory -Force -Path (Join-Path $repo 'jarvis-desktop\src-tauri') | Out-Null
          Copy-Item jarvis-desktop\src-tauri\Cargo.lock (Join-Path $repo 'jarvis-desktop\src-tauri')
          Remove-Item (Join-Path $repo 'backend\*.patch')
          $ps1 = Join-Path $repo 'scripts\apply-patches.ps1'
          $t = [IO.File]::ReadAllText($ps1)
          $t2 = [regex]::Replace($t, '(?s)\$PATCHES = @\(.*?\n\)', '$$PATCHES = @()')
          if ($t2 -eq $t) { throw "could not empty the patch list" }
          [IO.File]::WriteAllText($ps1, $t2)
          Set-Content -LiteralPath (Join-Path $be 'jarvis_hud.py') -Value 'print("stand-in")'
          Set-Content -LiteralPath (Join-Path $be 'jarvis_notes.py') -Value '# an older copy'
          $env:OPENJARVIS_CONFIG_DIR = $cfg

          powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -BackendPath $be -SkipPackages -SkipTests
          if ($LASTEXITCODE -ne 0) { throw "first run exited $LASTEXITCODE" }

          # Every shipped module is there, and is this repository's copy.
          $where = [IO.File]::ReadAllText((Join-Path $repo 'backend\_where.py'))
          # Only the SHIPPED tuple: the rest of _where.py names other files too
          # (HUD = BACKEND / "jarvis_hud.py"), and one of those is the owner's own.
          $block = [regex]::Match($where, '(?s)\nSHIPPED = \((.*?)\n\)').Groups[1].Value
          $shipped = @([regex]::Matches($block, '"((?:rebuilt/)?jarvis_\w+\.py)"') | ForEach-Object { $_.Groups[1].Value })
          if ($shipped.Count -lt 20) { throw "read only $($shipped.Count) names from _where.SHIPPED" }
          foreach ($m in $shipped) {
            $leaf = Split-Path -Leaf $m
            $got = Join-Path $be $leaf
            if (-not (Test-Path -LiteralPath $got)) { throw "$leaf was not copied in" }
            $want = Join-Path (Join-Path $repo 'backend') $m
            if ((Get-FileHash $got).Hash -ne (Get-FileHash $want).Hash) { throw "$leaf is not the repository's copy" }
          }
          "all $($shipped.Count) shipped modules were copied in"
          $backups = @(Get-ChildItem -Directory -LiteralPath $be -Filter '_jarvis-backup-*')
          if ($backups.Count -eq 0 -or -not (Test-Path -LiteralPath (Join-Path $backups[0].FullName 'jarvis_notes.py'))) { throw "the older jarvis_notes.py was not backed up" }
          "the older jarvis_notes.py was backed up"

          # There was no settings file anywhere, so one went beside jarvis_hud.py.
          $toml = Join-Path $be 'jarvis-framework.toml'
          if (-not (Test-Path -LiteralPath $toml)) { throw "no jarvis-framework.toml was installed" }

          # The owner edits it; a second run must leave it exactly as it is.
          Add-Content -LiteralPath $toml -Value "`n[ci_owner_edit]`nkept = true"
          $before = (Get-FileHash $toml).Hash
          powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -BackendPath $be -SkipPackages -SkipTests
          if ($LASTEXITCODE -ne 0) { throw "second run exited $LASTEXITCODE" }
          if ((Get-FileHash $toml).Hash -ne $before) { throw "the second run changed the owner's jarvis-framework.toml" }
          "the owner's settings file was left alone"
      - name: apply-patches.ps1 in 5.1 replaces an OLDER version of a patch
        run: |
          # The owner may have run the script before some patches were edited
          # here, and the current text of an edited patch cannot take its old
          # text off. So: a made-up backend and a made-up list of three
          # patches. The backend carries the first patch and an OLD text of
          # the second (the third was added to the list since). The script
          # must find that old text in backend\patch-history - after trying a
          # newer old text that is NOT there - take it off, and leave exactly
          # what the current list gives. A text that was never published
          # must be refused with the file untouched and no backup made.
          $ErrorActionPreference = 'Stop'
          # Native programs run with 'Continue', so what they write to
          # stderr is output, not a terminating error (CLAUDE.md's trap).
          function Invoke-Native([string] $Exe, [string[]] $Arguments) {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try { $out = & $Exe @Arguments 2>&1 | Out-String; $code = $LASTEXITCODE } finally { $ErrorActionPreference = $prev }
            return @{ Code = $code; Out = $out }
          }
          function Assert-Native([string] $Exe, [string[]] $Arguments) {
            $r = Invoke-Native $Exe $Arguments
            if ($r.Code -ne 0) { throw "$Exe $($Arguments -join ' ') exited $($r.Code): $($r.Out)" }
          }
          function Write-Lf([string] $Path, [string] $Content) {
            [IO.File]::WriteAllText($Path, $Content, (New-Object System.Text.UTF8Encoding $false))
          }
          # Why two texts differ, in one line: a wrong LINE ENDING (Windows
          # git turning LF into CRLF on write) reads very differently from
          # wrong CONTENT, and the first time this step ran on Windows it
          # failed without saying which.
          function Get-Diff([string] $Got, [string] $Want) {
            $cr = ([regex]::Matches($Got, "`r")).Count
            $same = ($Got -replace "`r`n", "`n") -eq $Want
            return "got $($Got.Length) chars with $cr CR; expected $($Want.Length) chars with 0 CR; same apart from line endings: $same"
          }
          function Assert-Text([string] $Path, [string] $Want, [string] $Why) {
            $got = [IO.File]::ReadAllText($Path)
            if ($got -ne $Want) { throw "$Why - $(Get-Diff $got $Want)" }
          }
          # What the SCRIPT leaves. Windows git with its default
          # core.autocrlf=true reads a file as LF and writes it back CRLF -
          # measured here on 2026-09-24: all 40 lines came back CRLF, the
          # content otherwise identical. Python reads both the same, and git
          # reads it back as LF again, so a second run still recognises every
          # patch (case 2 checks exactly that). So the content must match
          # exactly, and the endings must be ONE kind throughout - a file
          # with some CRLF lines and some LF lines is refused.
          function Assert-Result([string] $Path, [string] $Want, [string] $Why) {
            $got = [IO.File]::ReadAllText($Path)
            $cr = ([regex]::Matches($got, "`r`n")).Count
            $lf = ([regex]::Matches($got, "`n")).Count
            if (($got -replace "`r`n", "`n") -ne $Want) { throw "$Why - $(Get-Diff $got $Want)" }
            if ($cr -ne 0 -and $cr -ne $lf) { throw "$Why - mixed line endings: $cr of $lf lines are CRLF" }
            return $got
          }
          # A 40-line jarvis_hud.py with some lines changed (0-based index).
          function Get-Hud([hashtable] $Changes) {
            $lines = @(1..40 | ForEach-Object { "line $_" })
            foreach ($k in $Changes.Keys) { $lines[$k] = $Changes[$k] }
            return (($lines -join "`n") + "`n")
          }
          # A git-format patch taking jarvis_hud.py from one state to another.
          function New-ToyPatch([hashtable] $Before, [hashtable] $After, [string] $Out) {
            $g = Join-Path $env:RUNNER_TEMP 'toy-gen'
            if (Test-Path -LiteralPath $g) { Remove-Item -LiteralPath $g -Recurse -Force }
            New-Item -ItemType Directory -Path $g | Out-Null
            Assert-Native 'git' @('-C', $g, 'init', '-q')
            Assert-Native 'git' @('-C', $g, 'config', 'core.autocrlf', 'false')
            Write-Lf (Join-Path $g 'jarvis_hud.py') (Get-Hud $Before)
            Assert-Native 'git' @('-C', $g, 'add', 'jarvis_hud.py')
            Write-Lf (Join-Path $g 'jarvis_hud.py') (Get-Hud $After)
            Assert-Native 'git' @('-C', $g, 'diff', "--output=$Out")
            if (-not (Test-Path -LiteralPath $Out) -or (Get-Item -LiteralPath $Out).Length -eq 0) { throw "no patch written to $Out" }
          }

          $one    = @{ 4 = 'line 5 - one' }
          $twoOld = @{ 4 = 'line 5 - one'; 19 = 'line 20 - two, as first published' }
          $decoy  = @{ 4 = 'line 5 - one'; 19 = 'line 20 - two, some other old text' }
          $never  = @{ 4 = 'line 5 - one'; 19 = 'line 20 - two, hand-edited, never published' }
          $twoNew = @{ 4 = 'line 5 - one'; 19 = 'line 20 - two, as it is now'; 24 = 'line 25 - two, added later' }
          $three  = @{ 4 = 'line 5 - one'; 19 = 'line 20 - two, as it is now'; 24 = 'line 25 - two, added later'; 34 = 'line 35 - three' }

          # A copy of the repository with the made-up list and history.
          $repo = Join-Path $env:RUNNER_TEMP 'repo-old'
          New-Item -ItemType Directory -Force -Path $repo | Out-Null
          Copy-Item -Recurse scripts, backend -Destination $repo
          # The script also reads jarvis-desktop\src-tauri\Cargo.lock from the
          # repository root (the "Check for tool updates" file, step 3b), and
          # now says so when it is missing, so the copy carries it too.
          New-Item -ItemType Directory -Force -Path (Join-Path $repo 'jarvis-desktop\src-tauri') | Out-Null
          Copy-Item jarvis-desktop\src-tauri\Cargo.lock (Join-Path $repo 'jarvis-desktop\src-tauri')
          $pd = Join-Path $repo 'backend'
          Remove-Item (Join-Path $pd '*.patch')
          Remove-Item -LiteralPath (Join-Path $pd 'patch-history') -Recurse -Force
          New-ToyPatch @{} $one (Join-Path $pd 'toy-one.patch')
          New-ToyPatch $one $twoNew (Join-Path $pd 'toy-two.patch')
          New-ToyPatch $twoNew $three (Join-Path $pd 'toy-three.patch')
          $hist = Join-Path $pd 'patch-history\toy-two'
          New-Item -ItemType Directory -Force -Path $hist | Out-Null
          New-ToyPatch $one $decoy (Join-Path $hist 'bbbbbbb.patch')
          New-ToyPatch $one $twoOld (Join-Path $hist 'aaaaaaa.patch')
          $tab = [char]9
          Write-Lf (Join-Path $pd 'patch-history\index.tsv') (
            "# made up for this test`n" +
            "toy-two.patch${tab}toy-two/bbbbbbb.patch${tab}bbbbbbb0000${tab}2026-09-02T00:00:00+00:00${tab}an old text that is not on the backend`n" +
            "toy-two.patch${tab}toy-two/aaaaaaa.patch${tab}aaaaaaa0000${tab}2026-09-01T00:00:00+00:00${tab}the old text the backend has`n")
          $ps1 = Join-Path $repo 'scripts\apply-patches.ps1'
          $t = [IO.File]::ReadAllText($ps1)
          $t2 = [regex]::Replace($t, '(?s)\$PATCHES = @\(.*?\n\)', '$$PATCHES = @(''toy-one.patch'', ''toy-two.patch'', ''toy-three.patch'')')
          if ($t2 -eq $t) { throw "could not replace the patch list" }
          [IO.File]::WriteAllText($ps1, $t2)
          $cfg = Join-Path $env:RUNNER_TEMP 'cfg-old'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $env:OPENJARVIS_CONFIG_DIR = $cfg
          $runArgs = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $ps1, '-SkipPackages', '-SkipTests', '-BackendPath')

          # 1. The first patch and the OLD second one are on: replaced.
          $be = Join-Path $env:RUNNER_TEMP 'backend-old'
          New-Item -ItemType Directory -Force -Path $be | Out-Null
          $hud = Join-Path $be 'jarvis_hud.py'
          Write-Lf $hud (Get-Hud @{})
          # autocrlf off for THIS setup only, so the stand-in is exactly what
          # an LF backend holds. The script's own git calls are left alone:
          # if Windows git changes endings under them, the checks below
          # must see it.
          Assert-Native 'git' @('-c', 'core.autocrlf=false', '-C', $be, 'apply', (Join-Path $pd 'toy-one.patch'))
          Assert-Native 'git' @('-c', 'core.autocrlf=false', '-C', $be, 'apply', (Join-Path $hist 'aaaaaaa.patch'))
          Assert-Text $hud (Get-Hud $twoOld) "the stand-in backend was not built as intended"
          $r = Invoke-Native 'powershell' ($runArgs + @($be))
          $r.Out
          if ($r.Code -ne 0) { throw "the run on a backend with an older patch exited $($r.Code)" }
          $after = Assert-Result $hud (Get-Hud $three) "the result is not what the current list gives"
          if ($r.Out -notmatch 'OLDER version') { throw "it did not say it found an older version" }
          if ($r.Out -notmatch 'toy-two\.patch from 2026-09-01 \(commit aaaaaaa\)') { throw "it did not name the older version it found" }
          $bk = @(Get-ChildItem -Directory -LiteralPath $be -Filter '_jarvis-backup-*')
          if ($bk.Count -ne 1) { throw "expected one backup folder, found $($bk.Count)" }
          Assert-Text (Join-Path $bk[0].FullName 'jarvis_hud.py') (Get-Hud $twoOld) "the backup is not the file as it was before the run"
          "an older toy-two.patch was recognised, taken off and replaced; the backup holds the file as it was"

          # 2. Run again: everything is on, nothing changes.
          $r = Invoke-Native 'powershell' ($runArgs + @($be))
          if ($r.Code -ne 0) { throw "the second run exited $($r.Code)`n$($r.Out)" }
          if ($r.Out -notmatch 'already applied') { throw "the second run did not find everything applied`n$($r.Out)" }
          # Byte for byte: a second run must not touch the file at all.
          Assert-Text $hud $after "the second run changed the file"
          "a second run found everything applied"

          # 3. A text of the second patch that was never published: refused,
          #    nothing changed, no backup.
          $be2 = Join-Path $env:RUNNER_TEMP 'backend-never'
          New-Item -ItemType Directory -Force -Path $be2 | Out-Null
          $hud2 = Join-Path $be2 'jarvis_hud.py'
          Write-Lf $hud2 (Get-Hud $never)
          $r = Invoke-Native 'powershell' ($runArgs + @($be2))
          $r.Out
          if ($r.Code -eq 0) { throw "a never-published text was not refused" }
          if ($r.Out -notmatch 'NOTHING HAS BEEN CHANGED') { throw "the refusal did not say nothing was changed" }
          Assert-Text $hud2 (Get-Hud $never) "the refused run changed the file"
          if (@(Get-ChildItem -Directory -LiteralPath $be2 -Filter '_jarvis-backup-*').Count -ne 0) { throw "the refused run made a backup folder, so it got past the rehearsal" }
          "a never-published text was refused and nothing was touched"

          # 4. Nothing on yet: the whole current list goes on.
          $be3 = Join-Path $env:RUNNER_TEMP 'backend-fresh'
          New-Item -ItemType Directory -Force -Path $be3 | Out-Null
          $hud3 = Join-Path $be3 'jarvis_hud.py'
          Write-Lf $hud3 (Get-Hud @{})
          $r = Invoke-Native 'powershell' ($runArgs + @($be3))
          if ($r.Code -ne 0) { throw "the run on a fresh backend exited $($r.Code)`n$($r.Out)" }
          [void](Assert-Result $hud3 (Get-Hud $three) "a fresh backend did not get the current list")
          "a fresh backend got the whole current list"
          # Explicitly: the runner ends a powershell step with the LAST native
          # exit code, and case 3 above expects one that is not 0.
          exit 0
      - name: The one-step scripts - install, update, and the hand-off between them
        run: |
          # scripts\setup-jarvis.ps1 (install) and scripts\update-jarvis.ps1
          # (update both halves) are the two commands the owner runs. Neither
          # can run for real here - the first copies a backend and sets an
          # account-wide variable, the second patches a real backend and
          # installs a real app - so the scripts they CALL are replaced with
          # stubs that record the arguments they were given. What is under test
          # is the calling and the chaining: the install script's copy landing
          # where it said, the right folder handed on, the desktop step asking
          # the update script NOT to patch the backend a second time, -Print
          # leaving the backend folder and the registry alone and running no
          # child script, and update's own log landing inside the backend folder
          # beside apply-patches.ps1's logs. (A plan run does make one read of
          # the release page, which it now says out loud; case 6 checks that.)
          #
          # backend\test_setup_script.py checks what setup-jarvis.ps1 says about
          # itself; this checks that the two scripts really do chain the way
          # they claim.
          $ErrorActionPreference = 'Stop'
          function Invoke-PS([string[]] $Arguments) {
            $prev = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try { $out = & powershell @Arguments 2>&1 | Out-String; $code = $LASTEXITCODE }
            finally { $ErrorActionPreference = $prev }
            return @{ Code = $code; Out = $out }
          }
          function Assert-True([bool] $Cond, [string] $Why) {
            if (-not $Cond) { throw "FAILED: $Why" }
            "  ok    $Why"
          }
          # A stand-in for one of the scripts the two new ones call. It PRINTS
          # something on purpose: a child that prints is what the exit-code bug
          # below needed in order to show itself, so these end-to-end cases now
          # fail too if it ever comes back.
          function Write-Stub([string] $Path, [string] $Label) {
            $body = "`$ErrorActionPreference = 'Continue'`n" +
                    "Write-Output 'the $Label stand-in ran'`n" +
                    "Add-Content -LiteralPath (Join-Path `$PSScriptRoot 'stub-calls.txt') -Value ('$Label|' + (`$args -join ' '))`n" +
                    "exit 0`n"
            Set-Content -LiteralPath $Path -Value $body -Encoding ASCII
          }
          function Get-Tree([string] $Path) {
            return (@(Get-ChildItem -LiteralPath $Path -Recurse -Force | ForEach-Object { $_.FullName }) -join '|')
          }
          function Get-Calls([string] $Temp) {
            $f = Join-Path $Temp 'scripts\stub-calls.txt'
            if (-not (Test-Path -LiteralPath $f)) { return '' }
            return (@(Get-Content -LiteralPath $f) -join "`n")
          }
          function Reset-Calls([string] $Temp) {
            Remove-Item -LiteralPath (Join-Path $Temp 'scripts\stub-calls.txt') -Force -ErrorAction SilentlyContinue
          }

          $root = Join-Path $env:RUNNER_TEMP 'one-step'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          $tmp = Join-Path $root 'repo'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item -Recurse scripts -Destination $tmp
          # What setup-jarvis.ps1 checks for and copies. The whole jarvis-backend
          # folder is not copied: two files prove the copy step, and the real
          # one is 185 files of backend source.
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp 'jarvis-backend') | Out-Null
          Set-Content -LiteralPath (Join-Path $tmp 'jarvis-backend\jarvis_hud.py') -Value 'print("stand-in")'
          Set-Content -LiteralPath (Join-Path $tmp 'jarvis-backend\jarvis_gate.py') -Value '# stand-in'
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp 'backend') | Out-Null
          Copy-Item backend\jarvis-primary.Modelfile (Join-Path $tmp 'backend')
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp 'jarvis-desktop\src') | Out-Null
          Copy-Item jarvis-desktop\src\jarvis_hud.html (Join-Path $tmp 'jarvis-desktop\src')
          # A stand-in tauri.conf.json whose update address cannot be reached.
          # The desktop step then takes its "no release, build from this folder"
          # route every time, so this step never touches the real release page
          # and never needs the signing key. Port 9 (discard) refuses at once.
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp 'jarvis-desktop\src-tauri') | Out-Null
          Set-Content -LiteralPath (Join-Path $tmp 'jarvis-desktop\src-tauri\tauri.conf.json') -Encoding ASCII -Value (
            '{"plugins":{"updater":{"endpoints":["https://127.0.0.1:9/latest.json"],"pubkey":""}}}')
          Write-Stub (Join-Path $tmp 'scripts\apply-patches.ps1') 'apply-patches'
          Write-Stub (Join-Path $tmp 'scripts\install-backend.ps1') 'install-backend'
          # Two things are under test, and they need opposite stand-ins, so the
          # real update script is kept aside: the install script must see it as
          # a stub (it must not be allowed to install an app here), and the
          # update script's own behaviour must be tested for real.
          $realUpdate = Join-Path $root 'update-jarvis.real.ps1'
          Copy-Item (Join-Path $tmp 'scripts\update-jarvis.ps1') $realUpdate
          Write-Stub (Join-Path $tmp 'scripts\update-jarvis.ps1') 'update-jarvis'
          $setup = Join-Path $tmp 'scripts\setup-jarvis.ps1'
          $update = Join-Path $tmp 'scripts\update-jarvis.ps1'

          # 1. The install script copies the backend, calls both scripts, and
          #    hands the desktop half to the update script - without asking it
          #    to patch the backend a second time.
          $be = Join-Path $root 'backend'
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $setup,
                           '-BackendPath', $be, '-NoStart', '-SkipTests')
          if ($r.Code -ne 0) { throw "setup-jarvis.ps1 exited $($r.Code)`n$($r.Out)" }
          $calls = Get-Calls $tmp
          Assert-True (Test-Path -LiteralPath (Join-Path $be 'jarvis_hud.py')) 'the published backend was copied where -BackendPath said'
          Assert-True ($calls -match 'install-backend') 'install-backend.ps1 was called'
          Assert-True ($calls -match 'apply-patches') 'apply-patches.ps1 was called'
          Assert-True ($calls -match 'update-jarvis') 'update-jarvis.ps1 was called for the desktop half'
          if (-not ($calls -match [regex]::Escape($be))) { throw "a child script was not given the backend folder`n$calls" }
          if (-not (@($calls -split "`n" | Where-Object { $_ -match '^update-jarvis' }) -match '-SkipPatches')) {
            throw "the desktop step did not ask for -SkipPatches, so the patcher would run twice`n$calls"
          }
          Assert-True ($r.Out -match 'backend : ') 'the install run reached its done screen'

          # 2. -SkipDesktop: the update script is never called.
          Reset-Calls $tmp
          $be2 = Join-Path $root 'backend-skipdesktop'
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $setup,
                           '-BackendPath', $be2, '-NoStart', '-SkipTests', '-SkipDesktop')
          if ($r.Code -ne 0) { throw "setup-jarvis.ps1 -SkipDesktop exited $($r.Code)`n$($r.Out)" }
          $calls = Get-Calls $tmp
          Assert-True ($calls -match 'install-backend') '-SkipDesktop still ran the backend steps'
          Assert-True ($calls -notmatch 'update-jarvis') '-SkipDesktop did not call the update script'

          # 3. -Print on the install script: every command shown, nothing made.
          Reset-Calls $tmp
          $be3 = Join-Path $root 'backend-print'
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $setup,
                           '-BackendPath', $be3, '-Print')
          if ($r.Code -ne 0) { throw "setup-jarvis.ps1 -Print exited $($r.Code)`n$($r.Out)" }
          Assert-True (-not (Test-Path -LiteralPath $be3)) 'install -Print created no backend folder'
          Assert-True ((Get-Calls $tmp) -eq '') 'install -Print ran no child script'
          Assert-True ($r.Out -match 'update-jarvis\.ps1') 'install -Print showed the desktop step'
          Assert-True ($r.Out -match 'PRINT mode') 'install -Print said plainly that nothing was run'

          # 4. The update script patches the folder it was given, and logs there.
          #    From here the REAL update script is put back; only the patcher it
          #    calls is a stub.
          Copy-Item $realUpdate $update -Force
          Reset-Calls $tmp
          $be4 = Join-Path $root 'backend-update'
          New-Item -ItemType Directory -Force -Path $be4 | Out-Null
          Set-Content -LiteralPath (Join-Path $be4 'jarvis_hud.py') -Value 'print("stand-in")'
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $update,
                           '-BackendPath', $be4, '-SkipDesktop', '-NoCheck')
          if ($r.Code -ne 0) { throw "update-jarvis.ps1 exited $($r.Code)`n$($r.Out)" }
          $calls = Get-Calls $tmp
          Assert-True ($calls -match 'apply-patches') 'the update script called apply-patches.ps1'
          if (-not ($calls -match [regex]::Escape($be4))) { throw "apply-patches.ps1 was not given the backend folder`n$calls" }
          Assert-True (@(Get-ChildItem -LiteralPath (Join-Path $be4 '_jarvis-logs') -Filter 'update-jarvis-*.txt').Count -ge 1) 'the update run wrote its log in the backend folder'
          Assert-True ($r.Out -match 'ALL DONE') 'the update run ended on the green banner'

          # 5. -SkipPatches on the update script: the patcher is not run at all,
          #    which is what the install script relies on.
          Reset-Calls $tmp
          $be5 = Join-Path $root 'backend-skippatches'
          New-Item -ItemType Directory -Force -Path $be5 | Out-Null
          Set-Content -LiteralPath (Join-Path $be5 'jarvis_hud.py') -Value 'print("stand-in")'
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $update,
                           '-BackendPath', $be5, '-SkipPatches', '-SkipDesktop', '-NoCheck')
          if ($r.Code -ne 0) { throw "update-jarvis.ps1 -SkipPatches exited $($r.Code)`n$($r.Out)" }
          Assert-True ((Get-Calls $tmp) -notmatch 'apply-patches') '-SkipPatches did not run the patcher'
          Assert-True ($r.Out -match 'the backend was left as it is') '-SkipPatches said so on screen'

          # 6. -Print on the update script: the whole plan, and nothing else.
          #    The desktop step is ENABLED here on purpose, unlike cases 4 and 5:
          #    it is the one part of a plan that reads something (the release
          #    page) and the part whose -Print guard could go missing.
          Reset-Calls $tmp
          $be6 = Join-Path $root 'backend-update-print'
          New-Item -ItemType Directory -Force -Path $be6 | Out-Null
          Set-Content -LiteralPath (Join-Path $be6 'jarvis_hud.py') -Value 'print("stand-in")'
          $before = Get-Tree $be6
          $r = Invoke-PS @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $update,
                           '-BackendPath', $be6, '-NoCheck', '-Print')
          if ($r.Code -ne 0) { throw "update-jarvis.ps1 -Print exited $($r.Code)`n$($r.Out)" }
          Assert-True ((Get-Tree $be6) -eq $before) 'update -Print changed nothing in the backend folder'
          Assert-True ((Get-Calls $tmp) -eq '') 'update -Print ran apply-patches.ps1'
          Assert-True ($r.Out -match 'PRINTED ONLY') 'update -Print ended on the printed-only banner'
          # -Print changes nothing, and it says out loud the one thing a plan run
          # does over the network, so "change nothing" is never read as "touches
          # nothing".
          Assert-True ($r.Out -match 'asking the release page') 'update -Print said it would read the release page'
          Assert-True ($r.Out -match 'no published desktop installer was found') 'update -Print carried on when that address could not be reached'
          Assert-True ($r.Out -match 'would run|the desktop app cannot be built here') 'update -Print said what it would do about the desktop app'

          # 7. The one decision in the update script that is neither a call nor a
          #    download: when this folder already holds the release's commit or
          #    newer, BUILD instead of installing that release - otherwise a
          #    branch's own newer app would be replaced by an older published
          #    one. The function is lifted out of the script as it is written and
          #    run against a real repository with a side branch.
          #
          #    WHAT THIS COVERS, AND WHAT IT DOES NOT. It pins the ANSWER for
          #    four inputs, including a commit that exists in the repository but
          #    is NOT in this branch's history - which is the case the decision
          #    exists for. It does NOT run the caller that acts on the answer
          #    (that needs a release manifest, and so the network), and it does
          #    not pin the two guards at the top of the function: a commit that
          #    does not exist and a folder that is not a git checkout come back
          #    false whether those guards are there or not, because git itself
          #    fails. Those two are pinned as the ANSWER the caller relies on,
          #    not as coverage of the guards.
          $gitRepo = Join-Path $root 'ancestor'
          New-Item -ItemType Directory -Force -Path $gitRepo | Out-Null
          & git -C $gitRepo init -q
          if ($LASTEXITCODE -ne 0) { throw "git init exited $LASTEXITCODE" }
          Set-Content -LiteralPath (Join-Path $gitRepo 'a.txt') -Value 'first'
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t add -A
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t commit -qm first
          $shaA = (& git -C $gitRepo rev-parse HEAD).Trim()
          Set-Content -LiteralPath (Join-Path $gitRepo 'b.txt') -Value 'second'
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t add -A
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t commit -qm second
          $shaB = (& git -C $gitRepo rev-parse HEAD).Trim()
          & git -C $gitRepo checkout -q -b side
          Set-Content -LiteralPath (Join-Path $gitRepo 'c.txt') -Value 'on the side branch'
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t add -A
          & git -C $gitRepo -c user.email=t@example.invalid -c user.name=t commit -qm side
          $shaC = (& git -C $gitRepo rev-parse HEAD).Trim()
          & git -C $gitRepo checkout -q master 2>$null
          if ($LASTEXITCODE -ne 0) { & git -C $gitRepo checkout -q main }
          if ((& git -C $gitRepo rev-parse HEAD).Trim() -ne $shaB) { throw "the test repository did not go back to its second commit" }
          $src = Get-Content -LiteralPath $update -Raw
          $found = [regex]::Match($src, '(?s)function Test-LocalAtLeastAsNew.*?\n\}')
          if (-not $found.Success) { throw "could not find Test-LocalAtLeastAsNew in update-jarvis.ps1" }
          Invoke-Expression $found.Value
          $notARepo = Join-Path $root 'not-a-repo'
          New-Item -ItemType Directory -Force -Path $notARepo | Out-Null
          Assert-True ((Test-LocalAtLeastAsNew $gitRepo $shaA) -eq $true) 'a release commit this folder already contains means: build here, do not download'
          Assert-True ((Test-LocalAtLeastAsNew $gitRepo $shaB) -eq $true) 'a release commit equal to HEAD means the same'
          Assert-True ((Test-LocalAtLeastAsNew $gitRepo $shaC) -eq $false) 'a commit that exists here but is NOT in this branch means: the release is ahead, download it'
          Assert-True ((Test-LocalAtLeastAsNew $gitRepo '0123456789abcdef0123456789abcdef01234567') -eq $false) 'a commit this folder has never seen means: do not claim the folder is newer'
          Assert-True ((Test-LocalAtLeastAsNew $notARepo $shaB) -eq $false) 'a folder that is not a git checkout cannot be newer than a release'

          # 8. The helper that reads a child program's exit code. THIS IS THE
          #    CHECK FOR A BUG A REAL FIRST INSTALL FOUND: it used to be
          #    `& $Exe @Arguments; return $LASTEXITCODE`, which hands the caller
          #    the child's OUTPUT and the exit code as ONE ARRAY - and
          #    `$code -ne 0` on an array is true whenever it holds anything. So a
          #    successful npm ci, which prints "added 2 packages", was reported
          #    as "npm ci failed" and the desktop app was never built. npm's own
          #    log said "exit 0" the whole time. Everything below fails if the
          #    output is ever returned again.
          $inv = [regex]::Match((Get-Content -LiteralPath $update -Raw), '(?s)function Invoke-Native \{.*?\n\}')
          if (-not $inv.Success) { throw "could not find Invoke-Native in update-jarvis.ps1" }
          Invoke-Expression $inv.Value
          $quiet = Invoke-Native 'cmd' @('/c', 'exit /b 0') 2>$null
          $loud = Invoke-Native 'cmd' @('/c', 'echo a child that prints & exit /b 0') 2>$null
          $loudBad = Invoke-Native 'cmd' @('/c', 'echo a child that fails & exit /b 3') 2>$null
          Assert-True ($quiet -is [int] -and $quiet -eq 0) 'a silent child that exits 0 is read as success'
          Assert-True ($loud -is [int]) 'a child that PRINTS returns one exit code, not its output'
          Assert-True ($loud -eq 0) 'a child that prints and exits 0 is read as SUCCESS (the npm ci bug)'
          Assert-True ($loudBad -eq 3) 'a child that prints and fails is read as its own exit code'
          # The runner takes the LAST native exit code of the step.
          exit 0

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jarvis-desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories sources
      # THIRD-PARTY-NOTICES.txt must name every Rust library the Windows
      # build ships, with its copyright lines (DEPS audit B-22). After adding
      # or updating a crate: python3 tools/gen_notices.py, and commit the file.
      - name: Third-party notices are up to date
        run: |
          cargo fetch --locked
          python3 ../../tools/gen_notices.py --check
      # ---------------------------------------------------------------------
      # The repo's own scanners.
      #
      # Each step below is one small script under tools/ that reads the
      # repository itself - not this crate - and prints a plain list of
      # violations, exiting non-zero only when there really is one. That is the
      # same shape `check_parity.py` and `check_command_acl.py` use in the
      # backend job, which calls them by path for the same reason.
      #
      # They live together as one block so the whole set is visible in one
      # place and a new one has an obvious home. Each still carries the reason
      # it exists.
      # ---------------------------------------------------------------------
      # Every media clip this app plays is a `data:` URI, and `media-src` said
      # `'self' blob:` - so the browser refused every one of them and Jarvis
      # spoke nothing at all, with no error anywhere and no failing test. The
      # CSP is fixed; this is what keeps it fixed.
      - name: Media sources are permitted by the app CSP
        run: python3 ../../tools/check_media_csp.py

      # A pull request no longer edits CHANGELOG.md - it writes ONE fragment
      # under changelog.d/, rolled in later on a quiet main (tools/roll_changelog.py;
      # the rule is in changelog.d/README.md and CLAUDE.md). Every PR used to
      # append at the same top line, so two PRs always conflicted and each
      # conflict cost a fresh frontend run. This validates any fragment that IS
      # present (a PR with no changelog-worthy change owes none) and the heading
      # the roll inserts under; it never requires a roll to have happened yet.
      - name: CHANGELOG fragments are well formed
        run: python3 ../../tools/roll_changelog.py --check

      # Section 7's pre-build guards for the P-Doc, P-GH and P-Pub waves: the
      # zip/XML bomb reader, the phone-upload name sanitiser, the GitHub
      # base_tree payload guard, the junction-refusing project walk and the
      # EPUB/print XHTML allow-list. Both apps' waves are not built yet, so
      # this suite currently protects the guards themselves; it runs here so a
      # guard that rots is seen on every push rather than only at a desk. The
      # real-junction probe says NOT-TESTABLE on the Linux runner (a skip is
      # never counted as a pass); everything else runs there.
      - name: Pre-build guards for the document, GitHub and publishing waves
        run: python3 ../../tools/prebuild_guards/test_guards.py

      # The plug-in catalogue must match the patch stack. It drifted and nothing
      # caught it: plugins/registry.json held 134 entries against the stack's 136,
      # so scripts/list-plugins.ps1 and add-plugin.ps1 - which read that file -
      # never offered the Docker drop-in and every position number after 128 was
      # wrong. After adding a patch to $PATCHES, re-run
      #   py -3 tools/gen_plugin_catalogue.py
      # and commit what it writes. These two checks are what keep it honest.
      - name: The plug-in catalogue matches the patch stack
        run: python3 ../../tools/check_plugins.py
      - name: The plug-in catalogue is up to date
        run: python3 ../../tools/gen_plugin_catalogue.py --check
      # The shell hands the event stream to the HUD by dispatching each frame
      # with its KIND as the EventSource event type, while the page reads those
      # kinds inside `onmessage` - which only ever sees type `message`. Five
      # branches of the HUD's live path can never run. The page is vendored from
      # the backend folder and cannot be fixed here, so this guard records those
      # five (file, line and kind) in KNOWN_BREAKS: it prints every one of them,
      # loudly, on every run, and still exits 1 for anything NOT recorded -
      # a branch added, renamed or moved out from under its entry. It protects
      # the HUD's live path from going quietly dead, and the list from growing.
      - name: Event names dispatched and listened for
        run: python3 ../../tools/check_event_names.py
      # A dictionary or a JSON object that writes the same key twice keeps the
      # last one, silently, in both languages. The owner's own gate carried four
      # duplicated `_RISK` keys - one of them the entry that decides whether an
      # email draft can be swipe-approved - and nothing in the project could see
      # it. This does: it reads every *.py and *.json git would carry, and skips
      # only what git itself ignores (the audit pass's scratch copies), so a
      # duplicate in a tracked file is still a failure. What it protects is a
      # table that looks complete while one of its entries no longer exists.
      - name: No literal repeats a key
        run: python3 ../../tools/check_literal_keys.py
      # A button that calls a Tauri command its window's capability does not
      # grant is refused at runtime and does nothing at all: no compile error,
      # no test failure. tools/check_command_acl.py checks that the command has
      # a permission FILE, which is necessary and not sufficient - the file also
      # has to be in a set, and the set granted to the window whose page calls
      # it. This is the other half.
      - name: Every command a page calls is granted to its window
        run: python3 ../../tools/check_invoke_grants.py
      # A throwaway folder named from a clock, then created without `exist_ok`.
      # On Windows `time.time_ns()` is `GetSystemTimeAsFileTime`: 100-nanosecond
      # units, but the value only moves on the system timer tick, so two calls
      # inside one tick return the SAME number and the second `mkdir` dies with
      # `FileExistsError [WinError 183]`. That one line has now broken three
      # Windows CI suites - test_note_capture.py, test_obsidian_notes.py and
      # test_backup.py (runs 37349552106 and 37369387182) - and none of it
      # reproduced on the owner's PC, where the tick is about 0.5 ms. All three
      # were fixed with `tempfile.mkdtemp`, which asks the filesystem for a free
      # name. This is what keeps the next one from being found the same way.
      # It reads *.ps1 too (2026-10-09): five %TEMP% folders in
      # scripts/apply-patches.ps1 were named from `Get-Date -Format
      # 'yyyy-MM-dd-HHmmss'`, so two runs started inside one second shared them
      # and each one's teardown deleted the other's - which is what "a suite
      # that passes alone fails in a combined run" was, for a day.
      - name: No path is named from a clock and created without exist_ok
        run: python3 ../../tools/check_same_tick_paths.py
      # The tutorials are data, so nothing compiles them and nothing reads them.
      # Each step ends with a `where` line naming the button, card or screen to
      # use, and an agent writing the last sixteen of them invented three button
      # labels in its first draft (it caught them itself) and described two
      # screens that do not exist at all (the phone's "Timeline", and "tap to
      # talk" on the phone). A tutorial that sends the owner to a control the app
      # does not have is confident, user-facing and wrong, and every other check
      # in this file passes it. This one reads the real
      # backend/jarvis_tutorials.py and matches each breadcrumb in a `where`
      # line against the names the two apps really define - exactly, with no
      # substring search and no fuzzy match, because a guard that cries wolf is
      # worse than none. The lines that are wrong today are recorded in
      # KNOWN_DRIFT with a reason each (the file is owned by another pull
      # request); a name NOT recorded there exits 1, and a recorded one that
      # stops being reported is itself a failure, so the list cannot quietly
      # absorb a real finding.
      - name: A tutorial names only screens and buttons that exist
        run: python3 ../../tools/check_tutorial_places.py
      # A suite check that cannot fail hides a real defect indefinitely, and it
      # is worse than a failing one: it is counted as a PASS. On 2026-10-05 this
      # repository fixed 153 `check("SKIP - <reason>", True)` sites; the same
      # shape was back on 2026-10-06, 24 more in 14 files, and two summary
      # lines (`check("... every one of them stays a card", True)`) that
      # printed ok on a run where the loop above had just printed FAIL. The
      # suite's own words are the evidence: if it says it could not run the
      # check here, the answer is a real `skip(why)`, counted separately and
      # never as a pass. This reads every backend/test_*.py and
      # backend/eval_*.py and fails on a fake skip, on a string used as the
      # condition, and on a harness whose condition has a default.
      - name: No suite check can pass while checking nothing
        run: python3 ../../tools/check_vacuous_checks.py
      # Review #8 (10-Review Playbook): every user-facing string in the backend's
      # messages, the HUD page, Rust command errors and the Android resources is
      # scanned for developer words (taint/latch/FTS5/HTTP 500/None/...) and for
      # bare refusals that tell the owner neither what happened nor what to do.
      # The recorded baseline in docs/REVIEW-8-ZERO-JARGON-BASELINE-2026-10-23.json
      # is a ratchet: this fails only when the tree gets WORSE than the record.
      # The count is real and non-zero today - cleaning it is follow-up work -
      # so this is deliberately not a "zero jargon" gate yet.
      - name: User-facing strings carry no new developer jargon (Review #8)
        run: python3 ../../tools/check_zero_jargon.py --check
      # What this project says about itself in prose was checked by nobody, and
      # on 2026-10-05 five false statements reached the owner that way - the
      # worst of them CLAUDE.md's "not yet built" queue, which still listed
      # tap-to-talk on the phone eight days after it was built (eabca34d).
      # docs/CLAIMS.tsv is one row per claim with a check a machine runs, and
      # this fails in BOTH directions: a `built` row whose check stopped
      # passing, and an `open` row whose gap has CLOSED, which means the
      # register is stale rather than the code. Without that second half the
      # register rots exactly like the prose it replaced.
      # check_claims.py RUNS the suite a `test:` row names, so this job has to be
      # able to run it - and it could not. Row E06 names
      # `test:backend/test_backup.py`, which drives the encrypted backup's
      # AES-GCM/Argon2id path, and `backend/jarvis_backup.py:321-323` imports
      # `cryptography` to do it. On a job that installed nothing the suite ended
      # "159 passed, 32 failed" and the step below told the owner a true `built`
      # claim had stopped holding. It had not - the `backend` job installs this
      # same package (its own step, above) and passes the identical tree, which
      # is the whole difference between the two jobs.
      #
      # THIS LIST IS "WHAT THE SUITES A CLAIM NAMES NEED", not a copy of the
      # backend job's. It holds one package because one row's suite needs one.
      # A commit that adds a row naming a suite with another dependency adds it
      # here too, or that row will read as a broken claim rather than as a job
      # that cannot run its check.
      - name: The package the suites a claim names need
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.1
      - name: Every claim in docs/CLAIMS.tsv still holds, and every open gap is still open
        run: python3 ../../tools/check_claims.py
      # docs/DEFECT-REGISTER.md and docs/defect-register.tsv are the board the
      # agents claim a defect on, so that the same real bug is not repaired
      # twice overnight. A register nobody checks drifts, and a drifted one is
      # worse than none: it names an owner for work that is already done, or
      # sends an agent at a file another one is holding. This fails on two open
      # rows claiming the same file, on a row naming a file that is not in the
      # checkout, on a malformed row, and on the two files disagreeing about
      # which defects are open. Standard library only, two files read, no
      # network.
      - name: The defect register is well-formed and names only real files
        run: python3 ../../tools/check_defect_register.py
      # docs/README.md is the map of docs/, and it opens by stating how many
      # markdown documents are here and how big they are. Both are hand-typed,
      # and nothing re-measured them: on 2026-10-11 the page still said 290
      # documents and about 6.8 MB, measured 2026-10-06, while the tree held
      # 342 and 8,144,671 bytes. That is the plug-in catalogue's failure again
      # (138 entries against a 139-patch stack, through eighteen merges), so it
      # gets the catalogue's answer: the count exactly, the size to within a
      # tenth because the page itself says "about" and tells the reader to
      # re-measure rather than trust the digits.
      - name: The documents page's own count and size match docs/
        run: python3 ../../tools/check_docs_map.py
      # README.md is the first page anyone reads, and it was the one page no
      # checker measured. On 2026-10-21 a review of it found three kinds of
      # false statement at once: it named a voice module, `jarvis_voice.py`,
      # whose job the shipped code had already split away; it said **"The
      # desktop installer is not published yet"** weeks after the rolling
      # `desktop-latest` release had been publishing a signed MSI and
      # setup.exe; and it called two pull requests "in flight" that had
      # merged. A beginner reads that page first, so a false sentence there
      # costs the most. This is the compiler for the four things about that
      # page that can be checked mechanically - every module, document and
      # script it names exists, it names no pull-request number, none of the
      # phrases that had already rotted is back, and no link was rewritten
      # into a Google search for itself by a chat/PDF converter (a corrupt
      # copy, never the file). It prints every reference it checked, so a
      # reference that stopped matching cannot pass unnoticed.
      - name: Every reference in README.md is real, with no PR numbers, stale claims or rewritten links
        run: python3 ../../tools/check_readme_truth.py
      # ---------------------------------------------------------------------
      # Five more scanners, each of which existed and which NO workflow ran.
      #
      # All five pass today (measured 2026-10-11), which is exactly the point:
      # a checker nothing runs is green this morning and worthless the moment
      # it stops being green, because nothing tells anyone. `check_stale_twins`
      # is the one that matters most - it guards the pair of backend copies
      # this repository ships whole, and its own output says it is the
      # shipped-twin half of `backend/test_base_matches_repo.py`.
      #
      # They go at the end of the block so the set that was already wired keeps
      # its order, and each carries the reason it exists, as the others do.
      # ---------------------------------------------------------------------
      - name: Every shipped backend module matches the repository's twin
        run: python3 ../../tools/check_stale_twins.py
      - name: Every feature the feature list claims is really there
        run: python3 ../../tools/check_feature_list.py
      - name: The model lanes and the models they name agree
        run: python3 ../../tools/check_lanes.py
      - name: The phone's settings registry matches the PC's
        run: python3 ../../tools/check_registry_phone.py
      - name: The screen feature's safety rules hold
        run: python3 ../../tools/check_screen_safety.py
      # ---------------------------------------------------------------------
      # Three are deliberately NOT wired, and this comment is here so nobody
      # later "fixes" one of them by weakening it until it passes - which is
      # the shape that cost this project a day. Each needs something CI does
      # not have, and each still runs on the owner's PC or not at all:
      #   check_apk_16kb.py    - exits 1 with "no APK found. Build one first."
      #                          The APK is built in the `Jarvis client`
      #                          workflow, so that is where it belongs.
      # A CHECKER WHOSE VALUE IS A HOST ARTEFACT BELONGS IN THE BY-HAND PATH;
      # ONE THAT READS ONLY THE REPOSITORY BELONGS IN THE `audit` JOB. That is
      # why the five wired above split three safe / two needing a stated skip.
      #   check_obscura.py     - looks for the Obscura binary under
      #                          C:\Users\<owner>\.openjarvis\obscura\, which
      #                          lives on the owner's PC and nowhere in CI.
      #                          RUN BY HAND, and written down: CHANGELOG.md:229,
      #                          backend/README.md:18439. Its logic is exercised
      #                          without the binary by backend/_fake_obscura.py.
      #   check_work_claims.py - exits 2 without its input; it cannot pass here
      #                          and cannot fail here. DRIVEN BY
      #                          backend/test_work.py, which reports that no-input
      #                          exit as a SKIP (green-but-honest) - but NOTE:
      #                          test_work.py is in NO workflow's suite array, so
      #                          this runs only when someone runs it by hand.
      # ---------------------------------------------------------------------
      # The published base's own uncovered corner (2026-10-14).
      #
      # jarvis-backend/ is the folder a clone runs its backend from, and an edit
      # in it reaches the owner's PC through one of two mechanisms and no
      # other: a patch apply-patches.ps1 APPLIES writes the file, or its name is
      # in the script's $SHIPPED block and it is copied whole, every run. A file
      # in neither is a file no edit reaches his machine through - and every
      # check this repository had was blind to it, because the twin checks
      # compare backend/<f> with jarvis-backend/<f> and such a file has no
      # backend/ twin to compare.
      #
      # Measured 2026-10-14, by running the installer against a copy of the base
      # with two files deleted from it: jarvis_style.py stayed missing while
      # jarvis_accounts.py was restored from $SHIPPED - and the work order of
      # that morning had just sent a feature at jarvis_style.py.
      #
      # It classifies every .py in the base, prints the four buckets and names
      # the files nothing delivers, and fails on any name not already recorded
      # with its reason in its own UNMANAGED dict. It promotes nothing: moving a
      # file into $SHIPPED means the installer starts overwriting the owner's
      # own copy of it, which is his decision and not a checker's.
      # backend/test_unmanaged_files.py, which runs in the required `backend`
      # job through run_suites.py, is the proof that this checker bites.
      - name: Every .py in the published base is delivered, or recorded as not
        run: python3 ../../tools/check_unmanaged_files.py
      # A test must exercise the seam at runtime, never pin the source TEXT of a
      # production module. Seven checks in this project passed while measuring
      # something other than their invariant (origin/main's copy of a file, the
      # checkout's own topology, git history, the spelling of a call, a pinned
      # defect...), and a pin on text goes red when the code is renamed or
      # improved while staying green when the behaviour is wrong.
      # tools/check_no_source_pins.py is a CEILING RATCHET: it records the pins
      # measured on 2026-10-17 (116 files, 423) and allows the number to fall,
      # never rise. backend/test_no_source_pins.py, which runs in the required
      # `backend` job through run_suites.py, is the proof that this checker bites.
      - name: No test pins the source text of a production module
        run: python3 ../../tools/check_no_source_pins.py
      # ... and the ratchet above was BLIND to the pin one step sideways: a
      # text pin fails when the source's CONTENT changes; a POSITION pin
      # (`lines[951]`) fails when the thing it points at is DISPLACED, passes on
      # a wrong value that happens to sit at the old index, and fails on a right
      # value one line lower. #525 moved one pin from the counted column into
      # that uncounted one, so a file could hide its debt there.
      # tools/check_position_pins.py is the SECOND CEILING RATCHET, in the same
      # exact-count shape: it records the positions measured on 2026-10-17
      # (12 files, 16), allows the number to fall, never rise, and fails BOTH
      # when a pin is added and when one is paid off without lowering the entry.
      # backend/test_position_pins.py, which runs in the required `backend` job
      # through run_suites.py, is the proof that this checker bites.
      - name: No test pins a position in a production module's source
        run: python3 ../../tools/check_position_pins.py
      # ---------------------------------------------------------------------
      # THE ONE STEP IN THIS JOB THAT REPORTS WITHOUT FAILING, on purpose.
      #
      # Queue item 10 ("a stale-area check after every big merge", docs/
      # HANDOFF-AFTER-PR39.md:300) is about audit COVERAGE, not about a
      # document contradicting the tree: of the areas a change touched, which
      # have moved since the last time anybody audited them. Its map is
      # tools/stale-areas.tsv, seeded from the coverage map that item names.
      #
      # Every other step above exits non-zero the moment it finds something.
      # This one must not, and the reason is the number. Measured on 2f85d772:
      # 17 of the 18 areas have moved since they were last audited - the map's
      # audits are all 2026-09-24..09-30 and the tree is 2026-10-16. A step
      # that went red for that would be red on every pull request for debt no
      # pull request caused, and CLAUDE.md's own rule is that a red `audit` is
      # a signal to fix main's state, never a reason to hold a PR. So it PRINTS
      # the debt and exits 0, which is how it gets RUN on every PR instead of
      # being switched off in a week. A tool nobody runs is a document.
      #
      # `audit` is already informational and not one of the six required
      # checks, so nothing here can block a merge either way.
      #
      # The gate is at the desk: `python -B tools/check_stale_area.py --all
      # --check` exits 1 on debt and 2 when there is nothing to check at all.
      # A map row whose globs match no tracked file fails in BOTH modes - a row
      # nobody can evaluate is a row nobody checked, and that must never look
      # like a clean run.
      #
      # The bite proof is the tool's own; the human number is in the row's
      # commit. Nothing here is cleared by editing this file: a row goes quiet
      # when an audit is recorded in tools/stale-areas.tsv.
      # ---------------------------------------------------------------------
      - name: Which audited areas have moved since their last audit
        run: python3 ../../tools/check_stale_area.py --all

  python-advisories:
    # The backend's Python packages, next to `cargo deny` above (feasibility
    # audit I111, first half, 2026-09-26): backend/requirements.lock must pin
    # every package in requirements.txt with a hash, and no pinned release -
    # on any platform or Python version the lock covers - may have a known
    # advisory in PyPI's own database. Standard library only, so there is
    # nothing new to install (or to pin) for the check itself.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Python packages are hash-locked and have no known advisory
        run: python tools/check_python_advisories.py

  # The phone's unit tests, on EVERY pull request.
  #
  # WHY (2026-10-11). A Kotlin change could merge with its tests never run. The
  # unit tests live in jarvis-client.yml's `build` job, which is PATH-FILTERED
  # and is not one of the six required checks - so a pull request that touches
  # none of its paths never runs them at all.
  #
  # A required check that can be ABSENT is worse than no check: a `build` job was
  # briefly required here and permanently blocked seven pull requests that could
  # never report it, because that job is in the same filtered file. This job
  # therefore has NO path filter and reports a conclusion on every request.
  #
  # The field-test audit ended up here from the other side: two of its five
  # incidents are phone tests, and the plate-placement incident happened in
  # ScrollToKeyTest - in the tests whose invocation was optional.
  phone-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: jarvis-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # `packages: platform-tools`, NOT the action's default `tools
      # platform-tools`: Google removed the obsolete `tools` package, so the
      # default makes the action run `sdkmanager tools`, get "Failed to find
      # package 'tools'", and fail before a line of Kotlin is compiled. The
      # phone's own workflow pins it for this reason; copied from there rather
      # than rewritten.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: The phone's unit tests pass (a Kotlin change cannot merge without them)
        run: |
          set -uo pipefail
          chmod +x ./gradlew
          if ! ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log; then
            echo "::group::Compiler errors, if any"
            grep -E "^e: |Unresolved reference|Argument type mismatch|None of the following candidates|Compilation error" test.log | head -80 \
              || echo "(none - so this is a TEST failure, not a compile failure)"
            echo "::endgroup::"
            echo "::group::Failing tests"
            grep -E "FAILED$|^[A-Za-z].*> .* FAILED" test.log | head -40 || true
            echo "::endgroup::"
            exit 1
          fi
          # A test task that matches no sources exits 0 and reports nothing -
          # a green that measures nothing. Refuse it, so this job cannot pass
          # by finding no tests to run.
          results=app/build/test-results/testDebugUnitTest
          if ! ls "$results"/TEST-*.xml >/dev/null 2>&1; then
            echo "::error::No test results in $results - the test task matched no sources."
            exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "Total tests: ${total:-0}"
          if [ "${total:-0}" -lt 1 ]; then
            echo "::error::Test results contain zero tests."
            exit 1
          fi
