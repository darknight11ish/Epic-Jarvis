name: Verify toolchain claims

# Settles the items ANDROID-BUILD.md flags UNVERIFIED. Runs on demand because
# the answers only change when the brief does.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/verify-toolchain.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Compose BOM 2026.08.00 -> androidx.compose.foundation
        run: |
          set -uo pipefail
          BOM=https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/2026.08.00/compose-bom-2026.08.00.pom
          echo "### Compose BOM 2026.08.00" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(curl -sS -o bom.pom -w '%{http_code}' "$BOM" || echo 000)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "- BOM **does not exist** on Google Maven (HTTP $code)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The BOM's dependencyManagement block is the authoritative pairing.
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import re, pathlib
          pom = pathlib.Path("bom.pom").read_text()
          deps = re.findall(
              r"<artifactId>(foundation[^<]*)</artifactId>\s*<version>([^<]+)</version>", pom)
          if deps:
              for a, v in sorted(set(deps)):
                  print(f"- `androidx.compose.foundation:{a}` -> **{v}**")
          else:
              print("- no foundation artifact found in the BOM")
          PY

      - name: Does AGP 9.4.0 exist?
        run: |
          set -uo pipefail
          U=https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/9.4.0/gradle-9.4.0.pom
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$U" || echo 000)
          echo "### AGP 9.4.0" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- gradle-9.4.0.pom -> HTTP **$code**" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### Latest AGP on Google Maven" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml \
            | grep -o '<latest>[^<]*</latest>\|<release>[^<]*</release>' \
            | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY" || true

          echo "### Compose BOM versions available" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sS https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/maven-metadata.xml \
            | grep -o '<latest>[^<]*</latest>\|<release>[^<]*</release>' \
            | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Which API level added WindowManager.LayoutParams.preferredDisplayModeId
        run: |
          set -uo pipefail
          echo "### preferredDisplayModeId by API level" | tee -a "$GITHUB_STEP_SUMMARY"
          yes | sdkmanager "platforms;android-21" "platforms;android-22" "platforms;android-23" >/dev/null 2>&1 || true
          for api in 21 22 23 36; do
            JAR="$ANDROID_HOME/platforms/android-$api/android.jar"
            if [ ! -f "$JAR" ]; then
              echo "- API $api: android.jar not installed" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if javap -p -classpath "$JAR" 'android.view.WindowManager$LayoutParams' 2>/dev/null \
                 | grep -q preferredDisplayModeId; then
              echo "- API $api: **present**" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- API $api: absent" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Which Compose BOM works with compileSdk 36
        # bash without -e: a BOM that is not published, or a POM that does not
        # mention ui-android, must skip that row rather than end the survey.
        shell: bash {0}
        run: |
          set -uo pipefail
          echo "### Compose BOM -> compose version -> minCompileSdk" | tee -a "$GITHUB_STEP_SUMMARY"
          BASE=https://dl.google.com/dl/android/maven2
          for bom in 2026.09.00 2026.08.00 2026.07.00 2026.06.00 2026.05.00 \
                     2026.04.00 2026.03.00 2026.02.00 2026.01.00 \
                     2025.12.01 2025.11.00 2025.10.01 2025.09.00; do
            pom=$(curl -sS --fail "$BASE/androidx/compose/compose-bom/$bom/compose-bom-$bom.pom" 2>/dev/null)
            if [ -z "$pom" ]; then
              echo "- BOM $bom: not published" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            ver=$(printf '%s' "$pom" \
                  | grep -A2 '<artifactId>ui-android</artifactId>' \
                  | grep -o '<version>[^<]*' | head -1 | cut -d'>' -f2)
            if [ -z "$ver" ]; then
              echo "- BOM $bom: no ui-android entry" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            curl -sS --fail -o ui.aar \
              "$BASE/androidx/compose/ui/ui-android/$ver/ui-android-$ver.aar" 2>/dev/null
            min=$(unzip -p ui.aar META-INF/com/android/build/gradle/aar-metadata.properties 2>/dev/null \
                  | grep '^minCompileSdk=' | cut -d= -f2 | tr -d '\r')
            echo "- BOM $bom -> compose ${ver} -> minCompileSdk ${min:-unknown}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f ui.aar
          done
