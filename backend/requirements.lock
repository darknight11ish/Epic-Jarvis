# backend/requirements.lock - the exact versions of backend/requirements.txt,
# each with the sha256 of every file PyPI has for it, so pip refuses a file
# that was swapped (hash-checking mode). Made by a tool; do not edit by hand.
#
# Covers Windows and Linux, Python 3.11 and newer. Releases younger than
# 7 days when it was made were left out on purpose (a hijacked release has
# time to be noticed and pulled). Made on 2026-09-26 from releases up to
# 2026-09-19 (made again on 2026-09-28 with the same cut-off, to add
# espeakng-loader and onnx for jarvis_mouth.py - nothing else moved; and again
# on 2026-09-29, the same cut-off, to add six pywinrt packages for jarvis_ocr.py -
# nothing else moved; and again on 2026-09-30, the same cut-off, to add fsrs for
# jarvis_decks.py - nothing else moved; and again on 2026-09-30, the same cut-off, to add
# youtube-transcript-api for jarvis_youtube.py - nothing else moved; and the
# whole file was compiled again on 2026-10-25 - see HISTORY at the bottom).
#
# To make it again, from the repository root, with uv (this exact command made
# this file on 2026-10-25 with uv 0.12.9):
#
#   uv pip compile backend/requirements.txt --universal --generate-hashes --python-version 3.11 --exclude-newer 2026-09-19T00:00:00Z --exclude-newer-package markitdown=2026-09-26T00:00:00Z --exclude-newer-package pillow=2026-10-21T00:00:00Z --exclude-newer-package rapidocr=2026-10-13T00:00:00Z --exclude-newer-package certifi=2026-10-20T03:00:00Z --exclude-newer-package filelock=2026-10-17T17:00:00Z --no-header -o backend/requirements.lock
#
# --no-header, because the header below is written by hand and the compile
# writes only the body; put this header back on top of its output.
#
# The five --exclude-newer-package dates are deliberate one-package exceptions
# to the 7-day wait, and they are what lets a fresh compile reproduce this
# file's versions exactly:
#   markitdown 0.1.8   - the release that brings a pdfminer.six with the fix
#                        for crafted PDFs (CVE-2025-64512); younger than 7 days
#                        when the lock was first made. Its wheel's sha256 was
#                        also checked by hand against PyPI (de7375a5...cbab).
#   rapidocr 3.10.0    - released 2026-10-08 and added on 2026-10-13, younger
#                        than the 7-day wait; the
#                        release that asks for opencv-python-headless (3.9.2 and
#                        earlier ask for full opencv-python). Its wheel and its
#                        three ONNX models were fetched by hand and the sha256
#                        checked (2fc34e26...8050).
#   pillow 13.0.0      - uploaded 2026-10-16T22:15Z; the ONLY release fixing
#                        Pillow's 24 advisories (no later 12.x release exists,
#                        and no release after 12.3.0 ships a Python 3.10 wheel -
#                        hence the 3.11 floor).
#   certifi 2026.10.19 - the GHSA-6q48-6c7w-9gw2 fix that #670 merged on
#                        2026-10-20; newer than the 2026-09-19 cut-off.
#   filelock 4.2.1     - uploaded 2026-10-17T16:48Z; fixes 4.0.0's three
#                        advisories (GHSA-v4x8-3wr5-3wq8, GHSA-9vhv-jxww-xfm5,
#                        GHSA-567q-5qvw-pf92). backend/requirements.txt names
#                        filelock with >=4.2.1, so this floor cannot quietly
#                        move back.
#
# For a routine remake months later, move the literal --exclude-newer date to
# seven days before the new make; keep the five exceptions until a change
# means to move that package, and change one only for a reason.
#
# Then put this header back and run: python3 tools/check_python_advisories.py
# (the lock is whole, and no pinned release has a known advisory). CI runs
# the same check.
#
# NOT YET what scripts/apply-patches.ps1 installs from - see
# docs/DEPS-TESTS-CI-AUDIT-2026-09-26.md, "Python packages pinned with hashes".
#
# ---------------------------------------------------------------------------
# HISTORY. The 2026-10-13 and 2026-10-21 rounds were merged into this file by
# hand, each kept intact because at the time a whole-file recompile would have
# moved packages the change had nothing to do with:
#
# 2026-10-13 - rapidocr 3.10.0 and the ten packages it brings
#   (opencv-python-headless, pyclipper, Shapely, omegaconf,
#   antlr4-python3-runtime, colorlog, coloredlogs, humanfriendly,
#   pyreadline3, exceptiongroup), MERGED into the lock as it stood. A recompile
#   on 2026-10-13 with the same cut-off ALSO moved about ten unrelated packages
#   (fastembed 0.2.7 -> 0.8.1, huggingface-hub 0.20.3 -> 1.33.0, tokenizers,
#   cryptography, onnxruntime, onnx, charset-normalizer, comtypes, filelock,
#   pypdfium2, pytz, tzdata, soupsieve, python-dotenv) and collapsed several
#   per-Python-version pins into one, which would have dropped the Python 3.10
#   entries the lock then promised to cover. See
#   docs/MEASURED-2026-10-13-ocr-two-readers.md.
#
# 2026-10-21 - two changes in ONE pull request: (1) the memory search's library
#   fastembed is GONE - backend/rebuilt/jarvis_memory.py now calls onnxruntime +
#   tokenizers + huggingface_hub directly (all three were already here;
#   tokenizers and huggingface-hub were named in requirements.txt), which took
#   loguru, mmh3, py-rust-stemmers and win32-setctime out with it; and
#   (2) pillow 12.3.0 -> 13.0.0, the only release fixing the 24 open Pillow
#   advisories. Also merged by hand, same reason. The coverage line moved
#   3.10 -> 3.11 in this round, because pillow 13 has no 3.10 build; every
#   `python_full_version < '3.11'` pin stayed as inert dead weight.
#
# 2026-10-25 - the first whole-file compile since 2026-09-30 (the two rounds
# after it were merged by hand), the recipe fix the owner's 2026-10-23
# decision asked for before filelock could be bumped, and the bump itself in
# the same round. Measured against the file it replaced:
#   * zero version drift where it matters: every (name, version) pin the old
#     lock carried for Python 3.11 and newer is here unchanged, with the same
#     PyPI file hashes; the only version that changed is filelock 4.0.0 ->
#     4.2.1. The command above reproduces this body byte for byte (run twice,
#     same sha256).
#   * the dead Python 3.10 coverage is gone: 13 entries deleted (coloredlogs,
#     exceptiongroup, humanfriendly, mpmath, pyreadline3, pytz, sympy, tomli,
#     and the <3.11 versions of huggingface-hub, numpy, onnxruntime, pandas and
#     tokenizers), together with the `python_full_version >= '3.11'` marker
#     every remaining 3.11 pin used to carry.
#   * filelock 4.0.0 -> 4.2.1, clearing the three advisories named above.
#   * the `# via` comments were re-emitted from today's dependency graph (they
#     had gone stale - e.g. pyyaml now says `via huggingface-hub, omegaconf,
#     rapidocr`, and filelock says `-r backend/requirements.txt` as well as
#     `huggingface-hub` now that requirements.txt names it).
#   * tomli is no longer named in requirements.txt: it was there only for the
#     Python 3.10 pins this round deletes, and the fallback imports it serves
#     (rebuilt jarvis_framework.py, jarvis_tool_updates.py,
#     jarvis_asks_first.py) only fire below 3.11.

