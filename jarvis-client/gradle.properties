org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# A connected test run uninstalls the app when it finishes, and with it the
# app's data - which is where this phone's pairing key lives. On the owner's own
# phone that means re-pairing (a card and a Windows Hello tap) after every run,
# and it happened for real on 2026-10-10 (docs/ANDROID-PAIRED-AUDIT-2026-10-10.md).
# This keeps the APKs installed, so the run leaves the phone as it found it.
# Pinned by SettingsSearchTest's neighbour, InstrumentedRunKeepsInstallTest.
android.injected.androidTest.leaveApksInstalledAfterRun=true

kotlin.code.style=official
