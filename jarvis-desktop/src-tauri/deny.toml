# `cargo deny check licenses advisories`, run in CI.
#
# The licence list is an allowlist on purpose: the point is that a copyleft
# dependency cannot arrive unnoticed in a closed binary, not that today's tree
# happens to be clean.

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "BSL-1.0", "CC0-1.0", "MIT-0", "Unlicense",
  "Unicode-3.0", "Unicode-DFS-2016",
  # File-level weak copyleft. One crate reaches the shipped binary
  # (`option-ext`, via dirs-sys -> dirs -> tauri) and is used unmodified;
  # THIRD-PARTY-NOTICES.txt carries its notice and a link to its source.
  "MPL-2.0",
]
confidence-threshold = 0.9

[advisories]
# Unmaintained- and unsound-crate notices, every one transitive through Tauri's
# own tree and none of them a vulnerability. Listed by id so a NEW one fails CI
# rather than blending in. Reviewed 2026-09-14; revisit when Tauri moves.
#
# The two that used to be here (paste, fxhash) came in through `screenshots`
# and left with it, along with two CVSS 7.5 quick-xml advisories. `cargo audit`
# exits 0 on this lockfile.
ignore = [
  "RUSTSEC-2024-0370",  # proc-macro-error, unmaintained (tauri-plugin tree)
  "RUSTSEC-2024-0429",  # glib, unsound VariantStrIter (Linux GTK backend only)
  "RUSTSEC-2025-0075",  # unic-char-property, unmaintained
  "RUSTSEC-2025-0080",  # unic-char-range, unmaintained
  "RUSTSEC-2025-0081",  # unic-common, unmaintained
  "RUSTSEC-2025-0098",  # unic-ucd-version, unmaintained
  "RUSTSEC-2025-0100",  # unic-ucd-ident, unmaintained
]
