# `cargo deny check licenses advisories sources`, run in CI.
#
# The licence list is an allowlist on purpose: the point is that a copyleft
# dependency cannot arrive unnoticed in a closed binary, not that today's tree
# happens to be clean.

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "BSL-1.0", "CC0-1.0", "MIT-0", "Unlicense",
  "Unicode-3.0", "Unicode-DFS-2016",
  # File-level weak copyleft. One crate reaches the shipped binary
  # (`option-ext`, via dirs-sys -> dirs -> tauri) and is used unmodified;
  # THIRD-PARTY-NOTICES.txt carries its notice and a link to its source.
  "MPL-2.0",
]
confidence-threshold = 0.9

[advisories]
# Unmaintained- and unsound-crate notices, every one transitive through Tauri's
# own tree and none of them a vulnerability. Listed by id so a NEW one fails CI
# rather than blending in. Reviewed 2026-09-14; revisit when Tauri moves.
#
# The two that used to be here (paste, fxhash) came in through `screenshots`
# and left with it, along with two CVSS 7.5 quick-xml advisories. `cargo audit`
# exits 0 on this lockfile. `paste` is BACK as of 2026-11-16, through the
# tauri-specta pilot and not through screenshots: specta's own derive pulls it
# in, it is unmaintained rather than vulnerable, and it is the one price of the
# generated-bindings pilot - recorded here by id, so it cannot arrive unnoticed
# anywhere else.
ignore = [
  "RUSTSEC-2024-0370",  # proc-macro-error, unmaintained (tauri-plugin tree)
  "RUSTSEC-2024-0436",  # paste, unmaintained - NEW 2026-11-16 through specta (see above)
  # RUSTSEC-2024-0429 (glib) and RUSTSEC-2025-0075 / -0080 / -0081 / -0098 /
  # -0100 (the unic-* crates) were removed on 2026-11-22: those crates left this
  # lockfile, and cargo-deny fails an ignore entry that matches no crate
  # ("advisory was not encountered"), so keeping them turned the audit job red
  # on main itself. Measured with `cargo deny check advisories` at the desk,
  # which named six stale ids - two more than the CI log named, because its
  # advisory database snapshot differed. A notice that arrives again is named
  # here again, by id, where it can be seen.
  "RUSTSEC-2026-0370",  # zvariant, unmaintained (Tauri's Linux zbus tree; never in the Windows build)
  "RUSTSEC-2026-0371",  # zbus_names, unmaintained (same Linux-only Tauri tree)
  "RUSTSEC-2026-0372",  # zvariant_derive, unmaintained (same Linux-only Tauri tree)
]

[sources]
# A crate that comes from anywhere but crates.io - an unknown registry, or a
# git address - fails CI instead of arriving unnoticed (supply-chain audit,
# 2026-09-30). Cargo.lock today names crates.io only (0 git sources), so this
# changes nothing now; it is a fence for the next dependency someone adds.
# Written from memory of cargo-deny's [sources] keys (unknown-registry,
# unknown-git, allow-registry, allow-git) and NOT run here: cargo-deny is not
# installed in the environment this was written in, so the first CI run is the
# check. `allow-registry` is spelled out; crates.io is also cargo-deny's default.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
