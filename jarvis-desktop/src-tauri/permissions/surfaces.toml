# Which window may call what.
#
# Each set below is granted by exactly one capability file, so a command is
# reachable only from the surface that has a reason to call it. The grouping is
# derived from what each page actually invokes, not from what seemed plausible.

# ---------------------------------------------------------------------------
# Every Jarvis-authored window reads the one event stream. Answering a gate is
# split out below: the whole point of the fan-out is that the surfaces that do
# render approvals answer through the same command rather than each holding
# their own logic — but a window with no approval UI has no business holding it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "jarvis-link"
description = "Read the fanned-out event stream and the local service health. Read-only."
permissions = [
  "allow-get-link-state",
  "allow-get-pending-approvals",
  "allow-refresh-link",
  "allow-check-server-health",
  # Reading the theme is not privileged and every window needs it on load, or
  # it paints the wrong palette until something tells it otherwise.
  "allow-get-theme",
  "allow-get-theme-prefs",
  # The owner's face and state colours, read from memory - never the network,
  # never a broadcast. Cosmetic: the accent and state dots follow them
  # (jarvis-link.js followAppearance), and the widget's live face wears them.
  "allow-appearance-snapshot",
  "allow-appearance-colours",
]

# Reading the theme and nothing else: the first-run window paints the
# owner's theme on load, and must not hold `jarvis-link` above for it -
# that set reads the approval queue (bug audit 2026-09-26, #6).
[[set]]
identifier = "theme-read"
description = "Read the theme. Read-only; nothing else."
permissions = ["allow-get-theme"]

# Choosing the theme. Two windows offer a picker — settings and the Brain — and
# `set_theme` fans the choice out to all four surfaces, so a third window
# holding this grant would gain nothing and widen the surface for no reason.
[[set]]
identifier = "theme-write"
description = "Change the theme for every window."
permissions = ["allow-set-theme", "allow-set-theme-follow-system"]

# Answering a gate is a decision with consequences, so it is separate from
# reading the stream. The quickbar and the widget both render approvals and
# both get it; the settings window reads the link state to show a connection
# dot and has no approval UI, so it does not.
[[set]]
identifier = "approvals"
description = "Answer a pending approval gate, or annotate one without answering it."
permissions = [
  "allow-decide-approval",
  # A note attached to a proposal before it is decided. It approves nothing,
  # so it rides with the windows that already render the gate rather than
  # earning a set of its own.
  "allow-amend-approval",
  # App lock and the widget (apps security audit M3): whether the lock is on
  # (a yes or no), and "Approve in the Jarvis bar", which only opens the bar
  # - behind the lock - on the waiting card. Neither decides anything.
  "allow-get-app-lock",
  "allow-open-approval-in-quickbar",
]

# "Open the card" (card-link.js): Settings and the Brain show one line while
# an approval card waits, with a button that opens the Jarvis bar on it. That
# DECIDES NOTHING - the bar, behind App lock, is where Deny and Approve are -
# so those two windows get only this, not `approvals` above.
[[set]]
identifier = "open-card"
description = "Open the Jarvis bar on a waiting approval card. Decides nothing."
permissions = ["allow-open-approval-in-quickbar"]

# Pause, resume or stop the turn Jarvis is running right now, and annotate it.
# Granted to the two windows that actually draw those controls - the quickbar
# and the widget - and to nothing else, the same reasoning `approvals` above
# gives for withholding itself from the settings window.
#
# Separate from `approvals` because it is a different question: `approvals`
# answers a gate Jarvis is waiting on, this interrupts work already running.
# A window could plausibly want one and not the other.
[[set]]
identifier = "task-control"
description = "Pause, resume, stop or annotate the running turn."
permissions = [
  "allow-pause-task",
  "allow-resume-task",
  "allow-stop-task",
  "allow-inject-task-note",
  # "Jarvis is working on your screen, 0:42 - Stop" (screen_work.rs): which
  # screen-control plan runs (ids and times only, never its words), and the
  # line's Stop, which is exactly the Stop everything hotkey - it stops, it
  # never approves or starts anything.
  "allow-screen-work",
  "allow-stop-everything",
]

# Real microphone capture and the spoken reply - see src-tauri/src/voice.rs's
# own module docstring for why this is granted to the quickbar and NOT to the
# hud window, which loads a vendored page with no app commands at all.
# Push-to-talk only: nothing here can start listening on its own, and
# `cancel_voice_capture` exists specifically so releasing the control early
# can throw the clip away rather than only ever being able to send it.
[[set]]
identifier = "voice"
description = "Record the microphone on push-to-talk, and play back a spoken reply."
permissions = [
  "allow-start-voice-capture",
  "allow-stop-voice-capture",
  "allow-cancel-voice-capture",
  "allow-start-automatic-listening",
  "allow-stop-automatic-listening",
  "allow-speak-reply",
  # Interrupting by talking (voice_flow.rs): ask for one utterance the
  # listener already heard to be checked by the PC as "stop or not" - never
  # transcribed, sent only to this PC's Jarvis. Records nothing itself.
  "allow-judge-barge-in",
  # The `flow` block of /api/voice/status (a read), and the "One moment."
  # clip (GET /api/voice/moment).
  "allow-get-voice-flow",
  "allow-get-voice-moment",
  # Lip-sync (face-voice.js; voice.rs `face_voice`): the mouth track and
  # playback clock of the clip playing here, handed to every window's face.
  # Only that checked shape - no words, no audio - and it decides nothing.
  "allow-face-voice",
]

# The HUD's mic button, and nothing else. The HUD loads a page vendored from
# the backend, so it holds no recording command: this only shows the
# quickbar with its mic button focused (voice.rs, `summon_push_to_talk`). The
# microphone opens only when the owner holds that button - the `voice` set
# above, which stays with the quickbar alone.
#
# And the HUD's chat box, which opens the Jarvis bar ready to type (the chat
# audit, 2026-09-28: the PC has one chat box) - `hud_open_bar`, which sends
# nothing either.
[[set]]
identifier = "hud-voice"
description = "Show the quickbar with push-to-talk ready, or with its box ready to type in. Opens no microphone, sends and records nothing."
permissions = [
  "allow-summon-push-to-talk",
  "allow-hud-open-bar",
]

# The HUD page's requests to Jarvis, made in Rust with the token, so the page
# never holds it (apps security audit M2; hud_proxy.rs). Its reads from a
# fixed list, its chat, and the right/wrong mark on one answer - the same
# `mark_answer` the quickbar uses. No approve or deny (they are answered in
# the Jarvis bar or the widget), no memory writes (the Brain's), no settings.
[[set]]
identifier = "hud-link"
description = "The HUD page's reads from a fixed list, its chat, and the right/wrong mark, sent by Rust. Decides nothing."
permissions = [
  "allow-hud-get",
  "allow-hud-chat",
  "allow-hud-chat-cancel",
  "allow-mark-answer",
]

# The daily brief and the interruption budget. Granted to the quickbar alone,
# because that is the only window that renders the panel — the HUD loads the
# backend's own page and the widget is 320px wide.
#
# `mark_digest_seen` and `set_attention_muted` are writes, but neither can
# approve anything: marking read stamps a delivery time, and muting has a fixed
# end at midnight. There is deliberately no bulk-decide route in the API to
# grant even if a window asked for one.
[[set]]
identifier = "attention-surface"
description = "Read the daily brief, mark it read, and mute spoken interruptions until tomorrow. Approves nothing."
permissions = [
  "allow-get-digest",
  "allow-mark-digest-seen",
  "allow-set-attention-muted",
]

# ---------------------------------------------------------------------------
# One command, on its own: opening a link in the real OS browser rather than
# inside the WebView. Narrow on purpose, same reasoning `allow-get-hotkeys`
# already gets by living in both quickbar-surface and settings-surface below
# - a window that only needs to open a link should not have to take on the
# rest of quickbar-surface's grants (streaming, clipboard, its own geometry)
# just to get it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "external-links"
description = "Open a link in the real OS browser, never inside the WebView."
permissions = [
  "allow-open-external-url",
]

# ---------------------------------------------------------------------------
# The spotlight. Streaming, its own geometry, the clipboard, and the shell-free
# external link opener.
# ---------------------------------------------------------------------------
[[set]]
identifier = "quickbar-surface"
description = "Everything the spotlight quickbar calls: streaming, its own window geometry, clipboard and external links."
permissions = [
  # READ-ONLY. The spotlight's primer prints the global combinations, and they
  # are configurable now — so it has to read them rather than hardcode them, or
  # it goes back to naming keys that do not do what it says. `set_hotkeys` and
  # `reset_hotkeys` stay with the settings window.
  "allow-get-hotkeys",
  "allow-stream-chat",
  "allow-cancel-chat",
  # Before a screen capture is sent: does the local model see pictures?
  # Reads the model's name from Jarvis and its abilities from loopback
  # Ollama. Sends nothing about the picture (vision.rs).
  "allow-local-model-vision",
  "allow-set-route-lane",
  "allow-hide-quickbar",
  "allow-resize-quickbar",
  "allow-set-quickbar-pinned",
  "allow-write-clipboard",
  # "Private copy" (feasibility I114): the answer card's Copy button calls
  # this one - clipboard_privacy.rs. allow-write-clipboard above stays for
  # completeness (an older build's fallback path), though nothing calls it
  # for an answer any more.
  "allow-write-clipboard-private",
  "allow-open-external-url",
  # The right/wrong mark on the answer on screen - one answer, one mark.
  # Changes no memory by itself; see commands.rs mark_answer.
  "allow-mark-answer",
  # `#log` / `#joplin` / `#obs` / Alt+Shift+N: the quickbar files the owner's own
  # words straight to /api/notes/capture instead of asking a model to, and
  # reports how it ended. The write itself still goes through the gate.
  "allow-capture-note",
  "allow-capture-note-status",
  # Which of those note apps this PC is set up for: names only.
  "allow-note-targets",
  # Temporary chat (the owner's decision, 2026-09-25): can this PC hold one?
  # GET /api/version's capabilities. A read; stream_chat checks again before
  # it sends a temporary question.
  "allow-temporary-chat-available",
  # An error's fix button (plain_errors.rs): opens Settings or the Brain, and
  # nothing else - the app lock still applies. It changes no setting.
  # "Earlier chats" uses it too, for the Brain's History tab.
  "allow-open-fix-place",
  # "Continue this chat" and Jarvis Live's "Move it here" (the chat audit,
  # 2026-09-28): the one conversation to carry on, read from History - a
  # chat or a Live session only, refused while the private lists are hidden.
  "allow-chat-continue-open",
  # Is "Hide memory lists and chat history" on? Yes or no; the bar hides its
  # thread of earlier answers with it (the second chat audit, 2026-09-28).
  "allow-chat-thread-hidden",
]

# "Used in this answer" under the quickbar's answer, and "Jarvis remembered N
# things" in the Brain (the owner's decision, 2026-09-25): the words of the
# few facts an answer used or automatic learning just saved, by id (brain/
# used.rs) - held back like every memory list while "Windows Hello for memory
# lists and chat history" hides them - and Forget or "Erase the words" on ONE
# of them. Those two are the Brain's own one-fact commands: held on a stale
# link in Rust, one id per call, asked about first by the page, no list form.
[[set]]
identifier = "memory-used"
description = "Read the words of the few facts an answer used (or automatic learning just saved), and forget or erase the words of ONE of them. No bulk form."
permissions = [
  "allow-memory-used",
  "allow-brain-memory-forget",
  "allow-brain-memory-erase",
  # "Erase the words" names the chat it would also delete (the chat audit,
  # 2026-09-28): which chat a fact came from, a read.
  "allow-brain-fact-chat",
]

# "Where this came from" (feasibility I42/I132, answer-sources.patch): the
# notes, wiki pages, web results and files a reading tool actually returned
# for one answer, by reference, plus the quote check - by the SAME turn_id
# "Used in this answer" and the right/wrong mark already use. Read-only, and
# held back like every memory list while "Windows Hello for memory lists and
# chat history" hides them (brain/sources.rs redact_sources) - the exact same
# gate as memory-used above, not a second one.
[[set]]
identifier = "chat-sources"
description = "Read this answer's own reading-tool receipts (a note, a wiki page, a web result, a file) and its quote check, by turn_id. Read-only."
permissions = [
  "allow-chat-sources",
]

# ---------------------------------------------------------------------------
# The desktop widget: its own geometry, its preferences, and quick capture.
# `prefill_quickbar` is here because the widget's capture row hands a note to
# the spotlight; the quickbar itself never calls it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "widget-surface"
description = "Widget geometry, pinning, saved position and quick capture."
permissions = [
  # Hiding its own window. The keyboard's only way out of a `skipTaskbar`,
  # undecorated window once `toggle_widget` has focused it.
  "allow-hide-widget",
  "allow-resize-desktop-widget",
  "allow-set-widget-always-on-top",
  "allow-save-widget-position",
  "allow-get-widget-prefs",
  "allow-prefill-quickbar",
  "allow-capture-note",
  # How that note ended - the server's answer, never the model's account.
  "allow-capture-note-status",
  # Which of those note apps this PC is set up for: names only.
  "allow-note-targets",
]

# ---------------------------------------------------------------------------
# The settings window, and ONLY the settings window.
#
# This set is the reason the whole file exists. `set_supervision` persists an
# arbitrary program path and `start_backend` runs it, so together they are
# code execution as the user that survives a restart — and `set_api_settings`
# redirects the base URL that every token-bearing request is built from, by
# reqwest rather than the webview, so neither the CSP nor a proxy sees where it
# goes. Reachable from one window that exists only when the user opened it,
# rather than from all four.
# ---------------------------------------------------------------------------
[[set]]
identifier = "settings-surface"
description = "Read and write the connection settings, backend supervision, the log location and whether Jarvis starts with Windows. Privileged: keep this to the settings window."
permissions = [
  # The global accelerators. A write, and a privileged-feeling one — it binds
  # keys machine-wide — so it sits with the other settings-only powers rather
  # than with the read-only sets. `hotkeys.rs` refuses a binding with no
  # modifier, which is the only shape that could not be undone from inside the
  # app afterwards.
  "allow-get-hotkeys",
  "allow-set-hotkeys",
  "allow-reset-hotkeys",
  # Updates. `install_update` replaces the running executable, which is the
  # largest single thing this app can do to the machine — so it lives here,
  # behind the window a person has to open deliberately, and it is a separate
  # command from the check rather than a flag on it. Nothing else in the build
  # can reach it, and no timer calls it.
  "allow-update-status",
  "allow-check-for-update",
  "allow-set-update-check-on-start",
  "allow-install-update",
  # Restart is the second half of installing one: without it the new binary
  # is on disk and the running process is still the old one.
  "allow-restart-app",
  "allow-get-api-settings",
  "allow-set-api-settings",
  # "Show the token for my phone": returns the pairing token to this one
  # page, on a click, so the owner can type it into the phone. Here and
  # nowhere else - the other windows never need to see it.
  "allow-reveal-pairing-token",
  # "Second graphics card": what was found, and one switch at a time. Turning
  # a switch ON starts a second copy of Ollama once its approval card is
  # approved, so it sits with the other settings-only powers. It approves
  # nothing itself - ON only raises the card - and there is no form that
  # sends more than one switch.
  # "What this backend supports": the capability names GET /api/version
  # reports, the list the phone shows under "This backend". A read, names
  # only - what a capability carries (power's mode, say) is not passed on.
  "allow-get-backend-capabilities",
  "allow-get-second-card",
  "allow-set-second-card",
  # Moving one of the second card's own features onto a third, capable
  # graphics card (2026-09-28) - its own command, since the wire shape
  # differs ("assign", not "enabled"); the GET side rides along in
  # allow-get-second-card's own poll (status()'s new "third" key).
  "allow-set-third-card",
  # "When to suggest the bigger model": the two settings that decide
  # whether Jarvis may OFFER "One bigger model on both cards" on its own
  # (2026-09-27). No card either way - it only changes whether Jarvis
  # offers, never what it may do without a person's yes - so it sits here
  # with manner/humour, not with the switch above.
  "allow-set-second-card-suggest",
  # "Big model (slow)": what was found (colibri, Python, memory, the models
  # and their drives) and one switch at a time. Turning a switch ON lets
  # Jarvis start colibri on this PC for background jobs once its approval
  # card is approved, so it sits with the other settings-only powers. It
  # approves nothing itself - ON only raises the card, and is held while the
  # event stream is stale - and there is no form that sends more than one
  # switch.
  "allow-get-big-model",
  "allow-set-big-model",
  # "Morning briefing": when it arrives, and what it includes. Setting one up
  # approves nothing - it repeats, so the PC raises the scheduler's ONE
  # approval card (schedule_repeat) listing the next three times - and is
  # held while the event stream is stale. Stopping one is immediate, one
  # briefing at a time, and only for a job the PC lists as a briefing. The
  # briefing itself is never read here. "Show who new emails are from": OFF
  # is immediate; ON only raises ONE approval card on the PC, and is held
  # while the event stream is stale.
  "allow-get-briefing-setup",
  "allow-set-briefing",
  "allow-stop-briefing",
  "allow-set-briefing-senders",
  # "Hardware and models": the cards and the three setups for them. Choosing
  # a setup changes nothing by itself; each of its steps is ONE request that
  # raises its own existing approval card (model install, model switch, a
  # second-card switch) or the new models_create card, read from the
  # backend's own answer - never a route or a body from the page. Asking and
  # measuring are held while the event stream is stale.
  "allow-get-hardware",
  "allow-apply-hardware",
  "allow-hardware-step",
  "allow-measure-hardware",
  # "PC help" (JARVIS-API section 84): why the PC is slow, how full the
  # drives are, what is using the graphics card, how hot it is, when it last
  # restarted - read-only, it changes nothing.
  "allow-get-pc-help",
  # "Web search": the five providers with their "why" lines, and ONE change
  # at a time - the provider, the SearXNG address, "Ask before every web
  # search" (off raises an approval card on the PC). Changes and the test
  # search are held while the event stream is stale. The Exa, Tavily and Brave
  # keys are written straight into Credential Manager on this PC by
  # save_search_key: never sent to the backend or the phone, never read
  # back to a page. Settings window only - rule 3.
  "allow-get-web-search",
  "allow-set-web-search",
  "allow-test-web-search",
  "allow-save-search-key",
  "allow-forget-search-key",
  # "Accounts" (ease-of-use audit row 15): the IMAP username and password,
  # the private calendar link, and the Home Assistant token, written
  # straight into Credential Manager on this PC by save_account_secret -
  # never sent to the backend or the phone, never read back to a page. The
  # matching environment variable, if the owner already has one, keeps
  # winning on the backend either way. Settings window only - rule 3.
  "allow-get-account-secrets",
  "allow-save-account-secret",
  "allow-forget-account-secret",
  # "What Jarvis can reach": every way Jarvis can reach something outside
  # itself, whether each is on, where it goes (a host only) and whether it
  # asks first - written by the PC from its settings, never by the model.
  # A read: it changes nothing, and no key or private link is in it.
  "allow-get-reach",
  # The sun, the moon and the weather behind the animal faces (backend/
  # sky.patch, the owner's decisions of 2026-09-28): the settings (a read),
  # and ONE change at a time - show them, the town (this PC only; the PC
  # checks too), forget the town, the weather source. Open-Meteo ON
  # approves nothing: the PC raises ONE approval card. Adding is held on a
  # stale link in Rust; hiding, forgetting and "off" never are.
  "allow-get-sky",
  "allow-set-sky",
  # "What asks first" (backend/asks-first.patch, 2026-09-26): every action
  # and whether it asks first, in the PC's words (a read); "Ask me first" on
  # ONE action of the short safe list - stricter at once, looser only as one
  # approval card that needs Windows Hello on the PC, held on a stale link in
  # Rust; and "Lights, plugs and fans without a card" (ON one card, OFF at
  # once). Rust refuses any action off the list before sending; so does the PC.
  "allow-get-asks-first",
  "allow-set-asks-first",
  "allow-set-lights-without-card",
  # Offering a reading tool to the AI model at all (the owner's answer of
  # 2026-09-27) - a DIFFERENT thing from "Ask me first" above. ON is one
  # approval card that needs Windows Hello on the PC, held on a stale link in
  # Rust; OFF is at once. Rust refuses any tool off the short list before
  # sending; so does the PC. Desktop only.
  "allow-set-tool-enabled",
  # "Sending email": whether it is set up, from which address and through
  # which server (GET /api/email/sending). A read: it sends nothing and
  # never carries the password. Each email is its own approval card.
  "allow-get-email-sending",
  # "Folders Jarvis may look in" (backend/documents.patch, 2026-09-26): the
  # list (a read); adding ONE folder through the Windows folder picker - the
  # PC raises one approval card, held on a stale link in Rust; removing one
  # at once; bringing in a Notion export through the Windows file picker,
  # held on a stale link. The pickers run in Rust: this window gets no file
  # system of its own, only the path the owner chose.
  "allow-get-folders",
  "allow-add-folder",
  "allow-remove-folder",
  "allow-import-notion",
  # "Backups" (backend/jarvis_backup.py, backup.patch, the owner's decision
  # of 2026-09-27): one locked backup file with a recovery code shown once.
  # Setting the folder reuses the Windows folder picker above and raises
  # one approval card, held on a stale link; "Back up now" and listing are
  # reads/no-card actions; restoring is one card that always needs Windows
  # Hello, held on a stale link.
  "allow-get-backup",
  "allow-list-backups",
  "allow-set-backup-folder",
  "allow-backup-now",
  "allow-preview-restore",
  "allow-restore-backup",
  # "Devices" (docs/PAIRING-DESIGN.md, phase 1, 2026-09-28): pairing a phone
  # by QR code, with a key per device. Starting a pairing is PC only on the
  # backend too; the QR code is drawn in Rust and only the picture reaches
  # this page, never its text. Pair a phone ends in ONE approval card
  # (Windows Hello, PC only), answered in the Jarvis bar or the widget like
  # every other - held on a stale link in Rust. Removing a device and
  # retiring the old shared key only take access away: at once, never held.
  # Bringing the shared key back is one card plus Windows Hello, held.
  "allow-pair-phone-address",
  "allow-pair-start",
  "allow-pair-session",
  "allow-pair-cancel",
  "allow-devices-list",
  "allow-devices-remove",
  "allow-devices-shared",
  # "How Jarvis talks" (backend/manner.patch): warm and brief, or plain, and
  # the Humour switch beside it (the owner's decision, 2026-09-27). Wording
  # only; no card either way; held on a stale link in Rust.
  "allow-get-manner",
  "allow-set-manner",
  "allow-set-humor",
  # "Voice": what the PC says about listening to the owner - whether each
  # microphone's voice print is trained, which voice check is installed, the
  # wake word, the stop word and Smart Turn (GET /api/voice/status). A read:
  # it records nothing and changes nothing. Training stays on the phone.
  "allow-get-voice-status",
  # The PC's "hey Jarvis" switch, one direction at a time. OFF is immediate
  # and never held - it only narrows what listens. ON approves nothing: the
  # server raises ONE approval card (change_own_config), and ON is held
  # while the event stream is stale.
  "allow-set-wake-word",
  # Voice training on this PC, the voice-check settings, the guided test and
  # custom voices (voice_training.rs). Recording opens the microphone, so it
  # sits here with the other settings-only powers and nowhere else; the
  # recordings are held in the app's memory, never in the page, never on
  # disk, and sent only to this Jarvis. Everything that widens who Jarvis
  # obeys, what it reads aloud or how it speaks only raises ONE approval
  # card (and is held while the event stream is stale): finishing a
  # training, loosening a setting, adding a voice, switching to one, the
  # better voice ON. Tightening, cancelling, going back to the built-in
  # voice, deleting a voice and the better voice OFF are immediate.
  "allow-start-voice-sample",
  "allow-voice-sample-level",
  "allow-stop-voice-sample",
  "allow-cancel-voice-sample",
  "allow-discard-voice-samples",
  "allow-send-voice-training",
  "allow-cancel-voice-training",
  "allow-measure-voice",
  "allow-set-voice-setting",
  "allow-check-voice-with-someone-else",
  "allow-propose-voice-threshold",
  "allow-get-custom-voices",
  "allow-create-custom-voice",
  "allow-set-active-voice",
  "allow-delete-custom-voice",
  "allow-set-better-voice",
  # How fast every voice speaks (Slower / Normal / Faster): no card either
  # way; held on a stale link in Rust, like the manner setting.
  "allow-set-voice-speed",
  # Which of Kokoro's own voices the built-in voice uses: the same shape,
  # no card either way.
  "allow-set-voice-speaker",
  # "Voice follows the face" (an animal face speaks in its own built-in
  # voice): an on/off switch, the same shape - no card either way.
  "allow-set-voice-face",
  # Each animal's own voice, pitch and pace, and "Reset to its own voice":
  # the same shape, no card either way. "Try it" plays one fixed line in
  # that voice and changes nothing.
  "allow-set-voice-animal",
  "allow-reset-voice-animal",
  "allow-try-voice-animal",
  # "Hear it" for one built-in voice (the owner, 2026-09-28: Kokoro v1.0): the PC
  # says one fixed line in it, by name, and changes no setting - the same
  # shape as "Try it", so no card and never held on a stale link.
  "allow-hear-voice-sample",
  # The one-time "The Red Panda has its own voice. Use it?" question
  # (the owner, 2026-09-28): the answer, under "Voice follows the face".
  # No card either way, held on a stale link like the switch.
  "allow-answer-face-voice-offer",
  "allow-supervisor-status",
  "allow-set-supervision",
  "allow-start-backend",
  "allow-stop-backend",
  # Diagnostics. `get_log_info` returns paths and sizes, never contents - the
  # log is plain text with no redaction pass and must not become readable by a
  # page just because the page can ask where it is. `open_log_folder` hands a
  # directory to Explorer and takes no argument at all, so there is nothing a
  # caller can point it at.
  "allow-get-log-info",
  "allow-open-log-folder",
  # Starting with Windows. A registry write under HKEY_CURRENT_USER\...\Run,
  # which is a thing that survives uninstalling carelessly, so it belongs with
  # the other settings-only powers rather than anywhere a chat page can reach.
  "allow-get-autostart",
  "allow-set-autostart",
  # "Security": the app lock, Windows Hello for approvals and for private
  # answers (lock.rs). Here and nowhere else, because lowering one is the
  # power to switch a lock off. The command itself asks Windows Hello before
  # anything is loosened, so even this window cannot lower one silently.
  "allow-get-security-settings",
  "allow-set-security-settings",
  # "Check for tool updates" (backend/jarvis_tool_updates.py, tool-updates.patch,
  # the owner's own request): read-only, and it never installs or changes
  # anything - only the exact command to run yourself. Not held on a stale
  # link, like backup_now: the ONE approval card, if it is ever needed, is
  # decided by the normal approval flow, not by this command; this command
  # only starts the check (which can take a few minutes - crates.io is asked
  # once per Rust crate NAME) and returns at once, never blocking on it.
  "allow-get-tool-updates",
  "allow-check-tool-updates",
  # The floating face: whether it is on, and turning it on or off (windows.rs
  # `show_floating`/`hide_floating`). Here, not with the widget's own geometry
  # commands below: this is a Settings toggle, and the floating window itself
  # holds no command capability at all - it has no button to call one from.
  "allow-get-floating",
  "allow-set-floating",
  # "Hang and crash notes" (crash_notes.rs, feasibility I99) and "Find it for
  # me" (pyfind.rs, feasibility I98), both under Settings -> More options.
  # Bug audit 2026-09-27, desktop-rust finding #2: both commands existed and
  # were wired into lib.rs's generate_handler! from the day each feature was
  # built, but neither was ever added to build.rs's own export list, so no
  # permission was ever generated for either - every call refused at the
  # ACL, with no capability file able to fix it. crash_notes is a read
  # (already-scrubbed text, see that module's own doc comment); find_python
  # only searches this PC for a Python it can suggest and never writes
  # anything - the owner still confirms the result with Save.
  "allow-crash-notes",
  "allow-find-python",
]

# ---------------------------------------------------------------------------
# The Brain window, and only the Brain window.
#
# Split into three sets rather than one, because reading what Jarvis knows,
# putting a file back, and replacing the model that answers every question are
# three different powers. A capability file can grant the first without the
# third, which is the whole reason the ACL exists.
# ---------------------------------------------------------------------------

# One fan-out read over a fixed allowlist in brain.rs. The window names
# sections, never URLs, so this grant cannot reach an endpoint that file did
# not decide it may reach — and a unit test asserts every entry in that list is
# a GET that changes nothing.
[[set]]
identifier = "brain-read"
description = "Read the memory graph, models, compute, skills, jobs, the undo shelf, the ledger, content risk and the watchlist. Read-only."
permissions = ["allow-brain-read"]

# Reverting and cancelling. Every one of these moves toward a state the owner
# already had, or stops something that has not finished — which is why they sit
# together and apart from the set below.
[[set]]
identifier = "brain-act"
description = "Revert an undo entry, cancel a Long Fuse job, stop a message inside its send window, and manage the GitHub watchlist."
permissions = [
  "allow-brain-revert-undo",
  "allow-brain-cancel-job",
  "allow-brain-cancel-hold",
  "allow-brain-watch-add",
  "allow-brain-watch-remove",
  "allow-brain-watch-seen",
]

# Changing what Jarvis is made of. Removing a skill takes an ability away for
# good, and switching a model replaces the weights that answer every question
# the owner asks. Neither is undoable from the same screen that did it —
# rollback exists for models, but nothing reinstalls a removed skill, because
# installing runs the scanner and the gate and there is deliberately no route
# that skips them.
[[set]]
identifier = "brain-faculties"
description = "Remove a skill; install, switch or roll back a model. Privileged: keep this to the Brain window."
permissions = ["allow-brain-remove-skill", "allow-brain-model"]

# Changing what Jarvis remembers about the owner.
#
# Its own set rather than part of `brain-act`, because that set is explicitly
# the things that "move toward a state the owner already had" and forgetting is
# the exact opposite: the server retires rather than deletes, so the row
# survives, but nothing in the product brings a retired fact back. Editing is
# gentler - it supersedes, and can be corrected again - but it lives here too,
# since both decide what the model is told about a person.
#
# The learning switch is in the same set on purpose. Turning the extractor on
# is the power to have facts proposed about you at all, which is upstream of
# every other item here.
[[set]]
identifier = "brain-memory"
description = "Keep or discard a proposed fact, reword one, stop one being recalled, erase the words of one for good, export the store, read what Jarvis believed at a past moment, turn the background learner on or off, list what it saved automatically and turn its two automatic-learning switches on (an approval card) or off, pin or unpin a fact on \"Always keep in mind\", and tag or untag a fact for \"Between us\". One fact per decision; there is no bulk form."
permissions = [
  "allow-brain-memory-decide",
  "allow-brain-memory-forget",
  # "Erase the words" (the owner's decision, 2026-09-24): ONE fact's words
  # wiped for good, its dates kept. Stricter than forget, never looser:
  # held on a stale link, one id per call, asked about first.
  "allow-brain-memory-erase",
  # "Also delete the chat it came from" names that chat first (the chat
  # audit, 2026-09-28): which chat a fact came from, a read. Its title is
  # taken out while the private lists are hidden.
  "allow-brain-fact-chat",
  "allow-brain-memory-edit",
  "allow-brain-memory-learning",
  "allow-brain-memory-export",
  "allow-brain-memory-as-of",
  "allow-brain-memory-sleep-time",
  # "Both are true": one proposal, one decision, like decide above.
  "allow-brain-memory-keep-both",
  # Automatic learning (JARVIS-API.md section 19; brain/auto_learn.rs): the
  # switches' state (GET /api/memory/learning, a read); the "Saved
  # automatically" list - a read, held back like the other memory lists
  # while "Windows Hello for memory lists and chat history" hides them; and
  # its two switches, ONE setting per call. ON only raises an approval card
  # (tier `ask`) and is held while the event stream is stale; OFF is
  # immediate. Forgetting one of them is brain_memory_forget above.
  "allow-brain-memory-learning-status",
  "allow-brain-memory-auto-list",
  "allow-brain-memory-learning-auto",
  "allow-brain-memory-learning-sensitive",
  # The ids of facts saved automatically that the owner has not looked at
  # yet, counted in Rust because the Brain is destroyed when it is closed
  # (brain/auto_learn.rs note_saved). Ids only, never a fact's words; it
  # changes nothing but that count.
  "allow-brain-memory-saved-unseen",
  # "Always keep in mind" (brain/profile.rs; the owner's decision,
  # 2026-09-24): the pinned facts - a read, held back like the other memory
  # lists while "Windows Hello for memory lists and chat history" hides them
  # - and pin or unpin ONE fact per call. No approval card (the owner's own
  # tap, like Forget), held while the event stream is stale.
  "allow-brain-memory-profile",
  "allow-brain-memory-pin",
  # "Between us" (brain/shared.rs; the owner's decision, 2026-09-27): the
  # shared-joke facts - a read, held back like the other memory lists while
  # "Windows Hello for memory lists and chat history" hides them - and tag
  # or untag ONE fact per call. No approval card (the owner's own tap, like
  # Pin), held while the event stream is stale.
  "allow-brain-memory-shared",
  "allow-brain-memory-share",
  # "History of this fact" (brain/fact_history.rs; the owner's choice,
  # 2026-09-28): every version of ONE fact - a read, held back like the
  # other memory lists while "Windows Hello for memory lists and chat
  # history" hides them; an erased version never with its words.
  "allow-brain-fact-history",
  # "Facts this chat taught" (brain/conversation_facts.rs; the owner's
  # choice, 2026-09-28): the facts in use ONE conversation taught, for
  # History's Delete to offer forgetting them - a read, held back like the
  # other memory lists. Forgetting each ticked fact is brain_memory_forget,
  # one fact per call; nothing here forgets.
  "allow-brain-conversation-facts",
]

# Chat history on the PC (JARVIS-API.md section 18; brain/history.rs).
# Listing and opening a conversation are reads - and both are held back
# while "Windows Hello for private answers" hides the Brain's lists. Delete
# is ONE conversation per call; there is no "delete all" anywhere. The switch
# is ONE setting per call: ON only raises an approval card (tier `ask`) and
# is held while the event stream is stale, OFF is immediate.
#
# "Search what was said" (JARVIS-API.md section 71, 2026-09-28) is a read
# too, held back the same way: the PC opens each kept turn in memory for
# that one search, keeps no index, and nothing reaches the AI model.
#
# "Continue this chat" (the chat audit, 2026-09-28) brings up the Jarvis bar
# and names the chat to carry on - the id only; the bar reads it itself
# (chat_continue_open, in quickbar-surface). Copy on an opened old answer
# uses the same private copy as the bar's own Copy (clipboard_privacy.rs).
[[set]]
identifier = "brain-history"
description = "List, read and search the chat history kept on the PC, delete one conversation, change its two settings (turning it on only raises an approval card), hand a chat to the Jarvis bar to continue, and copy an old answer. No bulk delete."
permissions = [
  "allow-brain-history-list",
  "allow-brain-history-open",
  "allow-brain-history-search",
  "allow-brain-history-delete",
  "allow-brain-history-settings",
  "allow-brain-continue-chat",
  "allow-write-clipboard-private",
]

# Show, on the Brain's memory lists while "Windows Hello for private
# answers" is on (lock.rs). It asks Windows Hello and, when the owner
# confirms, lets brain_read return the entries until they have been away
# longer than "Lock again after". It changes no setting and no memory.
[[set]]
identifier = "private-reveal"
description = "Show the Brain's hidden memory lists, after Windows Hello confirms it is the owner. Changes nothing."
permissions = ["allow-reveal-private-answers"]

# The wiki builder (backend/wiki.patch). Reading the list of documents and
# following one job are reads; "Add to wiki" only raises ONE approval card
# (wiki_update) - the backend writes nothing until it is answered, and the
# command is held while the event stream is stale. Opening the folder opens
# only a folder called "Jarvis Wiki" on this PC, named by the backend.
[[set]]
identifier = "brain-wiki"
description = "Read the wiki builder's documents, add one document to the wiki (which raises one approval card), follow that, and open the Jarvis Wiki folder."
permissions = [
  "allow-wiki-status",
  "allow-wiki-ingest",
  "allow-wiki-ingest-status",
  "allow-wiki-open-folder",
]

# Deep questions (backend/big-model.patch): the big model answers one
# question in the background, with no tools, no internet and no memory of
# other conversations. Reading the list is a read. Asking raises no card - the
# owner approved the "Deep questions" switch in Settings with one - because a
# question acts on nothing and nothing leaves the PC; it is still held while
# the event stream is stale (rule 4). Nothing here can turn the big model on:
# that is `get_big_model` / `set_big_model`, in settings-surface.
[[set]]
identifier = "brain-deep"
description = "Read the deep questions and their answers, and ask one (no card per question; the switch was approved in Settings). Cannot turn the big model on or off."
permissions = [
  "allow-get-deep",
  "allow-ask-deep",
]

# "Coming up" (backend/schedule.patch; the owner's decisions of 2026-09-25):
# the timers, alarms, reminders, repeating jobs and the to-do list. Reading
# is a read - the words taken out in Rust while "Windows Hello for memory
# lists and chat history" hides the private lists. A change names ONE job
# (pause, resume, delete, done, add time) or adds ONE to-do item; none raises
# a card, because none can make Jarvis do more - a repeating job's card is
# raised on the PC when it is SET, by talking to Jarvis. Every change is held
# while the event stream is stale. There is no "delete all". Since 2026-09-25
# a change may also be a Snooze (one job that went off, no card), and ONE
# NAMED list ("shopping") may be cleared after the page's "are you sure?",
# with the count it showed - never the to-do list itself.
[[set]]
identifier = "brain-schedule"
description = "Read Coming up (timers, alarms, reminders, the to-do list and named lists), change ONE job at a time (pause, resume, delete, done, add time, snooze), add one to-do item, set up a standby schedule or one Today card (no approval card), and clear ONE named list after the page's are-you-sure (never the to-do list)."
permissions = [
  "allow-brain-schedule",
  "allow-brain-schedule-act",
  "allow-brain-schedule-add-todo",
  "allow-brain-schedule-add-standby",
  "allow-brain-schedule-add-today",
  "allow-brain-schedule-clear-list",
]

# Goals (backend/goals.patch, JARVIS-API.md section 59; the owner's "build it
# now", 2026-09-27): reading the list is a read - the words taken out in Rust
# while the private lists are hidden, same as Coming up. A new draft, marking
# a step done or not, and Stop tracking raise no card - a draft is content,
# not action, and the other two are immediate, like a to-do item. Accepting
# a draft is the one place this can raise a card, and it is the backend's
# own, through jarvis_schedule.py's existing mechanism - never a card this
# app raises itself. Every write held while the event stream is stale.
[[set]]
identifier = "brain-goals"
description = "Read Goals, add one draft goal, accept a draft (the backend raises its own one weekly-check-in approval card), mark one step done or not, and stop tracking a goal - no card except through accepting, and every change held on a stale link."
permissions = [
  "allow-brain-goals",
  "allow-brain-goals-create",
  "allow-brain-goals-accept",
  "allow-brain-goals-step",
  "allow-brain-goals-stop",
]

# "Widgets you describe" (the owner's choice of 2026-09-28, the SAFE
# version; brain/widgets.rs, backend jarvis_widgets.py; JARVIS-API.md section
# 87). The Brain lists the widgets, asks the PC for a PREVIEW from the
# owner's typed words (the PC's model turns them into a checked description,
# never code), keeps ONE preview on Add and deletes ONE widget at once. No
# approval card: a widget only shows what the apps already show, and its
# buttons are the five Quick Settings tile actions. Add and Delete are held
# on a stale link; the words are taken out in Rust while the private lists
# are hidden.
[[set]]
identifier = "brain-widgets"
description = "List the widgets, make a preview from the owner's typed words, keep or drop ONE preview, delete ONE widget. No approval card; no bulk delete."
permissions = [
  "allow-brain-widgets",
  "allow-brain-widgets-draft",
  "allow-brain-widgets-add",
  "allow-brain-widgets-discard",
  "allow-brain-widgets-delete",
]

# The desktop widget window draws ONE chosen widget in place of the face -
# the same window, no new webview. It reads the widget filled in (private
# words taken out in Rust while App lock is on or the lists are hidden), and
# presses ONE button from a closed list of five in Rust: a focus session, a
# 10-minute timer, Brief me (opens the Brain, behind App lock), Stop
# everything, play/pause on the PC. Never Approve or Deny; never a route or
# a body from the page. Everything but Stop everything and Brief me is held
# on a stale link.
[[set]]
identifier = "widget-board"
description = "Read the owner's saved widgets and draw one; press ONE of the five safe tile actions. Approves nothing."
permissions = [
  "allow-widget-board",
  "allow-widget-board-action",
]

# "Photo to reminder" (photo-reminder.patch; the owner's choice of
# 2026-09-28): a picture - a screen capture in the Jarvis bar, a picture file
# in the Brain's Coming up - goes to the PC, which reads its words with
# Windows' own text recognition and PROPOSES a reminder; a scan sets nothing
# up. The owner's tap then adds ONE one-off reminder (no card, like any
# one-off reminder they set), held on a stale link.
[[set]]
identifier = "photo-reminder"
description = "Send one picture to the PC to find a date in it (a proposal only - nothing is set up), and add ONE one-off reminder on the owner's tap."
permissions = [
  "allow-photo-scan",
  "allow-photo-add-reminder",
]

# "Bring in chats from ChatGPT, Claude, Gemini or DeepSeek" (history-import.patch; the
# owner's choice of 2026-09-28): the owner picks an export file on this PC in
# the Windows "Open" dialog (run in Rust - the window gets no file access),
# and the PC reads the owner's own messages in the background and PROPOSES
# facts. Every one waits in "Waiting for you" for its own yes; nothing here
# decides a card. Start is held on a stale link; cancel never is.
[[set]]
identifier = "brain-history-import"
description = "Read where a chat-history import is, pick ONE export file on this PC and start reading it (it only proposes - every fact waits for its own yes), and stop it."
permissions = [
  "allow-history-import-status",
  "allow-history-import-start",
  "allow-history-import-cancel",
]

# Projects (backend/projects.patch; JARVIS-API section 88; the owner's
# decision of 2026-09-28, docs/PROJECTS-DESIGN.md build step 3). Reading is a
# read - hidden in Rust while "Windows Hello for memory lists and chat
# history" hides the private lists. A change is ONE action from a fixed list
# (brain/projects.rs ACTIONS) - the page never names a URL - and the PC
# decides which raise a card: Shareable ON and taking off a private mark
# Jarvis made itself, one change_own_config card each. Every change is held
# while the event stream is stale, except Shareable OFF. A coding project's
# folder comes only from the Windows folder picker (a typed path is
# refused in Rust), and the PC accepts only one on "Folders Jarvis may look
# in". Nothing here runs a benchmark's command: that is a later step.
[[set]]
identifier = "brain-projects"
description = "Read the projects, make ONE change at a time (a project, its Shareable switch, a benchmark, one number, a private mark - the PC raises any card), and choose a coding project's folder with the Windows picker. Runs nothing."
permissions = [
  "allow-projects-read",
  "allow-projects-write",
  "allow-projects-choose-folder",
]

# "Forget a time frame" (backend/forget-range.patch; JARVIS-API section 64;
# the owner's decision of 2026-09-28). Reading the status or the list for
# some days is a read - the list's words hidden in Rust while "Windows Hello
# for memory lists and chat history" hides the private lists, or App lock
# has locked Jarvis. A change is ONE of two actions from a fixed list
# (brain/forget_range.rs) - the page never names a URL: "Forget these" sends
# the ids still ticked, and the PC raises ONE card listing every item (never
# approved here, never by voice); it is refused while the list is hidden
# and held while the event stream is stale. Undo puts back what that card
# removed, within 10 minutes, with no card; it is never held.
[[set]]
identifier = "brain-forget-range"
description = "Read what Jarvis learned and the chats from some days, ask the PC to forget the ticked ones (the PC raises ONE approval card), and Undo within 10 minutes. Approves nothing."
permissions = [
  "allow-forget-range-read",
  "allow-forget-range-write",
]

# "Inbox tidy by voice" (backend/inbox-tidy.patch; JARVIS-API section 92; the
# owner's decision of 2026-09-28). The tidy itself is an ordinary approval
# card, decided in the Jarvis bar (never by voice, never from the widget's
# one line). This set is only the Undo strip under the bar's input: reading
# whether a tidy is open to Undo is a read (the PC's words taken out in Rust
# while Jarvis is locked or the private lists are hidden), and Undo puts back
# what the last tidy changed - one tap, no card, held on a stale link and
# while the words are hidden. It cannot start a tidy or approve anything.
[[set]]
identifier = "inbox-tidy"
description = "Read whether an inbox tidy is open to Undo, and Undo it within 10 minutes (no card). Cannot start a tidy or approve one."
permissions = [
  "allow-inbox-tidy-read",
  "allow-inbox-tidy-undo",
]

# Focus sessions (backend/focus.patch; the owner's decision of 2026-09-25): a
# timer plus Quiet, drifts named out loud on this PC, counts only. Reading it
# is a read. ONE thing per call to the running session - pause, resume, +10
# minutes, stop, and the widget's Lock on - no card (jarvis_focus.py says
# why); resume, extend and lock are held on a stale link in Rust, pause and
# stop are not (they only make Jarvis do less). Starting one is its own set,
# the Brain's alone: the widget shows and steers a session, it does not start
# one.
# Jarvis Live (live.rs; docs/LIVE-DESIGN.md; the owner's answers of
# 2026-09-28): a back-and-forth voice conversation on this PC. Start needs no
# card (the owner's own act) but is held on a stale link and while App lock
# would ask; Stop and Mute only make Jarvis hear less and are never held. The
# microphone itself is voice.rs's and only a server on this PC hears it. The
# Jarvis bar holds the whole set; the always-on-top badge holds it too, so
# the owner can always end Live from the sign that says it is on.
# The one-time animal voice question, for the Faces window: read ONLY the
# waiting question (never the voices list) and answer it - "Use it" turns
# "Voice follows the face" on, "Keep my voice" changes nothing. No card
# either way (the switch has none); the answer is held on a stale link.
[[set]]
identifier = "face-voice-offer"
description = "Read the PC's one-time \"has its own voice - use it?\" question for an animal face (the question only, never the voices list) and send the owner's answer. No card; the answer is held on a stale link."
permissions = [
  "allow-get-face-voice-offer",
  "allow-answer-face-voice-offer",
]

[[set]]
identifier = "live"
description = "Jarvis Live: read the session (fixed words and minutes, never what was said), start it (no card; held on a stale link and under App lock), stop it, more time, carry on, mute or unmute."
permissions = [
  "allow-live-status",
  "allow-live-start",
  "allow-live-stop",
  "allow-live-act",
  "allow-live-mute",
]

# Live's microphone holds - closed while a card is shown or an answer is
# spoken under "Interrupt by tap only" (live.rs `live_hold`). Only the Jarvis
# bar shows cards and plays answers, so only it holds this; the badge never
# calls it (the 2026-09-28 desktop audit, #5).
[[set]]
identifier = "live-hold"
description = "Jarvis Live: keep the microphone closed while the Jarvis bar shows a card or speaks an answer under \"Interrupt by tap only\", and open it again after."
permissions = ["allow-live-hold"]

[[set]]
identifier = "focus"
description = "Read the focus session (a countdown, booleans and counts - never what was in front) and do ONE thing to it: pause, resume, +10 minutes, stop, or lock on where the owner lands. No card; resume, extend and lock are held on a stale link."
permissions = [
  "allow-focus-status",
  "allow-focus-act",
]

[[set]]
identifier = "focus-start"
description = "Start a focus session (minutes, and optionally what it is on). No card. Held on a stale link."
permissions = [
  "allow-focus-start",
]

# "Talk to a chatbot for me" (backend/chatbot-routes.patch; the owner's decisions of
# 2026-09-27 and 2026-09-28): Jarvis asks an AI chatbot about something for
# the owner, within limits approved on ONE card. Reading the conversation is
# a read (the goal and the transcript taken out in Rust while the private
# lists are hidden). Starting one and changing its limits each raise a card
# on the PC and are held on a stale link; Stop and Pause only make Jarvis do
# less and are not held; Resume raises the task's own card and is held. The
# Brain's alone.
[[set]]
identifier = "chatbot"
description = "Talk to a chatbot for me: read the conversation, start one (ONE approval card), change its limits (a NEW card), stop, pause and resume it; ask several and compare (ONE card listing every chatbot) and stop that. Start, compare, limits and resume are held on a stale link."
permissions = [
  "allow-chatbot-status",
  "allow-chatbot-start",
  "allow-chatbot-limits",
  "allow-chatbot-stop",
  "allow-chatbot-pause",
  "allow-chatbot-resume",
  "allow-chatbot-compare-start",
  "allow-chatbot-compare-stop",
]

# "Chat with customer support for me" (jarvis_support.py; the owner's
# decisions of 2026-09-28): Jarvis chats with a company's customer support in
# the owner's name. Reading the chat is a read (the owner's words taken out in
# Rust while the private lists are hidden). Starting one raises ONE card on
# the PC and is held on a stale link; Stop and Take over only make Jarvis do
# less and are not held; Decline and "Say something else" send words and are
# held; accepting an offer is only ever the offer's own card. Export writes
# a file the owner picks, and is held while the private lists are hidden. The
# Brain's alone.
[[set]]
identifier = "support"
description = "Chat with customer support for me: read the chat, start one (ONE approval card listing every detail), stop it, take over, decline an offer or say something else, and export the transcript to a file you pick. Start, Decline and Say something else are held on a stale link."
permissions = [
  "allow-support-status",
  "allow-support-start",
  "allow-support-stop",
  "allow-support-takeover",
  "allow-support-answer",
  "allow-support-export",
]

# The morning briefing (backend/briefing.patch; the owner's decisions of
# 2026-09-25): read the latest one, and "Brief me now". Both only READ - the
# PC puts it together without the model and reads the calendar and the
# unread-email count only as their own settings allow - so neither is held on
# a stale link, like every read. The lines are taken out in Rust while the
# private lists are hidden. Setting one up and stopping one are Settings'
# (settings-surface), not here.
[[set]]
identifier = "brain-briefing"
description = "Read the latest morning briefing and ask for one now (reads only; the lines hidden in Rust with the private lists). Cannot set one up or stop one."
permissions = [
  "allow-brain-briefing",
  "allow-brain-briefing-now",
]

# ---------------------------------------------------------------------------
# The faces window: read and write the appearance document.
#
# This is the one thing that window persists, and it is shared rather than
# local — the server holds it so the phone sees the same choice. It changes how
# Jarvis LOOKS and nothing else: it cannot approve anything, start anything, or
# reach the connection settings.
# ---------------------------------------------------------------------------
[[set]]
identifier = "appearance"
description = "Read and write which face Jarvis wears and how each state looks. Cosmetic; approves nothing."
permissions = ["allow-get-appearance", "allow-set-appearance"]

# Reading it, and nothing else. The widget wears the owner's face (it used to
# fall back to the default face because its capability had no appearance
# permission at all), and Settings says whether the face and colours are
# shared with the phone. Neither may change them: that is the Faces window.
[[set]]
identifier = "appearance-read"
description = "Read which face Jarvis wears and whether that choice is shared with the phone. Cosmetic and read-only."
permissions = ["allow-get-appearance"]

# The sun, the moon and the weather, read only: the Widget and the floating
# face keep what their face frame draws (the position rounded to 0.1 degree,
# the weather as five numbers) in this computer's localStorage. Neither may
# change anything: that is Settings.
[[set]]
identifier = "sky-read"
description = "Read whether the sun and moon show behind the animal, the rough position and the weather now. Cosmetic and read-only."
permissions = ["allow-get-sky"]

# Settings' "Open Faces" button. Opens a window; changes nothing by itself.
[[set]]
identifier = "faces-open"
description = "Open the Faces window."
permissions = ["allow-open-faces"]

# ---------------------------------------------------------------------------
# The first-run walkthrough: closes itself, and nothing else.
#
# It does not read `onboarding_seen` — `lib.rs` decides whether to build this
# window at all from that flag, before the page exists. The one thing the page
# itself can do is say "seen" and close, once, so it never reopens.
# ---------------------------------------------------------------------------
[[set]]
identifier = "onboarding-surface"
description = "Mark the first-run walkthrough as seen and close it. Opens at most once."
permissions = ["allow-finish-onboarding"]
