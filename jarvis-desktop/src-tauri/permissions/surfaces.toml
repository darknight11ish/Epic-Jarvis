# Which window may call what.
#
# Each set below is granted by exactly one capability file, so a command is
# reachable only from the surface that has a reason to call it. The grouping is
# derived from what each page actually invokes, not from what seemed plausible.

# ---------------------------------------------------------------------------
# Every Jarvis-authored window reads the one event stream. Answering a gate is
# split out below: the whole point of the fan-out is that the surfaces that do
# render approvals answer through the same command rather than each holding
# their own logic — but a window with no approval UI has no business holding it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "jarvis-link"
description = "Read the fanned-out event stream and the local service health. Read-only."
permissions = [
  "allow-get-link-state",
  "allow-get-pending-approvals",
  "allow-refresh-link",
  "allow-check-server-health",
  # Reading the theme is not privileged and every window needs it on load, or
  # it paints the wrong palette until something tells it otherwise.
  "allow-get-theme",
  "allow-get-theme-prefs",
  # The owner's face and state colours, read from memory - never the network,
  # never a broadcast. Cosmetic: the accent and state dots follow them
  # (jarvis-link.js followAppearance), and the widget's live face wears them.
  "allow-appearance-snapshot",
  "allow-appearance-colours",
]

# Choosing the theme. Two windows offer a picker — settings and the Brain — and
# `set_theme` fans the choice out to all four surfaces, so a third window
# holding this grant would gain nothing and widen the surface for no reason.
[[set]]
identifier = "theme-write"
description = "Change the theme for every window."
permissions = ["allow-set-theme", "allow-set-theme-follow-system"]

# Answering a gate is a decision with consequences, so it is separate from
# reading the stream. The quickbar and the widget both render approvals and
# both get it; the settings window reads the link state to show a connection
# dot and has no approval UI, so it does not.
[[set]]
identifier = "approvals"
description = "Answer a pending approval gate, or annotate one without answering it."
permissions = [
  "allow-decide-approval",
  # A note attached to a proposal before it is decided. It approves nothing,
  # so it rides with the windows that already render the gate rather than
  # earning a set of its own.
  "allow-amend-approval",
]

# Pause, resume or stop the turn Jarvis is running right now, and annotate it.
# Granted to the two windows that actually draw those controls - the quickbar
# and the widget - and to nothing else, the same reasoning `approvals` above
# gives for withholding itself from the settings window.
#
# Separate from `approvals` because it is a different question: `approvals`
# answers a gate Jarvis is waiting on, this interrupts work already running.
# A window could plausibly want one and not the other.
[[set]]
identifier = "task-control"
description = "Pause, resume, stop or annotate the running turn."
permissions = [
  "allow-pause-task",
  "allow-resume-task",
  "allow-stop-task",
  "allow-inject-task-note",
]

# Real microphone capture and the spoken reply - see src-tauri/src/voice.rs's
# own module docstring for why this is granted to the quickbar and NOT to the
# hud window, which loads a vendored page with no app commands at all.
# Push-to-talk only: nothing here can start listening on its own, and
# `cancel_voice_capture` exists specifically so releasing the control early
# can throw the clip away rather than only ever being able to send it.
[[set]]
identifier = "voice"
description = "Record the microphone on push-to-talk, and play back a spoken reply."
permissions = [
  "allow-start-voice-capture",
  "allow-stop-voice-capture",
  "allow-cancel-voice-capture",
  "allow-start-automatic-listening",
  "allow-stop-automatic-listening",
  "allow-speak-reply",
  # Interrupting by talking (voice_flow.rs): ask for one utterance the
  # listener already heard to be checked by the PC as "stop or not" - never
  # transcribed, sent only to this PC's Jarvis. Records nothing itself.
  "allow-judge-barge-in",
  # The `flow` block of /api/voice/status (a read), and the "One moment."
  # clip (GET /api/voice/moment).
  "allow-get-voice-flow",
  "allow-get-voice-moment",
]

# The HUD's mic button, and nothing else. The HUD loads a page vendored from
# the backend, so it holds no recording command: this only shows the
# quickbar with its mic button focused (voice.rs, `summon_push_to_talk`). The
# microphone opens only when the owner holds that button - the `voice` set
# above, which stays with the quickbar alone.
[[set]]
identifier = "hud-voice"
description = "Show the quickbar with push-to-talk ready. Opens no microphone and records nothing."
permissions = [
  "allow-summon-push-to-talk",
]

# The daily brief and the interruption budget. Granted to the quickbar alone,
# because that is the only window that renders the panel — the HUD loads the
# backend's own page and the widget is 320px wide.
#
# `mark_digest_seen` and `set_attention_muted` are writes, but neither can
# approve anything: marking read stamps a delivery time, and muting has a fixed
# end at midnight. There is deliberately no bulk-decide route in the API to
# grant even if a window asked for one.
[[set]]
identifier = "attention-surface"
description = "Read the daily brief, mark it read, and mute spoken interruptions until tomorrow. Approves nothing."
permissions = [
  "allow-get-digest",
  "allow-mark-digest-seen",
  "allow-set-attention-muted",
]

# ---------------------------------------------------------------------------
# One command, on its own: opening a link in the real OS browser rather than
# inside the WebView. Narrow on purpose, same reasoning `allow-get-hotkeys`
# already gets by living in both quickbar-surface and settings-surface below
# - a window that only needs to open a link should not have to take on the
# rest of quickbar-surface's grants (streaming, clipboard, its own geometry)
# just to get it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "external-links"
description = "Open a link in the real OS browser, never inside the WebView."
permissions = [
  "allow-open-external-url",
]

# ---------------------------------------------------------------------------
# The spotlight. Streaming, its own geometry, the clipboard, and the shell-free
# external link opener.
# ---------------------------------------------------------------------------
[[set]]
identifier = "quickbar-surface"
description = "Everything the spotlight quickbar calls: streaming, its own window geometry, clipboard and external links."
permissions = [
  # READ-ONLY. The spotlight's primer prints the global combinations, and they
  # are configurable now — so it has to read them rather than hardcode them, or
  # it goes back to naming keys that do not do what it says. `set_hotkeys` and
  # `reset_hotkeys` stay with the settings window.
  "allow-get-hotkeys",
  "allow-stream-chat",
  "allow-cancel-chat",
  # Before a screen capture is sent: does the local model see pictures?
  # Reads the model's name from Jarvis and its abilities from loopback
  # Ollama. Sends nothing about the picture (vision.rs).
  "allow-local-model-vision",
  "allow-set-route-lane",
  "allow-hide-quickbar",
  "allow-resize-quickbar",
  "allow-set-quickbar-pinned",
  "allow-write-clipboard",
  "allow-open-external-url",
  # The right/wrong mark on the answer on screen - one answer, one mark.
  # Changes no memory by itself; see commands.rs mark_answer.
  "allow-mark-answer",
  # `#log` / `#joplin` / `#obs` / Alt+Shift+N: the quickbar files the owner's own
  # words straight to /api/notes/capture instead of asking a model to, and
  # reports how it ended. The write itself still goes through the gate.
  "allow-capture-note",
  "allow-capture-note-status",
  # Which of those note apps this PC is set up for: names only.
  "allow-note-targets",
]

# ---------------------------------------------------------------------------
# The desktop widget: its own geometry, its preferences, and quick capture.
# `prefill_quickbar` is here because the widget's capture row hands a note to
# the spotlight; the quickbar itself never calls it.
# ---------------------------------------------------------------------------
[[set]]
identifier = "widget-surface"
description = "Widget geometry, pinning, saved position and quick capture."
permissions = [
  # Hiding its own window. The keyboard's only way out of a `skipTaskbar`,
  # undecorated window once `toggle_widget` has focused it.
  "allow-hide-widget",
  "allow-resize-desktop-widget",
  "allow-set-widget-always-on-top",
  "allow-save-widget-position",
  "allow-get-widget-prefs",
  "allow-prefill-quickbar",
  "allow-capture-note",
  # How that note ended - the server's answer, never the model's account.
  "allow-capture-note-status",
  # Which of those note apps this PC is set up for: names only.
  "allow-note-targets",
]

# ---------------------------------------------------------------------------
# The settings window, and ONLY the settings window.
#
# This set is the reason the whole file exists. `set_supervision` persists an
# arbitrary program path and `start_backend` runs it, so together they are
# code execution as the user that survives a restart — and `set_api_settings`
# redirects the base URL that every token-bearing request is built from, by
# reqwest rather than the webview, so neither the CSP nor a proxy sees where it
# goes. Reachable from one window that exists only when the user opened it,
# rather than from all four.
# ---------------------------------------------------------------------------
[[set]]
identifier = "settings-surface"
description = "Read and write the connection settings, backend supervision, the log location and whether Jarvis starts with Windows. Privileged: keep this to the settings window."
permissions = [
  # The global accelerators. A write, and a privileged-feeling one — it binds
  # keys machine-wide — so it sits with the other settings-only powers rather
  # than with the read-only sets. `hotkeys.rs` refuses a binding with no
  # modifier, which is the only shape that could not be undone from inside the
  # app afterwards.
  "allow-get-hotkeys",
  "allow-set-hotkeys",
  "allow-reset-hotkeys",
  # Updates. `install_update` replaces the running executable, which is the
  # largest single thing this app can do to the machine — so it lives here,
  # behind the window a person has to open deliberately, and it is a separate
  # command from the check rather than a flag on it. Nothing else in the build
  # can reach it, and no timer calls it.
  "allow-update-status",
  "allow-check-for-update",
  "allow-set-update-check-on-start",
  "allow-install-update",
  # Restart is the second half of installing one: without it the new binary
  # is on disk and the running process is still the old one.
  "allow-restart-app",
  "allow-get-api-settings",
  "allow-set-api-settings",
  # "Show the token for my phone": returns the pairing token to this one
  # page, on a click, so the owner can type it into the phone. Here and
  # nowhere else - the other windows never need to see it.
  "allow-reveal-pairing-token",
  # "Second graphics card": what was found, and one switch at a time. Turning
  # a switch ON starts a second copy of Ollama once its approval card is
  # approved, so it sits with the other settings-only powers. It approves
  # nothing itself - ON only raises the card - and there is no form that
  # sends more than one switch.
  # "What this backend supports": the capability names GET /api/version
  # reports, the list the phone shows under "This backend". A read, names
  # only - what a capability carries (power's mode, say) is not passed on.
  "allow-get-backend-capabilities",
  "allow-get-second-card",
  "allow-set-second-card",
  # "Big model (slow)": what was found (colibri, Python, memory, the models
  # and their drives) and one switch at a time. Turning a switch ON lets
  # Jarvis start colibri on this PC for background jobs once its approval
  # card is approved, so it sits with the other settings-only powers. It
  # approves nothing itself - ON only raises the card, and is held while the
  # event stream is stale - and there is no form that sends more than one
  # switch.
  "allow-get-big-model",
  "allow-set-big-model",
  # "Voice": what the PC says about listening to the owner - whether each
  # microphone's voice print is trained, which voice check is installed, the
  # wake word, the stop word and Smart Turn (GET /api/voice/status). A read:
  # it records nothing and changes nothing. Training stays on the phone.
  "allow-get-voice-status",
  # The PC's "hey Jarvis" switch, one direction at a time. OFF is immediate
  # and never held - it only narrows what listens. ON approves nothing: the
  # server raises ONE approval card (change_own_config), and ON is held
  # while the event stream is stale.
  "allow-set-wake-word",
  # Voice training on this PC, the voice-check settings, the guided test and
  # custom voices (voice_training.rs). Recording opens the microphone, so it
  # sits here with the other settings-only powers and nowhere else; the
  # recordings are held in the app's memory, never in the page, never on
  # disk, and sent only to this Jarvis. Everything that widens who Jarvis
  # obeys, what it reads aloud or how it speaks only raises ONE approval
  # card (and is held while the event stream is stale): finishing a
  # training, loosening a setting, adding a voice, switching to one, the
  # better voice ON. Tightening, cancelling, going back to the built-in
  # voice, deleting a voice and the better voice OFF are immediate.
  "allow-start-voice-sample",
  "allow-voice-sample-level",
  "allow-stop-voice-sample",
  "allow-cancel-voice-sample",
  "allow-discard-voice-samples",
  "allow-send-voice-training",
  "allow-cancel-voice-training",
  "allow-measure-voice",
  "allow-set-voice-setting",
  "allow-check-voice-with-someone-else",
  "allow-propose-voice-threshold",
  "allow-get-custom-voices",
  "allow-create-custom-voice",
  "allow-set-active-voice",
  "allow-delete-custom-voice",
  "allow-set-better-voice",
  "allow-supervisor-status",
  "allow-set-supervision",
  "allow-start-backend",
  "allow-stop-backend",
  # Diagnostics. `get_log_info` returns paths and sizes, never contents - the
  # log is plain text with no redaction pass and must not become readable by a
  # page just because the page can ask where it is. `open_log_folder` hands a
  # directory to Explorer and takes no argument at all, so there is nothing a
  # caller can point it at.
  "allow-get-log-info",
  "allow-open-log-folder",
  # Starting with Windows. A registry write under HKEY_CURRENT_USER\...\Run,
  # which is a thing that survives uninstalling carelessly, so it belongs with
  # the other settings-only powers rather than anywhere a chat page can reach.
  "allow-get-autostart",
  "allow-set-autostart",
  # "Security": the app lock, Windows Hello for approvals and for private
  # answers (lock.rs). Here and nowhere else, because lowering one is the
  # power to switch a lock off. The command itself asks Windows Hello before
  # anything is loosened, so even this window cannot lower one silently.
  "allow-get-security-settings",
  "allow-set-security-settings",
]

# ---------------------------------------------------------------------------
# The Brain window, and only the Brain window.
#
# Split into three sets rather than one, because reading what Jarvis knows,
# putting a file back, and replacing the model that answers every question are
# three different powers. A capability file can grant the first without the
# third, which is the whole reason the ACL exists.
# ---------------------------------------------------------------------------

# One fan-out read over a fixed allowlist in brain.rs. The window names
# sections, never URLs, so this grant cannot reach an endpoint that file did
# not decide it may reach — and a unit test asserts every entry in that list is
# a GET that changes nothing.
[[set]]
identifier = "brain-read"
description = "Read the memory graph, models, compute, skills, jobs, the undo shelf, the ledger, content risk and the watchlist. Read-only."
permissions = ["allow-brain-read"]

# Reverting and cancelling. Every one of these moves toward a state the owner
# already had, or stops something that has not finished — which is why they sit
# together and apart from the set below.
[[set]]
identifier = "brain-act"
description = "Revert an undo entry, cancel a Long Fuse job, stop a message inside its send window, and manage the GitHub watchlist."
permissions = [
  "allow-brain-revert-undo",
  "allow-brain-cancel-job",
  "allow-brain-cancel-hold",
  "allow-brain-watch-add",
  "allow-brain-watch-remove",
  "allow-brain-watch-seen",
]

# Changing what Jarvis is made of. Removing a skill takes an ability away for
# good, and switching a model replaces the weights that answer every question
# the owner asks. Neither is undoable from the same screen that did it —
# rollback exists for models, but nothing reinstalls a removed skill, because
# installing runs the scanner and the gate and there is deliberately no route
# that skips them.
[[set]]
identifier = "brain-faculties"
description = "Remove a skill; install, switch or roll back a model. Privileged: keep this to the Brain window."
permissions = ["allow-brain-remove-skill", "allow-brain-model"]

# Changing what Jarvis remembers about the owner.
#
# Its own set rather than part of `brain-act`, because that set is explicitly
# the things that "move toward a state the owner already had" and forgetting is
# the exact opposite: the server retires rather than deletes, so the row
# survives, but nothing in the product brings a retired fact back. Editing is
# gentler - it supersedes, and can be corrected again - but it lives here too,
# since both decide what the model is told about a person.
#
# The learning switch is in the same set on purpose. Turning the extractor on
# is the power to have facts proposed about you at all, which is upstream of
# every other item here.
[[set]]
identifier = "brain-memory"
description = "Keep or discard a proposed fact, reword one, stop one being recalled, erase the words of one for good, export the store, read what Jarvis believed at a past moment, turn the background learner on or off, and list what it saved automatically and turn its two automatic-learning switches on (an approval card) or off. One fact per decision; there is no bulk form."
permissions = [
  "allow-brain-memory-decide",
  "allow-brain-memory-forget",
  # "Erase the words" (the owner's decision, 2026-09-24): ONE fact's words
  # wiped for good, its dates kept. Stricter than forget, never looser:
  # held on a stale link, one id per call, asked about first.
  "allow-brain-memory-erase",
  "allow-brain-memory-edit",
  "allow-brain-memory-learning",
  "allow-brain-memory-export",
  "allow-brain-memory-as-of",
  "allow-brain-memory-sleep-time",
  # "Both are true": one proposal, one decision, like decide above.
  "allow-brain-memory-keep-both",
  # Automatic learning (JARVIS-API.md section 19; brain/auto_learn.rs): the
  # switches' state (GET /api/memory/learning, a read); the "Saved
  # automatically" list - a read, held back like the other memory lists
  # while "Windows Hello for memory lists and chat history" hides them; and
  # its two switches, ONE setting per call. ON only raises an approval card
  # (tier `ask`) and is held while the event stream is stale; OFF is
  # immediate. Forgetting one of them is brain_memory_forget above.
  "allow-brain-memory-learning-status",
  "allow-brain-memory-auto-list",
  "allow-brain-memory-learning-auto",
  "allow-brain-memory-learning-sensitive",
  # The ids of facts saved automatically that the owner has not looked at
  # yet, counted in Rust because the Brain is destroyed when it is closed
  # (brain/auto_learn.rs note_saved). Ids only, never a fact's words; it
  # changes nothing but that count.
  "allow-brain-memory-saved-unseen",
]

# Chat history on the PC (JARVIS-API.md section 18; brain/history.rs).
# Listing and opening a conversation are reads - and both are held back
# while "Windows Hello for private answers" hides the Brain's lists. Delete
# is ONE conversation per call; there is no "delete all" anywhere. The switch
# is ONE setting per call: ON only raises an approval card (tier `ask`) and
# is held while the event stream is stale, OFF is immediate.
[[set]]
identifier = "brain-history"
description = "List and read the chat history kept on the PC, delete one conversation, and change its two settings (turning it on only raises an approval card). No bulk delete."
permissions = [
  "allow-brain-history-list",
  "allow-brain-history-open",
  "allow-brain-history-delete",
  "allow-brain-history-settings",
]

# Show, on the Brain's memory lists while "Windows Hello for private
# answers" is on (lock.rs). It asks Windows Hello and, when the owner
# confirms, lets brain_read return the entries until they have been away
# longer than "Lock again after". It changes no setting and no memory.
[[set]]
identifier = "private-reveal"
description = "Show the Brain's hidden memory lists, after Windows Hello confirms it is the owner. Changes nothing."
permissions = ["allow-reveal-private-answers"]

# The wiki builder (backend/wiki.patch). Reading the list of documents and
# following one job are reads; "Add to wiki" only raises ONE approval card
# (wiki_update) - the backend writes nothing until it is answered, and the
# command is held while the event stream is stale. Opening the folder opens
# only a folder called "Jarvis Wiki" on this PC, named by the backend.
[[set]]
identifier = "brain-wiki"
description = "Read the wiki builder's documents, add one document to the wiki (which raises one approval card), follow that, and open the Jarvis Wiki folder."
permissions = [
  "allow-wiki-status",
  "allow-wiki-ingest",
  "allow-wiki-ingest-status",
  "allow-wiki-open-folder",
]

# Deep questions (backend/big-model.patch): the big model answers one
# question in the background, with no tools, no internet and no memory of
# other conversations. Reading the list is a read. Asking raises no card - the
# owner approved the "Deep questions" switch in Settings with one - because a
# question acts on nothing and nothing leaves the PC; it is still held while
# the event stream is stale (rule 4). Nothing here can turn the big model on:
# that is `get_big_model` / `set_big_model`, in settings-surface.
[[set]]
identifier = "brain-deep"
description = "Read the deep questions and their answers, and ask one (no card per question; the switch was approved in Settings). Cannot turn the big model on or off."
permissions = [
  "allow-get-deep",
  "allow-ask-deep",
]

# ---------------------------------------------------------------------------
# The faces window: read and write the appearance document.
#
# This is the one thing that window persists, and it is shared rather than
# local — the server holds it so the phone sees the same choice. It changes how
# Jarvis LOOKS and nothing else: it cannot approve anything, start anything, or
# reach the connection settings.
# ---------------------------------------------------------------------------
[[set]]
identifier = "appearance"
description = "Read and write which face Jarvis wears and how each state looks. Cosmetic; approves nothing."
permissions = ["allow-get-appearance", "allow-set-appearance"]

# Reading it, and nothing else. The widget wears the owner's face (it used to
# fall back to the default face because its capability had no appearance
# permission at all), and Settings says whether the face and colours are
# shared with the phone. Neither may change them: that is the Faces window.
[[set]]
identifier = "appearance-read"
description = "Read which face Jarvis wears and whether that choice is shared with the phone. Cosmetic and read-only."
permissions = ["allow-get-appearance"]

# Settings' "Open Faces" button. Opens a window; changes nothing by itself.
[[set]]
identifier = "faces-open"
description = "Open the Faces window."
permissions = ["allow-open-faces"]

# ---------------------------------------------------------------------------
# The first-run walkthrough: closes itself, and nothing else.
#
# It does not read `onboarding_seen` — `lib.rs` decides whether to build this
# window at all from that flag, before the page exists. The one thing the page
# itself can do is say "seen" and close, once, so it never reopens.
# ---------------------------------------------------------------------------
[[set]]
identifier = "onboarding-surface"
description = "Mark the first-run walkthrough as seen and close it. Opens at most once."
permissions = ["allow-finish-onboarding"]
