<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>bar probe</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a1119; overflow: hidden; }
  /* The bar's own slot, as style.css sizes it. */
  .reactor { width: 40px; height: 40px; display: grid; place-items: center; }
  #reactor-face { width: 100%; height: 100%; border: 0; background: transparent; pointer-events: none; }
</style>
</head>
<body>
<div class="reactor" id="reactor" aria-hidden="true">
  <iframe id="reactor-face" title="" tabindex="-1" aria-hidden="true"
          src="faces.html?mode=display&feed=parent"></iframe>
</div>
<script>
  window.__sent = [];
  window.__ready = false;
  const frame = document.getElementById("reactor-face");
  function send(message) {
    window.__sent.push(message);
    frame.contentWindow.postMessage(message, location.origin);
  }
  frame.addEventListener("load", () => {
    setTimeout(() => { window.__ready = true; }, 2200);
  });
  window.__send = send;
</script>
</body>
</html>
