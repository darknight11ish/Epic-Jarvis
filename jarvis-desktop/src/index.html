<!DOCTYPE html>
<html lang="en" data-state="idle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis</title>
    <!--
      Theme before first paint. Synchronous from localStorage rather than
      waiting for the IPC round trip, because a window that paints deep-space
      and flips to paper 80ms later is worse than one that paints the right
      thing immediately. The store stays the source of truth and the script
      below reconciles against it.

      The allowlist is here and not only in applyTheme: a stale or hand-edited
      value would otherwise paint an unmatched [data-theme] and then flip,
      which is exactly the flash this exists to prevent.
    -->
    <script>
      try {
        var t = localStorage.getItem("jarvis.theme");
        if (["deep-space", "ember", "paper", "high-contrast"].indexOf(t) >= 0) {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* private mode, cleared site data - the default theme is correct */
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      The whole UI lives inside `#shell`. The window itself is 750x80 and
      transparent; the shell is what you actually see, and main.js measures it
      to drive the native window resize as the answer card grows.
    -->
    <!-- aria-live belongs on the region that changes, not on the whole UI.
         It used to be here, so a screen reader re-announced the textarea, the
         chips and the entire answer on every streamed repaint. -->
    <main id="shell" class="shell">
      <!-- ── Input row ─────────────────────────────────────────────────── -->
      <div class="bar" id="bar" data-tauri-drag-region>
        <div class="reactor" id="reactor" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="presentation" focusable="false">
            <defs>
              <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="var(--accent-bright)" stop-opacity="1" />
                <stop offset="55%" stop-color="var(--accent)" stop-opacity="0.55" />
                <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
              </radialGradient>
            </defs>
            <circle class="reactor-halo" cx="24" cy="24" r="17" fill="url(#core-glow)" />
            <circle class="reactor-ring reactor-ring-outer" cx="24" cy="24" r="16" />
            <circle class="reactor-ring reactor-ring-mid" cx="24" cy="24" r="11" />
            <g class="reactor-vanes">
              <line x1="24" y1="8" x2="24" y2="14" />
              <line x1="40" y1="24" x2="34" y2="24" />
              <line x1="24" y1="40" x2="24" y2="34" />
              <line x1="8" y1="24" x2="14" y2="24" />
              <line x1="35.3" y1="12.7" x2="31.1" y2="16.9" />
              <line x1="35.3" y1="35.3" x2="31.1" y2="31.1" />
              <line x1="12.7" y1="35.3" x2="16.9" y2="31.1" />
              <line x1="12.7" y1="12.7" x2="16.9" y2="16.9" />
            </g>
            <circle class="reactor-core" cx="24" cy="24" r="5" />
          </svg>
        </div>

        <span class="note-chip" id="note-chip" data-target="" hidden>
          <span class="note-chip-dot" aria-hidden="true"></span>
          <span id="note-chip-label">Logseq Journal</span>
        </span>

        <div class="field">
          <label class="sr-only" for="prompt">Ask Jarvis</label>
          <textarea
            id="prompt"
            class="prompt"
            rows="1"
            spellcheck="false"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            placeholder="Ask Jarvis anything…"
          ></textarea>
        </div>

        <div class="bar-meta">
          <span class="route" id="route" data-route="local" title="Active model route">
            <span class="route-dot" aria-hidden="true"></span>
            <span class="route-tier" id="route-tier">Local</span>
            <span class="route-sep" aria-hidden="true">/</span>
            <span class="route-model" id="route-model">qwen3:8b</span>
          </span>

          <button
            id="pin"
            class="icon-button"
            type="button"
            aria-pressed="false"
            title="Keep Jarvis open when it loses focus"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M6 1.5h4l-.6 3.2 2.1 2.1v1.4H8.7V14L8 15l-.7-1V8.2H4.5V6.8l2.1-2.1L6 1.5Z" />
            </svg>
            <span class="sr-only">Pin window</span>
          </button>

          <kbd class="hint" id="submit-hint">↵</kbd>
        </div>
      </div>

      <!-- ── Attachment strip (screen capture / clipboard ingest) ───────── -->
      <!-- Everything below the input row scrolls together, so the stack can
           never grow past the window's 720px clamp and hide the Approve and
           Deny buttons below the cut. -->
      <div class="stack" id="stack">
        <div class="attachments" id="attachments" hidden>
          <div class="attachment" id="attachment-capture" hidden>
            <img id="capture-thumb" alt="Desktop capture attached to the next prompt" />
            <div class="attachment-body">
              <span class="attachment-title">Screen capture</span>
              <span class="attachment-meta" id="capture-meta">—</span>
            </div>
            <button class="icon-button" type="button" id="capture-remove" title="Remove capture">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M4 4l8 8M12 4l-8 8" />
              </svg>
              <span class="sr-only">Remove capture</span>
            </button>
          </div>

          <div class="attachment attachment-text" id="attachment-clipboard" hidden>
            <div class="attachment-body">
              <span class="attachment-title">Clipboard context</span>
              <span class="attachment-meta" id="clipboard-meta">—</span>
            </div>
            <button class="icon-button" type="button" id="clipboard-remove" title="Remove clipboard context">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M4 4l8 8M12 4l-8 8" />
              </svg>
              <span class="sr-only">Remove clipboard context</span>
            </button>
          </div>
        </div>

        <!-- ── Attention: the interruption budget and the daily brief ─────
             `pending` is what is waiting to be *told* to you, which is not the
             same as the approval queue below — that is what is waiting for a
             decision. The two counts are kept apart on purpose.

             There is no approve-all control in here, and there must never be
             one: approval rows carry `opens_card` and no detail, and clicking
             one opens its own gate. ────────────────────────────────────────── -->
        <section class="attention" id="attention" hidden aria-label="Waiting to be told">
          <header class="attention-head">
            <div class="attention-title">
              <strong id="attention-count">Nothing waiting</strong>
              <span class="attention-budget" id="attention-budget"></span>
            </div>
            <div class="attention-actions">
              <button class="text-button" type="button" id="attention-mute"></button>
              <button class="text-button" type="button" id="attention-close" title="Hide">
                Close
              </button>
            </div>
          </header>

          <!-- Rendered in the order the server sent. `jarvis_arbiter._rank`
               orders by consequence and never by urgency; re-sorting here would
               hand the ranking back to whoever wrote the text. -->
          <ol class="digest" id="digest"></ol>

          <footer class="attention-foot">
            <span class="attention-note" id="attention-note"></span>
            <button class="text-button" type="button" id="digest-seen">
              Mark the brief read
            </button>
          </footer>
        </section>

        <!-- Something is still waiting after Esc put it away. Not a decision
             surface — a way back to the card, so parking can never lose one. -->
        <div class="parked" id="parked" hidden>
        <!-- Announced through the shared region on transition, not by a live
             attribute here: this element is hidden when the message is
             written, which is exactly the pattern that stays silent. -->
          <span id="parked-text"></span>
          <button class="text-button" type="button" id="parked-show">Show it</button>
        </div>

        <!-- ── Approval gate ─────────────────────────────────────────────── -->
        <section
          class="approval"
          id="approval"
          hidden
          tabindex="-1"
          role="group"
          aria-labelledby="approval-kicker approval-action"
        >
          <!--
            `role="group"`, not `alertdialog`, and this is the honest markup
            rather than a downgrade.

            `alertdialog` tells a screen reader "a modal dialog is demanding a
            response", and readers are trained by that to expect Tab to be
            bounded and Esc to close. None of it is true here: there is no
            `aria-modal`, no focus trap, focus is deliberately NOT moved (a
            stray Enter used to approve), the rest of the page stays reachable,
            and Esc parks rather than dismisses. Claiming the role taught the
            wrong model of the one surface where the user's model matters most.

            The announcement it used to buy is now made explicitly through the
            shared live region, which says what the action is AND what it
            costs — more than the role ever conveyed. `aria-labelledby` also
            puts the action into the accessible name, which the old
            `aria-label="Approval required"` overrode.
          -->
          <header class="approval-head">
            <span class="approval-badge" aria-hidden="true">
              <svg viewBox="0 0 16 16" focusable="false">
                <path d="M8 1.6l5.6 2.2v3.6c0 3.3-2.3 6.2-5.6 7-3.3-.8-5.6-3.7-5.6-7V3.8L8 1.6Z" />
                <path d="M5.6 8.1l1.7 1.7 3.3-3.4" class="approval-tick" />
              </svg>
            </span>
            <div class="approval-title">
              <span class="approval-kicker" id="approval-kicker">Jarvis wants to</span>
              <strong id="approval-action">run an action</strong>
            </div>
            <!-- Which of how many. Answering one and having the next appear
                 instantly under the cursor, with no sense of how many are left,
                 is how a click lands on a card nobody read. -->
            <span class="approval-count" id="approval-count" hidden></span>
            <span class="approval-target" id="approval-target" hidden></span>
          </header>

          <!-- ── Why this is being asked at all ─────────────────────────
               Only rendered when the server sent `raised`: outside text tried
               to rush the reader and the tier went up because of it. The quote
               is the attacker's own words and showing them is the entire point;
               the context is text from the page being judged, so it stays behind
               a disclosure until asked for. There is deliberately no control
               here that clears the latch. ───────────────────────────────── -->
          <div class="raised" id="approval-raised" hidden>
            <div class="raised-head">
              <span class="raised-chip" id="raised-chip"></span>
              <span class="raised-source" id="raised-source"></span>
            </div>
            <blockquote class="raised-quote" id="raised-quote"></blockquote>
            <details class="raised-context" id="raised-context-wrap">
              <summary>Show the surrounding text</summary>
              <p class="raised-context-body" id="raised-context"></p>
            </details>
          </div>

          <div class="approval-preview markdown" id="approval-preview"></div>

          <footer class="approval-actions">
            <!-- No key hints on either button, and that is the fix rather than
                 an omission. `Esc` used to deny and `↵` used to approve; both
                 are gone, because the two most reflexive keys in a spotlight
                 overlay must not be wired to a decision. Esc now puts the gate
                 aside and the hint says so. Enter still works on whichever
                 button has focus, which is simply what a button does. -->
            <span class="approval-hint" id="approval-hint">Nothing runs until you decide.</span>
            <button class="approval-button approval-deny" type="button" id="approval-deny"
                  aria-describedby="approval-hint">
              Deny
            </button>
            <button class="approval-button approval-approve" type="button" id="approval-approve"
                  aria-describedby="approval-hint">
              Approve
            </button>
          </footer>
        </section>

        <!-- ── Answer card ───────────────────────────────────────────────── -->
        <section class="card" id="card" hidden>
          <header class="card-head">
            <span class="card-status" id="card-status">
              <span class="pulse" aria-hidden="true"></span>
              <span id="card-status-text">Thinking…</span>
            </span>
            <div class="card-actions">
              <span class="card-stat" id="card-stat" title="Tokens received / elapsed"></span>
              <button class="text-button" type="button" id="copy" title="Copy the answer">Copy</button>
              <button class="text-button" type="button" id="stop" title="Stop generating" hidden>Stop</button>
            </div>
          </header>

          <div class="card-body" id="card-body">
            <!--
              No `aria-live` here, deliberately. `paint()` reassigns this
              element's whole innerHTML, and `aria-relevant` defaults to
              `additions text` — so every repaint re-added the ENTIRE answer so
              far and queued it. A long reply left a screen reader minutes
              behind the screen, with no way to interrupt it into a coherent
              state. The stream is announced once when it starts and once when
              it finishes, through the shared region in jarvis-link.js.
            -->
            <article class="markdown" id="answer"></article>
            <div class="cursor" id="cursor" hidden aria-hidden="true"></div>
          </div>

          <footer class="card-foot">
            <span class="services" id="services" title="Local service health">
              <span class="service" data-service="jarvis"><i></i>Core</span>
              <span class="service" data-service="ollama"><i></i>Ollama</span>
              <span class="service" data-service="litellm"><i></i>LiteLLM</span>
            </span>
            <span class="keys">
              <kbd>Esc</kbd> dismiss
              <kbd>Alt</kbd>+<kbd>Space</kbd> summon
              <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> capture
              <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> note
            </span>
          </footer>
        </section>
      </div>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
