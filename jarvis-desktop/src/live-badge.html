<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Live</title>
    <!--
      The Jarvis Live badge (live.rs `show_badge`): always on top, at the top
      of the screen, while Jarvis Live is on on this PC - the "always-visible
      Live sign" of docs/LIVE-DESIGN.md. It shows fixed words and minutes
      only (the PC's jarvis_live.py), never anything anyone said, and its
      buttons: Mute or Unmute, Stop, Carry on and Resume Live. It never takes
      the keyboard from the program in front.
    -->
    <script>
      try {
        var t = localStorage.getItem("jarvis.theme");
        if (["deep-space", "paper", "high-contrast"].indexOf(t) >= 0) {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* the default theme is correct */
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.3 system-ui, "Segoe UI", sans-serif;
      }
      .badge {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-accent);
        background: var(--bg-window);
        color: var(--text);
        white-space: nowrap;
      }
      .dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bad);
      }
      .badge[data-quiet="true"] .dot {
        background: var(--text-faint);
      }
      .words {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        color: var(--text-muted);
        margin-left: 6px;
      }
      button {
        flex: none;
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }
      button[hidden] {
        display: none;
      }
      #stop {
        border-color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main class="badge" id="badge" data-tauri-drag-region aria-label="Jarvis Live">
      <span class="dot" aria-hidden="true" data-tauri-drag-region></span>
      <span class="words" data-tauri-drag-region>
        <strong id="title">Jarvis Live</strong><span class="detail" id="detail" role="status" aria-live="polite"></span>
      </span>
      <button id="carry-on" type="button" hidden>Carry on</button>
      <button id="resume" type="button" hidden>Resume Live</button>
      <button id="mute" type="button" hidden>Mute</button>
      <button id="stop" type="button" hidden>Stop</button>
    </main>
    <script type="module" src="live-badge.js"></script>
  </body>
</html>
