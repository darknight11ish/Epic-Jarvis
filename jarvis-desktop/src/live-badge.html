<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Live</title>
    <!--
      The Jarvis Live badge (live.rs `show_badge`): always on top, at the top
      of the screen, while Jarvis Live is on on this PC - the "always-visible
      Live sign" of docs/LIVE-DESIGN.md. It shows fixed words and minutes
      only (the PC's jarvis_live.py), never anything anyone said, and its
      buttons: Mic off / Mic on / Listen anyway, End Live, Carry on, Resume
      Live, 20 more minutes and Show the card. Two rows, so why Live is
      paused is never cut off (the review of 2026-09-28: 12 of 14 pause lines
      were), and the whole line is in `title` too. Clicking the words opens
      the Jarvis bar. It never takes the keyboard from the program in front.
      It follows the app's theme and text size.
    -->
    <script>
      try {
        var t = localStorage.getItem("jarvis.theme");
        if (["deep-space", "paper", "high-contrast"].indexOf(t) >= 0) {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* the default theme is correct */
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.3 system-ui, "Segoe UI", sans-serif;
      }
      .badge {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 4px;
        padding: 6px 10px 7px;
        border-radius: 14px;
        border: 1px solid var(--border-accent);
        background: var(--bg-window);
        color: var(--text);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--bad);
      }
      .badge[data-quiet="true"] .dot {
        background: var(--text-faint);
      }
      .words {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        flex: 1;
        min-width: 0;
        margin: 0 0 0 15px;
        color: var(--text-muted);
        /* Two lines at most, never cut mid-word without the full line in
           the title. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .detail:empty {
        display: none;
      }
      button {
        flex: none;
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button.words {
        border: 0;
        background: none;
        padding: 0;
        border-radius: 4px;
      }
      button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }
      button[hidden] {
        display: none;
      }
      #stop {
        border-color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main class="badge" id="badge" data-tauri-drag-region aria-label="Jarvis Live">
      <div class="row" data-tauri-drag-region>
        <span class="dot" aria-hidden="true" data-tauri-drag-region></span>
        <button class="words" id="words" type="button" title="Open the Jarvis bar"><strong id="title">Jarvis Live</strong></button>
        <button id="mute" type="button" hidden>Mic off</button>
        <button id="stop" type="button" hidden>End Live</button>
      </div>
      <div class="row" id="second" data-tauri-drag-region>
        <p class="detail" id="detail" role="status" aria-live="polite"></p>
        <button id="show-card" type="button" hidden>Show the card</button>
        <button id="carry-on" type="button" hidden>Carry on</button>
        <button id="resume" type="button" hidden>Resume Live</button>
        <button id="more" type="button" hidden>20 more minutes</button>
      </div>
    </main>
    <script type="module" src="live-badge.js"></script>
  </body>
</html>
