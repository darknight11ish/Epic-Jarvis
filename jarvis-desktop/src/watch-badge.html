<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis is watching</title>
    <!--
      The Watch with me badge (look.rs `show_badge`): always on top, at the
      top of the screen, while Jarvis is watching the screen on this PC - the
      "always-visible sign" of docs/SCREEN-DESIGN.md section 2. It shows fixed
      words and minutes only (the PC's jarvis_screen.py: "Jarvis is watching
      - 24 min left", "Paused: a password box"), never a program, a site, a
      title or a word from the screen, and two buttons: Stop watching and 20
      more minutes (near the end). It is hidden from screen captures, so it
      never shows up in Jarvis's own pictures of the screen. It never takes
      the keyboard from the program in front, and follows the app's theme and
      text size.
    -->
    <script>
      try {
        var t = localStorage.getItem("jarvis.theme");
        if (["deep-space", "paper", "high-contrast"].indexOf(t) >= 0) {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* the default theme is correct */
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font: 13px/1.3 system-ui, "Segoe UI", sans-serif;
      }
      .badge {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 4px;
        padding: 6px 10px 7px;
        border-radius: 14px;
        border: 1px solid var(--border-accent);
        background: var(--bg-window);
        color: var(--text);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .dot {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
      }
      .badge[data-tone="paused"] .dot,
      .badge[data-tone="ended"] .dot {
        background: var(--text-faint);
      }
      .words {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 0;
        color: inherit;
        font: inherit;
        text-align: left;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        flex: 1;
        min-width: 0;
        margin: 0 0 0 15px;
        color: var(--text-muted);
        /* Two lines at most, never cut mid-word without the full line in
           the title. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .detail:empty {
        display: none;
      }
      button {
        flex: none;
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 2px 10px;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }
      button[hidden] {
        display: none;
      }
      #stop {
        border-color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main class="badge" id="badge" data-tauri-drag-region aria-label="Jarvis is watching">
      <div class="row" data-tauri-drag-region>
        <span class="dot" aria-hidden="true" data-tauri-drag-region></span>
        <strong class="words" id="title" data-tauri-drag-region>Jarvis is watching</strong>
        <button id="more" type="button" hidden>20 more minutes</button>
        <button id="stop" type="button" hidden>Stop watching</button>
      </div>
      <div class="row" id="second" data-tauri-drag-region>
        <p class="detail" id="detail" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="watch-badge.js"></script>
  </body>
</html>
