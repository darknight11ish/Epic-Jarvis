<!DOCTYPE html>
<html lang="en" data-state="collapsed">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Widget</title>
    <!--
      Theme before first paint. Synchronous from localStorage rather than
      waiting for the IPC round trip, because a window that paints deep-space
      and flips to paper 80ms later is worse than one that paints the right
      thing immediately. The store stays the source of truth and the script
      below reconciles against it.

      The allowlist is here and not only in applyTheme: a stale or hand-edited
      value would otherwise paint an unmatched [data-theme] and then flip,
      which is exactly the flash this exists to prevent.
    -->
    <script>
      try {
        var t = localStorage.getItem("jarvis.theme");
        if (["deep-space", "ember", "paper", "high-contrast"].indexOf(t) >= 0) {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {
        /* private mode, cleared site data - the default theme is correct */
      }
    </script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <!--
      The native window is 320px wide and transparent; this shell is the whole
      visible surface. widget.js measures it and asks the backend to match, so
      the frame always hugs the content exactly.
    -->
    <div id="widget-shell" class="widget-shell">
      <!-- The window had no heading, so its heading list was empty and there
           was nothing to tell a screen reader which of the four Jarvis windows
           it had landed in. -->
      <h1 class="sr-only">Jarvis widget</h1>
      <!-- ── Compact bar: always visible, doubles as the drag handle ────── -->
      <header class="widget-bar" data-tauri-drag-region>
        <div class="status-indicator" data-tauri-drag-region>
          <span class="dot" id="net-dot" title="Core connection"></span>
          <span class="val mono" id="gpu-temp-compact" title="GPU temperature">--°</span>
        </div>

        <div class="route-pill mono" id="route-pill" title="Active model route">LOCAL</div>

        <div class="quick-actions">
          <button class="icon-btn" id="btn-quick-log" title="Capture to the Logseq journal — press N for the field">
            #log
          </button>
          <button class="icon-btn" id="btn-quick-joplin" title="Capture to the Joplin vault">
            #jop
          </button>
          <button
            class="icon-btn pin-btn"
            id="btn-pin"
            aria-pressed="true"
            title="Floating above other windows"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M6 1.5h4l-.6 3.2 2.1 2.1v1.4H8.7V14L8 15l-.7-1V8.2H4.5V6.8l2.1-2.1L6 1.5Z" />
            </svg>
            <span class="sr-only">Toggle always on top</span>
          </button>
          <button class="icon-btn toggle-btn" id="btn-toggle-expand" title="Expand (E)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
            <span class="sr-only">Expand widget</span>
          </button>
        </div>
      </header>

      <!-- ── Expanded tray: telemetry, gates, capture ───────────────────── -->
      <main class="widget-tray" id="widget-tray" hidden>
        <!-- Jarvis's live face — the same renderer as the Faces window, in
             "display mode" (no editor, no grid, just the owner's chosen face
             reacting to whatever Jarvis is actually doing). widget.js sets
             `src` only while expanded, so the animation loop isn't spending
             GPU on a face nobody can see. -->
        <!-- Hidden, not just covered, while an approval card is open - see
             widget.js's applyFaceVisibility(). src-tauri/src/windows.rs's
             WIDGET_MAX_HEIGHT (400px) is calibrated for "the tallest
             legitimate layout", and this is the single biggest, most
             purely decorative thing on screen: freeing its height is what
             keeps Approve reachable rather than clipped past the window's
             real, hard ceiling. -->
        <div class="face-wrap" id="face-wrap">
          <iframe
            id="face-frame"
            title="Jarvis"
            tabindex="-1"
            aria-hidden="true"
          ></iframe>
        </div>

        <!-- The widget's way out of an offline state. The dot in the compact
             bar reports it but sits inside the drag region, where a click is a
             drag; this row is the action, in the half of the window that has
             room for a sentence. -->
        <div class="widget-offline" id="widget-offline" hidden>
          <span id="widget-offline-text">Jarvis is not answering.</span>
          <button class="btn btn-quiet" type="button" id="widget-offline-retry">Reconnect</button>
        </div>

        <!-- What Jarvis is doing right now, one bounded step at a time -
             docs/AUTONOMY-PROPOSALS.md §3c. `announce()` already fires this
             text on the backend today; this is the first place on the
             desktop that shows it, rather than only the coarse "thinking"
             face. Empty and hidden whenever there is nothing to say. -->
        <p class="widget-progress" id="widget-progress" hidden></p>

        <section class="telemetry-grid">
          <div class="meter" id="meter-vram">
            <div class="meter-head">
              <span class="label">VRAM</span>
              <span class="val mono" id="vram-val">-- / -- GB</span>
            </div>
            <div class="meter-track"><i id="vram-bar" style="transform: scaleX(0)"></i></div>
          </div>

          <div class="meter" id="meter-cpu">
            <div class="meter-head">
              <span class="label">CPU</span>
              <span class="val mono" id="cpu-val">--%</span>
            </div>
            <div class="meter-track"><i id="cpu-bar" style="transform: scaleX(0)"></i></div>
          </div>

          <div class="meter" id="meter-gpu">
            <div class="meter-head">
              <span class="label">GPU</span>
              <span class="val mono" id="gpu-val">--% · --°</span>
            </div>
            <div class="meter-track"><i id="gpu-bar" style="transform: scaleX(0)"></i></div>
          </div>
        </section>

        <!-- Pending autonomy gate -->
        <section
          class="approval-card"
          id="approval-card"
          hidden
          role="group"
          aria-labelledby="appr-action"
        >
          <!-- Same reasoning as the quickbar: no modality, no focus trap, so
               no `alertdialog`. Announced through the shared live region
               instead, which also fixes writing to a hidden region. -->
          <div class="approval-header">
            <span class="warn-badge">APPROVAL REQUIRED</span>
            <span class="action-name mono" id="appr-action">--</span>
          </div>
          <!-- Outside text tried to rush the reader and the tier went up.
               The chip and the quote; the surrounding context stays on the
               quickbar's card, because this window is 320px wide and a
               disclosure nobody can read is worse than a pointer to the one
               that can. Never a control that clears the latch. -->
          <div class="appr-raised" id="appr-raised" hidden>
            <span class="appr-raised-chip" id="appr-raised-chip"></span>
            <span class="appr-raised-quote" id="appr-raised-quote"></span>
          </div>
          <p class="appr-detail" id="appr-detail">--</p>
          <!-- What getting the answer wrong costs. `risk` is derived by the
               gate at read time and is the only thing that tells send_email
               apart from switch_model, which are both tier `ask`. -->
          <p class="appr-risk" id="appr-risk" data-reversible="no">--</p>

          <!-- Multiple concrete options - docs/AUTONOMY-PROPOSALS.md §3a.
               Empty and hidden when the plan carries zero or one option; the
               card then behaves exactly as it always has (the static
               Approve button below). Each option here IS a full, bounded
               plan of its own, never a checkbox on one shared plan. -->
          <div
            class="appr-options"
            id="appr-options"
            hidden
            role="group"
            aria-label="Choose which version to approve"
          ></div>

          <!-- A note before the first decision - §3b. Submitting sends it
               back for a NEW proposal; it never edits the one on screen,
               same rule as everything else here: a plan that can change
               after being shown is not fully enumerated any more. -->
          <div class="appr-note-row">
            <input
              id="appr-note"
              class="appr-note-input"
              type="text"
              spellcheck="true"
              autocomplete="off"
              placeholder="Add something before deciding…"
            />
            <button
              class="icon-btn"
              id="btn-appr-note-send"
              title="Send this note - Jarvis will propose again"
              aria-label="Send note"
            >↵</button>
          </div>

          <div class="approval-actions">
            <button class="btn btn-approve" id="btn-appr-yes">Approve</button>
            <button class="btn btn-deny" id="btn-appr-no">Deny</button>
          </div>
        </section>

        <!-- One-shot capture -->
        <section class="capture-row">
          <button
            type="button"
            class="capture-target mono"
            id="capture-target"
            data-target="logseq"
            aria-label="Capture target: Logseq journal. Activate to switch to the Joplin vault."
          >#log</button>
          <input
            id="capture-input"
            class="capture-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Capture a note…"
          />
          <button
            class="icon-btn send-btn"
            id="btn-capture-send"
            title="File it (↵)"
            aria-label="File this capture"
          >↵</button>
        </section>

        <p class="widget-flash" id="widget-flash" hidden></p>
      </main>
    </div>

    <script type="module" src="widget.js"></script>
  </body>
</html>
