<!DOCTYPE html>
<html lang="en" data-state="collapsed">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Widget</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <!--
      The native window is 320px wide and transparent; this shell is the whole
      visible surface. widget.js measures it and asks the backend to match, so
      the frame always hugs the content exactly.
    -->
    <div id="widget-shell" class="widget-shell">
      <!-- ── Compact bar: always visible, doubles as the drag handle ────── -->
      <header class="widget-bar" data-tauri-drag-region>
        <div class="status-indicator" data-tauri-drag-region>
          <span class="dot" id="net-dot" title="Core connection"></span>
          <span class="val mono" id="gpu-temp-compact" title="GPU temperature">--°</span>
        </div>

        <div class="route-pill mono" id="route-pill" title="Active model route">LOCAL</div>

        <div class="quick-actions">
          <button class="icon-btn" id="btn-quick-log" title="Capture to the Logseq journal">
            #log
          </button>
          <button class="icon-btn" id="btn-quick-joplin" title="Capture to the Joplin vault">
            #jop
          </button>
          <button
            class="icon-btn pin-btn"
            id="btn-pin"
            aria-pressed="true"
            title="Floating above other windows"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M6 1.5h4l-.6 3.2 2.1 2.1v1.4H8.7V14L8 15l-.7-1V8.2H4.5V6.8l2.1-2.1L6 1.5Z" />
            </svg>
            <span class="sr-only">Toggle always on top</span>
          </button>
          <button class="icon-btn toggle-btn" id="btn-toggle-expand" title="Expand">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
            <span class="sr-only">Expand widget</span>
          </button>
        </div>
      </header>

      <!-- ── Expanded tray: telemetry, gates, capture ───────────────────── -->
      <main class="widget-tray" id="widget-tray" hidden>
        <section class="telemetry-grid">
          <div class="meter" id="meter-vram">
            <div class="meter-head">
              <span class="label">VRAM</span>
              <span class="val mono" id="vram-val">-- / -- GB</span>
            </div>
            <div class="meter-track"><i id="vram-bar" style="width: 0%"></i></div>
          </div>

          <div class="meter" id="meter-cpu">
            <div class="meter-head">
              <span class="label">CPU</span>
              <span class="val mono" id="cpu-val">--%</span>
            </div>
            <div class="meter-track"><i id="cpu-bar" style="width: 0%"></i></div>
          </div>

          <div class="meter" id="meter-gpu">
            <div class="meter-head">
              <span class="label">GPU</span>
              <span class="val mono" id="gpu-val">--% · --°</span>
            </div>
            <div class="meter-track"><i id="gpu-bar" style="width: 0%"></i></div>
          </div>
        </section>

        <!-- Pending autonomy gate -->
        <section
          class="approval-card"
          id="approval-card"
          hidden
          role="alertdialog"
          aria-live="assertive"
          aria-label="Approval required"
        >
          <div class="approval-header">
            <span class="warn-badge">APPROVAL REQUIRED</span>
            <span class="action-name mono" id="appr-action">--</span>
          </div>
          <p class="appr-detail" id="appr-detail">--</p>
          <!-- What getting the answer wrong costs. `risk` is derived by the
               gate at read time and is the only thing that tells send_email
               apart from switch_model, which are both tier `ask`. -->
          <p class="appr-risk" id="appr-risk" data-reversible="no">--</p>
          <div class="approval-actions">
            <button class="btn btn-approve" id="btn-appr-yes">Approve</button>
            <button class="btn btn-deny" id="btn-appr-no">Deny</button>
          </div>
        </section>

        <!-- One-shot capture -->
        <section class="capture-row">
          <button
            type="button"
            class="capture-target mono"
            id="capture-target"
            data-target="logseq"
            aria-label="Capture target: Logseq journal. Activate to switch to the Joplin vault."
          >#log</button>
          <input
            id="capture-input"
            class="capture-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Capture a note…"
          />
          <button
            class="icon-btn send-btn"
            id="btn-capture-send"
            title="File it (↵)"
            aria-label="File this capture"
          >↵</button>
        </section>

        <p class="widget-flash" id="widget-flash" hidden></p>
      </main>
    </div>

    <script type="module" src="widget.js"></script>
  </body>
</html>
